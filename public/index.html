<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007FFF">
<title>ZUA MOSALA — Portfolio certifié</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --rdc-blue:#007FFF; --rdc-blue-dark:#0059b3;
  --rdc-yellow:#FCD116; --rdc-red:#CE1126; --rdc-gold:#D4A017;
  --bg:#f7f9fc; --text:#0f172a; --card:#ffffff; --border:#e3e8ef;
  --light:#eef3fb; --muted:#64748b; --shadow:0 2px 8px rgba(0,127,255,.08);
}
:root[data-theme="dark"]{
  --bg:#0c1420; --text:#e8edf5; --card:#151e2e; --border:#233047;
  --light:#1b2739; --muted:#94a3b8; --shadow:0 2px 8px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .25s, color .25s;
}
header{
  background:linear-gradient(135deg,var(--rdc-blue) 0%,var(--rdc-blue-dark) 100%);
  color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;
  box-shadow:0 2px 10px rgba(0,0,0,.2);border-bottom:4px solid var(--rdc-yellow);
}
header .top{display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:1.05rem;display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.5px}
header .logo{width:26px;height:26px}
.back{cursor:pointer;font-size:1.3rem;background:none;border:none;color:#fff;padding:0 6px;line-height:1}
header .crumb{font-size:.68rem;opacity:.85;margin-top:4px}
.theme-btn{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1rem;padding:0;}
.theme-btn:hover{background:rgba(255,255,255,.25)}
main{max-width:520px;margin:0 auto;padding:16px}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:1.15rem}
.card h3{margin:0 0 6px;font-size:1rem}
.card h4{margin:16px 0 8px;font-size:.92rem;color:var(--rdc-blue-dark)}
:root[data-theme="dark"] .card h4{color:var(--rdc-yellow)}

label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;background:var(--bg);color:var(--text);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rdc-yellow);outline-offset:1px;border-color:var(--rdc-blue)}

button{background:var(--rdc-blue);color:#fff;border:none;padding:11px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.88rem;font-family:inherit;transition:opacity .15s,transform .1s}
button:hover{opacity:.92}
button:active{transform:scale(.98)}
button.secondary{background:transparent;color:var(--rdc-blue);border:1.5px solid var(--rdc-blue)}
:root[data-theme="dark"] button.secondary{color:var(--rdc-yellow);border-color:var(--rdc-yellow)}
button.gold{background:var(--rdc-yellow);color:#1a1a1a}
button:disabled{opacity:.4;cursor:not-allowed}
a.tile{display:block;text-decoration:none;color:inherit}
a{color:var(--rdc-blue)}
:root[data-theme="dark"] a{color:var(--rdc-yellow)}

.hero{background:linear-gradient(135deg,var(--rdc-blue) 0%,var(--rdc-blue-dark) 100%);
  color:#fff;border-radius:16px;overflow:hidden;margin-bottom:16px;
  box-shadow:0 6px 20px rgba(0,127,255,.25);border-bottom:4px solid var(--rdc-yellow);}
.hero-img{position:relative;height:220px;background-size:cover;background-position:center;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,127,255,.45) 0%,rgba(0,89,179,.85) 70%,#0059b3 100%);}
.hero-content{position:relative;padding:22px 18px;color:#fff;height:100%;display:flex;flex-direction:column;justify-content:flex-end;}
.hero-content h1{font-size:1.75rem;margin:0 0 8px;line-height:1.15;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.hero-content h1 span{color:var(--rdc-yellow)}
.hero-content p{margin:0;font-size:.9rem;opacity:.97;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.hero-body{padding:16px 18px;color:#fff;}
.hero-body p{margin:0 0 8px;font-size:.88rem;opacity:.95}
.hero-tagline{font-size:.75rem;opacity:.85;font-style:italic;border-top:1px solid rgba(255,255,255,.2);padding-top:10px}

.pillar{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--light);border-radius:12px;margin-bottom:10px;border-left:4px solid var(--rdc-yellow)}
.pillar img{width:60px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0}
.pillar .txt{font-size:.85rem}
.pillar .txt b{display:block;margin-bottom:2px;color:var(--rdc-blue-dark)}
:root[data-theme="dark"] .pillar .txt b{color:var(--rdc-yellow)}
.pillar .txt span{color:var(--muted)}

.choice{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice a{display:block;text-decoration:none}
.choice-btn{width:100%;padding:16px;border-radius:12px;font-weight:700;font-size:.95rem;
  display:flex;align-items:center;gap:12px;text-align:left;border:2px solid transparent;
  cursor:pointer;transition:transform .1s;font-family:inherit;position:relative;overflow:hidden;}
.choice-btn:hover{transform:translateY(-2px)}
.choice-btn.primary{background:linear-gradient(135deg,var(--rdc-blue),var(--rdc-blue-dark));color:#fff}
.choice-btn.secondary{background:var(--card);color:var(--rdc-blue-dark);border-color:var(--border);box-shadow:var(--shadow)}
:root[data-theme="dark"] .choice-btn.secondary{color:var(--rdc-yellow)}
.choice-btn svg{width:30px;height:30px}
.choice-btn .arrow{margin-left:auto;font-size:1.2rem;opacity:.6}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;color:#fff;vertical-align:middle}
.badge.bronze{background:#a06a3c}
.badge.argent{background:#7a7a7a}
.badge.or{background:var(--rdc-gold)}
.badge.premium{background:var(--rdc-red);font-size:.65rem;padding:2px 7px}

.stars{color:var(--rdc-gold);font-size:.95rem;letter-spacing:1px}
.result{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:8px}
.result:last-child{border:none}
.result a{flex:1;text-decoration:none;color:inherit;display:block}
.spon{background:var(--light);border:1px dashed var(--rdc-yellow);border-radius:10px;padding:10px;margin-bottom:8px}
.spon-tag{font-size:.65rem;background:var(--rdc-yellow);color:#1a1a1a;padding:2px 6px;border-radius:10px;font-weight:700;margin-left:6px}
.small{font-size:.75rem;color:var(--muted)}
.principle{background:var(--light);border-left:4px solid var(--rdc-yellow);padding:10px 12px;font-size:.82rem;font-weight:600;color:var(--rdc-blue-dark);border-radius:6px;margin:12px 0}
:root[data-theme="dark"] .principle{color:var(--rdc-yellow)}
.star-pick span{font-size:1.8rem;cursor:pointer;opacity:.3;transition:opacity .1s;color:var(--rdc-gold)}
.star-pick span.on{opacity:1}
#qr{display:flex;justify-content:center;margin:10px 0}
.avisItem{border-top:1px solid var(--border);padding:10px 0;font-size:.85rem}
.avisItem:first-child{border-top:none}
.reponse{background:var(--light);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:.8rem}
.checkline{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;margin-top:10px}
.checkline input{width:auto;margin-top:3px}
.consent{font-size:.72rem;color:var(--muted);line-height:1.4}
.loader{text-align:center;padding:30px;color:var(--muted)}
.rdc-banner{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:linear-gradient(90deg,rgba(0,127,255,.08),rgba(252,209,22,.08),rgba(206,17,38,.08));
  border-radius:10px;margin-bottom:14px;font-size:.75rem;color:var(--muted);
  border-left:3px solid var(--rdc-yellow);}
.rdc-banner svg{width:28px;height:28px;flex-shrink:0}
.mission-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:8px}
.mission-item:last-child{border:none}
.mission-info{flex:1}
.photo-block{padding:0;overflow:hidden}
.photo-block img{width:100%;height:200px;object-fit:cover;display:block}
.photo-block .photo-body{padding:14px 16px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.photo-grid img{width:100%;height:130px;object-fit:cover;display:block}
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="back" id="backBtn" onclick="history.back()" aria-label="Retour">‹</button>
    <h1 id="headerTitle">
      <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#FCD116" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      ZUA MOSALA
    </h1>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Changer de thème" id="themeBtn">🌙</button>
  </div>
  <div class="crumb" id="crumb"></div>
</header>
<main id="app"><div class="loader">Chargement…</div></main>

<script>
/* ========== THEME ========== */
(function initTheme(){
  const saved = localStorage.getItem('zua_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
})();
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('zua_theme', next);
  updateThemeBtn();
}
function updateThemeBtn(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = cur === 'dark' ? '☀️' : '🌙';
}

/* ========== API ========== */
const API = '/api';

/* ========== HELPERS ========== */
function badgeRank(b){return {bronze:0,argent:1,or:2}[b];}
function avg(avis){return avis.length?avis.reduce((s,x)=>s+x.note,0)/avis.length:0;}
function stars(n){const f=Math.round(n);return "★".repeat(f)+"☆".repeat(5-f);}
function badgeLabel(b){return {bronze:"Bronze",argent:"Argent",or:"Or"}[b];}
function nav(h){location.hash=h;}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ========== ÉTAT ========== */
let profiles=[];
let missions=[];
let monProfilId = sessionStorage.getItem("zua_mon_id") ? parseInt(sessionStorage.getItem("zua_mon_id"),10) : null;
let employeurType = localStorage.getItem("zua_emp_type") || "particulier";
let employeurId = localStorage.getItem("zua_emp_id") || "emp-"+Math.random().toString(36).slice(2,8);
localStorage.setItem("zua_emp_id",employeurId);
let employeurVerifie = localStorage.getItem("zua_emp_verifie")==="1";
let employeurReference = localStorage.getItem("zua_emp_ref")||"";

/* ========== API CALLS ========== */
async function chargerProfils(){const r=await fetch(API+'/profils');if(!r.ok)throw new Error('Erreur chargement profils');return await r.json();}
async function chargerProfil(id){const r=await fetch(API+'/profils/'+id);if(!r.ok)throw new Error('Profil introuvable');return await r.json();}
async function apiCreerProfil(body){const r=await fetch(API+'/profils',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
async function apiAjouterAvis(body){const r=await fetch(API+'/avis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
async function apiVerifierEmployeur(body){const r=await fetch(API+'/employeurs/verifier',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
async function apiRepondreAvis(avisId,reponse){const r=await fetch(API+'/avis/'+avisId+'/reponse',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({reponse})});return await r.json();}
async function apiAjouterPreuve(id,preuve){const r=await fetch(API+'/profils/'+id+'/preuve',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({preuve})});return await r.json();}
async function apiActiverPremium(id){const r=await fetch(API+'/profils/'+id+'/premium',{method:'PUT',headers:{'Content-Type':'application/json'}});return await r.json();}
async function apiListerMissions(){const r=await fetch(API+'/missions');return await r.json();}
async function apiCreerMission(body){const r=await fetch(API+'/missions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
async function apiStats(){const r=await fetch(API+'/stats');return await r.json();}

/* ========== ROUTER ========== */
function parseHash(){const h=(location.hash.slice(1)||"/");const [path,qs]=h.split("?");return {segs:path.split("/").filter(Boolean),params:new URLSearchParams(qs||"")};}
function setHeader(title,crumb,showBack){
  document.getElementById("headerTitle").innerHTML=
    `<svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#FCD116" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg> ${title}`;
  document.getElementById("crumb").textContent=crumb||"";
  document.getElementById("backBtn").style.visibility=showBack?"visible":"hidden";
}

async function router(){
  const {segs,params}=parseHash();
  const app=document.getElementById("app");
  app.innerHTML=`<div class="loader">Chargement…</div>`;
  updateThemeBtn();

  try{
    if(segs.length===0){
      setHeader("ZUA MOSALA","Le portfolio certifié des compétences informelles",false);
      profiles=await chargerProfils();
      missions=await apiListerMissions();
      app.innerHTML=pageHome();
      return;
    }
    if(segs[0]==="jeune"&&segs[1]==="creer"){
      setHeader("Créer mon profil","Accueil › Autodidacte",true);
      app.innerHTML=pageCreer();
      return;
    }
    if(segs[0]==="jeune"&&segs[1]==="profil"){
      if(!monProfilId){nav("/jeune/creer");return;}
      setHeader("Mon profil","Accueil › Autodidacte",true);
      const p=await chargerProfil(monProfilId);
      app.innerHTML=pageMonProfil(p);
      const el=document.getElementById("qr");
      if(el){
        el.innerHTML="";
        new QRCode(el,{text:"zua-mosala.app/profil/"+p.id,width:130,height:130,colorDark:"#007FFF",colorLight:"#ffffff"});
      }
      return;
    }
    if(segs[0]==="jeune"&&segs[1]==="vitrine"){
      setHeader("Booster ma vitrine","Mon profil › Premium",true);
      const p=await chargerProfil(monProfilId);
      app.innerHTML=pageVitrine(p);
      return;
    }
    if(segs[0]==="missions"){
      setHeader("Missions disponibles","Missions ouvertes",true);
      missions=await apiListerMissions();
      app.innerHTML=pageMissionsPubliques(missions);
      return;
    }
    if(segs[0]==="employeur"&&segs.length===1){
      setHeader("Espace employeur","Accueil › Employeur",true);
      app.innerHTML=pageEmployeurAccueil();
      const sel=document.getElementById("e-type");
      if(sel && employeurType){ sel.value=employeurType; }
      renderVerifZone();
      return;
    }
    if(segs[0]==="employeur"&&segs[1]==="publier"){
      setHeader("Publier une mission","Employeur › Mission",true);
      app.innerHTML=pagePublierMission();
      return;
    }
    if(segs[0]==="employeur"&&segs[1]==="resultats"){
      setHeader("Résultats","Employeur › Recherche",true);
      profiles=await chargerProfils();
      app.innerHTML=pageResultats(params);
      return;
    }
    if(segs[0]==="institution"&&segs[1]==="dashboard"){
      setHeader("Rapports institutionnels","Institution › Statistiques",true);
      const stats=await apiStats();
      app.innerHTML=pageStats(stats);
      return;
    }
    if(segs[0]==="profil"&&segs.length===2){
      setHeader("Fiche profil","Résultats › Profil",true);
      const p=await chargerProfil(segs[1]);
      app.innerHTML=pageFiche(p);
      return;
    }
    if(segs[0]==="profil"&&segs[2]==="mission"){
      setHeader("Confirmer la mission","Profil › Mission",true);
      app.innerHTML=pageMission(segs[1]);
      return;
    }
    if(segs[0]==="profil"&&segs[2]==="avis"){
      setHeader("Laisser un avis","Profil › Mission › Avis",true);
      app.innerHTML=pageAvis(segs[1]);
      return;
    }
    app.innerHTML=`<div class="card"><p>Page introuvable.</p></div>`;
  }catch(e){
    app.innerHTML=`<div class="card"><h3>Erreur</h3><p class="small">${escapeHtml(e.message)}</p></div>`;
  }
}
window.addEventListener("hashchange",router);

/* ========== SVG MINI DRAPEAU ========== */
const ILLU_RDC_MINI = `
<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect x="4" y="8" width="32" height="24" rx="3" fill="#007FFF"/>
  <path d="M4 26 L36 26" stroke="#FCD116" stroke-width="3"/>
  <path d="M4 32 L36 32" stroke="#CE1126" stroke-width="3"/>
  <path d="M12 15 L14 19 L18 19 L15 22 L16 26 L12 23 L8 26 L9 22 L6 19 L10 19 Z" fill="#FCD116"/>
</svg>`;

/* ========== HOME ========== */
function pageHome(){
  const dejaInscrit = !!monProfilId;
  return `
  <div class="hero">
    <div class="hero-img" style="background-image:url('https://images.unsplash.com/photo-1591035897819-f4bdf739f446?w=800&q=80');">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1>ZUA <span>MOSALA</span></h1>
        <p><b>Le portfolio numérique qui transforme ton savoir-faire en badge vérifié.</b></p>
      </div>
    </div>
    <div class="hero-body">
      <p>Créé pour les jeunes autodidactes de Kinshasa. Utilisé par les employeurs qui recrutent sur la preuve, pas sur le diplôme.</p>
      <div class="hero-tagline">« Le travail, la preuve. »</div>
    </div>
  </div>

  <div class="rdc-banner">
    ${ILLU_RDC_MINI}
    <div>Un projet conçu à Kinshasa, en République Démocratique du Congo, pour valoriser la débrouille et le talent local.</div>
  </div>

  <div class="card photo-block">
    <img src="https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?w=800&q=80" alt="Jeune artisan au travail">
    <div class="photo-body">
      <h3 style="margin:0 0 6px">Le talent est partout. La preuve nulle part.</h3>
      <p class="small" style="margin:0">
        À Kinshasa, des milliers de jeunes savent coudre, souder, réparer, coiffer, construire.
        Mais aucun diplôme ne le prouve. Et aucun employeur ne peut le vérifier.
      </p>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Comment ça marche</h3>
    <div class="pillar">
      <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=200&q=80" alt="Jeune autodidacte">
      <div class="txt"><b>1. Le jeune crée son profil</b><span>Nom, métier, commune, réalisations concrètes. Gratuit.</span></div>
    </div>
    <div class="pillar">
      <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?w=200&q=80" alt="Employeur">
      <div class="txt"><b>2. L'employeur recrute et note</b><span>Après la mission, il donne une note sur 5 étoiles et un commentaire.</span></div>
    </div>
    <div class="pillar">
      <img src="https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=200&q=80" alt="Badge vérifié">
      <div class="txt"><b>3. Le badge se construit</b><span>Bronze (déclaré), Argent (3 avis ≥3★), Or (5 avis ≥4★). Impossible à acheter.</span></div>
    </div>
    <div class="principle">Le badge repose uniquement sur la preuve terrain. Aucun diplôme requis. Aucun paiement pour être certifié.</div>
  </div>

  <div class="card photo-block" style="padding:0">
    <div class="photo-grid">
      <img src="https://images.unsplash.com/photo-1595278069441-2cf29f8005a4?w=400&q=80" alt="Coiffure">
      <img src="https://images.unsplash.com/photo-1605647540924-852290f6b0d5?w=400&q=80" alt="Couture">
      <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=400&q=80" alt="Mécanique">
      <img src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=400&q=80" alt="Électricité">
    </div>
    <div class="photo-body">
      <h3 style="margin:0 0 6px">Des métiers, pas des diplômes.</h3>
      <p class="small" style="margin:0">
        Coiffure, couture, mécanique, électricité, menuiserie, soudure, cuisine, réparation.
        Chaque métier a sa place dans ZUA MOSALA.
      </p>
    </div>
  </div>

  <div class="card">
