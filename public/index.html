<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007FFF">
<title>ZUA MOSALA — Portfolio certifié</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --blue:#007FFF; --blue-dark:#0059b3; --blue-deep:#003d80;
  --yellow:#FCD116; --red:#CE1126; --gold:#D4A017;
  --bg:#f5f7fa; --surface:#ffffff; --text:#0f172a; --text-soft:#64748b;
  --border:#e5e9f0; --light:#f0f4f9;
  --shadow:0 1px 3px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.04);
}
:root[data-theme="dark"]{
  --bg:#0a1018; --surface:#131b28; --text:#e8edf5; --text-soft:#8b96a8;
  --border:#1f2a3d; --light:#1a2333;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .2s, color .2s;-webkit-font-smoothing:antialiased;
}

/* === HEADER === */
header{
  position:sticky;top:0;z-index:10;
  background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
}
:root[data-theme="dark"] header{background:rgba(19,27,40,.9)}
.header-inner{padding:12px 16px}
header .top{display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
header .logo{width:26px;height:26px;flex-shrink:0}
.back{cursor:pointer;font-size:1.4rem;background:none;border:none;color:var(--text);padding:0 4px;line-height:1;font-weight:300}
.theme-btn{margin-left:auto;background:var(--light);border:none;color:var(--text);
  width:34px;height:34px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;padding:0;transition:background .2s;}
.theme-btn:hover{background:var(--border)}
header .crumb{font-size:.68rem;color:var(--text-soft);margin-top:4px;margin-left:2px}
.rdc-stripes{display:flex;height:4px}
.rdc-stripes div{flex:1}

main{max-width:520px;margin:0 auto;padding:16px 16px 40px}

/* === CARDS === */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);transition:box-shadow .2s}
.card h2{margin:0 0 8px;font-size:1.1rem;letter-spacing:-.3px}
.card h3{margin:0 0 8px;font-size:.98rem;font-weight:700;letter-spacing:-.2px}
.card h4{margin:18px 0 10px;font-size:.85rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
:root[data-theme="dark"] .card h4{color:var(--yellow)}

label{display:block;font-size:.78rem;font-weight:600;margin:12px 0 6px;color:var(--text)}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:var(--surface)}
:root[data-theme="dark"] input:focus,:root[data-theme="dark"] select:focus,:root[data-theme="dark"] textarea:focus{background:var(--bg)}

button{background:var(--blue);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer;font-size:.88rem;font-family:inherit;transition:opacity .15s,transform .08s;letter-spacing:-.1px}
button:hover{opacity:.94}
button:active{transform:scale(.985)}
button.secondary{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
:root[data-theme="dark"] button.secondary{color:var(--yellow);border-color:var(--yellow)}
button.gold{background:var(--yellow);color:#1a1a1a}
button.ghost{background:var(--light);color:var(--text)}
button:disabled{opacity:.4;cursor:not-allowed}
a.tile{display:block;text-decoration:none;color:inherit}
a{color:var(--blue);text-decoration:none}
:root[data-theme="dark"] a{color:var(--yellow)}

/* === HERO SANS IMAGE === */
.hero{
  border-radius:18px;overflow:hidden;margin-bottom:16px;
  box-shadow:0 8px 28px rgba(0,127,255,.22);
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 60%,var(--blue-deep) 100%);
  position:relative;color:#fff;
}
.hero-top{display:flex;height:5px}
.hero-top div{flex:1}
.hero-content{padding:26px 22px 22px;position:relative;overflow:hidden}
.hero-content::before{
  content:"";position:absolute;top:-40px;right:-40px;width:180px;height:180px;
  border-radius:50%;background:var(--yellow);opacity:.18;
}
.hero-content::after{
  content:"";position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;
  border-radius:50%;background:var(--red);opacity:.12;
}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(252,209,22,.2);color:var(--yellow);padding:5px 10px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.5px;margin-bottom:14px;position:relative;z-index:1}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--yellow)}
.hero h1{font-size:2rem;margin:0 0 8px;font-weight:800;letter-spacing:-1px;position:relative;z-index:1;line-height:1.1}
.hero h1 span{color:var(--yellow)}
.hero .tag{font-size:.88rem;opacity:.95;margin:0;line-height:1.45;position:relative;z-index:1;max-width:90%}
.hero-footer{padding:14px 22px;background:rgba(0,0,0,.18);font-size:.8rem;line-height:1.4;opacity:.95}

/* === WIDGET PANEL (illustration sans image) === */
.widget-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.widget-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.widget-item{padding:14px 12px;border-radius:12px;background:var(--light);text-align:center;position:relative;overflow:hidden}
.widget-item .num{font-size:1.4rem;font-weight:800;color:var(--blue);letter-spacing:-.5px}
:root[data-theme="dark"] .widget-item .num{color:var(--yellow)}
.widget-item .lbl{font-size:.7rem;color:var(--text-soft);margin-top:4px;font-weight:600}
.widget-item::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.widget-item.c1::before{background:var(--blue)}
.widget-item.c2::before{background:var(--yellow)}
.widget-item.c3::before{background:var(--red)}
.widget-item.c4::before{background:var(--gold)}

/* === PILIERS sans images === */
.pillar{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.pillar:last-of-type{border-bottom:none}
.pillar-icon{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;color:#fff;font-weight:800;font-size:1.1rem}
.pillar-icon.p1{background:linear-gradient(135deg,#007FFF,#0059b3)}
.pillar-icon.p2{background:linear-gradient(135deg,#FCD116,#D4A017);color:#1a1a1a}
.pillar-icon.p3{background:linear-gradient(135deg,#CE1126,#8b0a1a)}
.pillar-icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pillar .txt{font-size:.85rem;line-height:1.4}
.pillar .txt b{display:block;margin-bottom:2px;color:var(--text);font-size:.88rem}
.pillar .txt span{color:var(--text-soft)}

/* === BANNIÈRE RDC === */
.rdc-strip{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;font-size:.75rem;color:var(--text-soft);line-height:1.45}
.rdc-flag{width:28px;height:28px;border-radius:8px;overflow:hidden;flex-shrink:0;display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(0,127,255,.3)}
.rdc-flag div{flex:1}

/* === MÉTIERS widget === */
.metiers-widget{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metier{background:var(--light);padding:14px;border-radius:12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.metier .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.metier .dot.c1{background:var(--blue)}
.metier .dot.c2{background:var(--yellow)}
.metier .dot.c3{background:var(--red)}
.metier .dot.c4{background:var(--gold)}
.metier .lbl{font-size:.78rem;font-weight:600;color:var(--text)}

/* === CHOICE === */
.choice{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice a{display:block;text-decoration:none}
.choice-btn{width:100%;padding:15px 16px;border-radius:14px;font-weight:600;font-size:.92rem;
  display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid transparent;
  cursor:pointer;transition:transform .1s, border-color .15s;font-family:inherit;background:var(--surface);}
.choice-btn:hover{transform:translateY(-1px)}
.choice-btn.primary{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);color:#fff;position:relative;overflow:hidden}
.choice-btn.primary::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--yellow)}
.choice-btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.choice-btn.secondary:hover{border-color:var(--blue)}
.choice-btn .ico{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.choice-btn.secondary .ico{background:var(--light)}
.choice-btn .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.choice-btn.primary .ico svg{stroke:var(--yellow)}
.choice-btn .txt{flex:1}
.choice-btn .txt b{display:block;font-size:.92rem}
.choice-btn .txt span{font-size:.75rem;opacity:.75;font-weight:400;display:block;margin-top:2px}
.choice-btn .arrow{opacity:.5;font-size:1rem}

/* === BADGES === */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:700;color:#fff;vertical-align:middle;letter-spacing:.2px}
.badge.bronze{background:#a06a3c}
.badge.argent{background:#7a7a7a}
.badge.or{background:var(--gold)}
.badge.premium{background:var(--red);font-size:.62rem;padding:2px 6px}

.stars{color:var(--gold);font-size:.92rem;letter-spacing:.5px}
.result{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:10px}
.result:last-child{border:none}
.result a{flex:1;text-decoration:none;color:inherit;display:block}
.spon{background:var(--light);border:1px dashed var(--gold);border-radius:12px;padding:12px;margin-bottom:8px}
.spon-tag{font-size:.6rem;background:var(--gold);color:#fff;padding:2px 6px;border-radius:10px;font-weight:700;margin-left:6px;letter-spacing:.3px}
.small{font-size:.74rem;color:var(--text-soft);line-height:1.4}
.principle{background:var(--light);border-left:3px solid var(--yellow);padding:10px 14px;font-size:.78rem;font-weight:500;color:var(--text);border-radius:8px;margin:14px 0;line-height:1.45}

.star-pick span{font-size:1.9rem;cursor:pointer;opacity:.25;transition:opacity .12s;color:var(--gold);user-select:none}
.star-pick span.on{opacity:1}
#qr{display:flex;justify-content:center;margin:12px 0;padding:14px;background:#fff;border-radius:12px}
.avisItem{border-top:1px solid var(--border);padding:12px 0;font-size:.85rem}
.avisItem:first-child{border-top:none}
.reponse{background:var(--light);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:.78rem}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;margin-top:12px;line-height:1.4}
.checkline input{width:auto;margin-top:2px;flex-shrink:0}
.consent{font-size:.7rem;color:var(--text-soft);line-height:1.45}
.loader{text-align:center;padding:40px;color:var(--text-soft);font-size:.85rem}
.mission-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:10px}
.mission-item:last-child{border:none}
.mission-info{flex:1}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="top">
      <button class="back" id="backBtn" onclick="history.back()" aria-label="Retour">‹</button>
      <h1 id="headerTitle">
        <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#007FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="4" r="2" fill="#FCD116"/>
        </svg>
        ZUA MOSALA
      </h1>
      <button class="theme-btn" onclick="toggleTheme()" aria-label="Changer de thème" id="themeBtn">🌙</button>
    </div>
    <div class="crumb" id="crumb"></div>
  </div>
  <div class="rdc-stripes"><div style="background:#007FFF"></div><div style="background:#FCD116"></div><div style="background:#CE1126"></div></div>
</header>
<main id="app"><div class="loader">Chargement…</div></main>

<script>
/* ========== THEME ========== */
(function initTheme(){
  const saved = localStorage.getItem('zua_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
})();
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('zua_theme', next);
  updateThemeBtn();
}
function updateThemeBtn(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = cur === 'dark' ? '☀️' : '🌙';
}

const API = '/api';
function badgeRank(b){return {bronze:0,argent:1,or:2}[b];}
function avg(avis){return avis.length?avis.reduce((s,x)=>s+x.note,0)/avis.length:0;}
function stars(n){const f=Math.round(n);return "★".repeat(f)+"☆".repeat(5-f);}
function badgeLabel(b){return {bronze:"Bronze",argent:"Argent",or:"Or"}[b];}
function nav(h){location.hash=h;}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

let profiles=[];
let missions=[];
let monProfilId = sessionStorage.getItem("zua_mon_id") ? parseInt(sessionStorage.getItem("zua_mon_id"),10) : null;
let employeurType = localStorage.getItem("zua_emp_type") || "particulier";
let employeurId = localStorage.getItem("zua_emp_id") || "emp-"+Math.random().toString(36).slice(2,8);
localStorage.setItem("zua_emp_id",employeurId);
let employeurVerifie = localStorage.getItem("zua_emp_verifie")==="1";
let employeurReference = localStorage.getItem("zua_emp_ref")||"";

async function chargerProfils(){const r=await fetch(API+'/profils');if(!r.ok)throw new Error('Erreur serveur '+r.status);return await r.json();}
async function chargerProfil(id){const r=await fetch(API+'/profils/'+id);if(!r.ok)throw new Error('Profil introuvable');return await r.json();}
async function apiCreerProfil(body){const r=await fetch(API+'/profils',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
async function apiAjouterAvis(body){const r=await fetch(API+'/avis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
async function apiVerifierEmployeur(body){const r=await fetch(API+'/employeurs/verifier',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
async function apiRepondreAvis(avisId,reponse){const r=await fetch(API+'/avis/'+avisId+'/reponse',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({reponse})});return await r.json();}
async function apiAjouterPreuve(id,preuve){const r=await fetch(API+'/profils/'+id+'/preuve',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({preuve})});return await r.json();}
async function apiActiverPremium(id){const r=await fetch(API+'/profils/'+id+'/premium',{method:'PUT',headers:{'Content-Type':'application/json'}});return await r.json();}
async function apiListerMissions(){const r=await fetch(API+'/missions');return await r.json();}
async function apiCreerMission(body){const r=await fetch(API+'/missions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
async function apiStats(){const r=await fetch(API+'/stats');return await r.json();}

function parseHash(){const h=(location.hash.slice(1)||"/");const [path,qs]=h.split("?");return {segs:path.split("/").filter(Boolean),params:new URLSearchParams(qs||"")};}
function setHeader(title,crumb,showBack){
  document.getElementById("headerTitle").innerHTML=`
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#007FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="4" r="2" fill="#FCD116"/>
    </svg> ${title}`;
  document.getElementById("crumb").textContent=crumb||"";
  document.getElementById("backBtn").style.visibility=showBack?"visible":"hidden";
}

async function router(){
  const {segs,params}=parseHash();
  const app=document.getElementById("app");
  app.innerHTML=`<div class="loader">Chargement…</div>`;
  updateThemeBtn();
  const timeoutId = setTimeout(()=>{
    if(app.innerHTML.includes("Chargement")){
      app.innerHTML=`<div class="card"><h3>Le serveur met du temps à répondre</h3><p class="small">Attends 30 secondes puis recharge.</p><button onclick="router()">Réessayer</button></div>`;
    }
  }, 8000);
  try{
    if(segs.length===0){
      setHeader("ZUA MOSALA","Le portfolio certifié des compétences informelles",false);
      try{ profiles = await chargerProfils(); }catch(e){ profiles = []; }
      try{ missions = await apiListerMissions(); }catch(e){ missions = []; }
      app.innerHTML=pageHome();
      return;
    }
    if(segs[0]==="jeune"&&segs[1]==="creer"){setHeader("Créer mon profil","Accueil › Autodidacte",true);app.innerHTML=pageCreer();return;}
    if(segs[0]==="jeune"&&segs[1]==="profil"){
      if(!monProfilId){nav("/jeune/creer");return;}
      setHeader("Mon profil","Accueil › Autodidacte",true);
      const p=await chargerProfil(monProfilId);
      app.innerHTML=pageMonProfil(p);
      const el=document.getElementById("qr");
      if(el){el.innerHTML="";try{new QRCode(el,{text:"zua-mosala.app/profil/"+p.id,width:130,height:130,colorDark:"#007FFF",colorLight:"#ffffff"});}catch(e){}}
      return;
    }
    if(segs[0]==="jeune"&&segs[1]==="vitrine"){setHeader("Booster ma vitrine","Mon profil › Premium",true);const p=await chargerProfil(monProfilId);app.innerHTML=pageVitrine(p);return;}
    if(segs[0]==="missions"){setHeader("Missions disponibles","Missions ouvertes",true);try{missions=await apiListerMissions();}catch(e){missions=[];}app.innerHTML=pageMissionsPubliques(missions);return;}
    if(segs[0]==="employeur"&&segs.length===1){
      setHeader("Espace employeur","Accueil › Employeur",true);
      app.innerHTML=pageEmployeurAccueil();
      const sel=document.getElementById("e-type");
      if(sel && employeurType){sel.value=employeurType;}
      renderVerifZone();
      return;
    }
    if(segs[0]==="employeur"&&segs[1]==="publier"){setHeader("Publier une mission","Employeur › Mission",true);app.innerHTML=pagePublierMission();return;}
    if(segs[0]==="employeur"&&segs[1]==="resultats"){setHeader("Résultats","Employeur › Recherche",true);try{profiles=await chargerProfils();}catch(e){profiles=[];}app.innerHTML=pageResultats(params);return;}
    if(segs[0]==="institution"&&segs[1]==="dashboard"){setHeader("Rapports institutionnels","Institution › Statistiques",true);try{const stats=await apiStats();app.innerHTML=pageStats(stats);}catch(e){app.innerHTML=`<div class="card"><p>Impossible de charger les stats.</p></div>`;}return;}
    if(segs[0]==="profil"&&segs.length===2){setHeader("Fiche profil","Résultats › Profil",true);const p=await chargerProfil(segs[1]);app.innerHTML=pageFiche(p);return;}
    if(segs[0]==="profil"&&segs[2]==="mission"){setHeader("Confirmer la mission","Profil › Mission",true);app.innerHTML=pageMission(segs[1]);return;}
    if(segs[0]==="profil"&&segs[2]==="avis"){setHeader("Laisser un avis","Profil › Mission › Avis",true);app.innerHTML=pageAvis(segs[1]);return;}
    app.innerHTML=`<div class="card"><p>Page introuvable.</p></div>`;
  }catch(e){
    app.innerHTML=`<div class="card"><h3>Erreur</h3><p class="small">${escapeHtml(e.message)}</p><button onclick="router()">Réessayer</button></div>`;
  } finally { clearTimeout(timeoutId); }
}
window.addEventListener("hashchange",router);

/* ========== HOME ========== */
function pageHome(){
  const dejaInscrit = !!monProfilId;
  return `
  <div class="hero">
    <div class="hero-top"><div style="background:#007FFF"></div><div style="background:#FCD116"></div><div style="background:#CE1126"></div></div>
    <div class="hero-content">

async function creerProfil(btn){

  if(!document.getElementById("f-consent").checked){alert("Le consentement est requis.");return;}
  if(btn){btn.disabled=true;btn.textContent="Création en cours…";}
  const body={nom,metier:document.getElementById("f-metier").value.trim(),commune:document.getElementById("f-commune").value.trim(),description:document.getElementById("f-desc").value.trim(),contact:document.getElementById("f-contact").value.trim(),consentement:true};
  const data=await apiCreerProfil(body);
  if(data.error){alert(data.error);if(btn){btn.disabled=false;btn.textContent="Créer mon profil — gratuit";}return;}
  monProfilId=data.id;
  sessionStorage.setItem("zua_mon_id",monProfilId);
  nav("/jeune/profil");
}

function pageResultats(params){

  const filtered=profiles.filter(filt);
  const sorted=filtered.slice().sort((a,b)=>{const rb=badgeRank(b.badge)-badgeRank(a.badge);if(rb!==0)return rb;const ra=(parseFloat(b.moyenne)||0)-(parseFloat(a.moyenne)||0);if(ra!==0)return ra;return (b.nb_avis||0)-(a.nb_avis||0);});
  const sponsored=filtered.filter(p=>p.vitrine_premium);
  const listHtml=sorted.length
    ? sorted.map(p=>`
      <div class="result">

        </a>

    : `<div class="small">Aucun profil ne correspond. Élargis la recherche.</div>`;

    : "";
  return `

    <div class="small" style="margin-bottom:10px">Classement par mérite : badge, puis note moyenne, puis nombre d'avis.</div>

  </div>

}

    </div>
    <p style="font-size:.88rem;margin:12px 0;color:var(--text-soft)">${escapeHtml(p.description||'')}</p>
    ${p.preuve_url?`<img src="${p.preuve_url}" style="max-width:100%;border-radius:10px;margin-bottom:10px">`:""}
    <div class="stars">${(p.avis&&p.avis.length)?stars(avg(p.avis))+" ("+p.avis.length+" avis)":"Pas encore d'avis"}</div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="alert('Contact : ${escapeHtml(p.contact||'')}')">📞 Contacter</button>
      ${dejaNote?`<button class="secondary" disabled style="flex:1">✓ Tu as déjà laissé un avis</button>`:`<a class="tile" href="#/profil/${p.id}/mission" style="flex:1"><button class="gold" style="width:100%">J'ai réalisé une mission</button></a>`}
    </div>
    <div class="principle">Un avis n'est possible qu'après confirmation mutuelle qu'une mission a bien été réalisée. Cela écarte les faux avis.</div>
    <h4>Avis récents</h4>
    ${avisHtml}
  </div>`;
}

/* ========== MISSION ========== */
function pageMission(id){
  return `
  <div class="card">
    <h3>Confirmer la mission</h3>
    <p class="small">Pour garantir l'authenticité des avis, les deux parties doivent confirmer qu'une mission a bien eu lieu avant de pouvoir noter.</p>
    <div class="checkline"><input type="checkbox" id="m-jeune"><label style="margin:0">Le prestataire confirme la mission réalisée</label></div>
    <div class="checkline"><input type="checkbox" id="m-emp"><label style="margin:0">L'employeur confirme la mission réalisée</label></div>
    <button style="margin-top:16px;width:100%" onclick="confirmerMission(${id})">Confirmer et passer à la notation</button>
  </div>`;
}
function confirmerMission(id){if(!document.getElementById("m-jeune").checked||!document.getElementById("m-emp").checked){alert("Les deux parties doivent confirmer la mission.");return;}nav("/profil/"+id+"/avis");}

/* ========== AVIS ========== */
let noteChoisie=0;
function pageAvis(id){
  noteChoisie=0;
  return `
  <div class="card">
    <h3>Noter ce profil</h3>
    <p class="small">Ta note alimente directement le badge du prestataire.</p>
    <div class="star-pick" id="starPick" style="margin:16px 0">${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="pickStar(${n})">★</span>`).join("")}</div>
    <label>Commentaire (optionnel — 180 caractères max)</label>
    <textarea id="commentaire" rows="3" maxlength="180" placeholder="Ex: travail rapide et soigné."></textarea>
    <button style="margin-top:16px;width:100%" onclick="validerAvis(${id},this)">Envoyer l'avis</button>
  </div>`;
}
function pickStar(n){noteChoisie=n;document.querySelectorAll("#starPick span").forEach((s,i)=>s.classList.toggle("on",i<n));}
async function validerAvis(id,btn){
  if(!noteChoisie){alert("Choisis une note.");return;}
  if(btn){btn.disabled=true;btn.textContent="Envoi…";}
  const commentaire=document.getElementById("commentaire").value;
  const data=await apiAjouterAvis({profil_id:parseInt(id,10),employeur_id:employeurId,note:noteChoisie,commentaire});
  if(data.error){alert(data.error);if(btn){btn.disabled=false;btn.textContent="Envoyer l'avis";}return;}
  alert("Avis enregistré.\nBadge actuel : "+badgeLabel(data.badge));
  nav("/profil/"+id);
}

/* ========== STATS ========== */
function pageStats(s){
  if(!s||s.error)return `<div class="card"><p>Erreur de chargement des statistiques.</p></div>`;
  const communes=(s.par_commune||[]).map(c=>`<div class="result"><span>${escapeHtml(c.commune||'—')}</span><b>${c.total}</b></div>`).join('')||'<div class="small">Aucune donnée.</div>';
  const metiers=(s.par_metier||[]).map(m=>`<div class="result"><span>${escapeHtml(m.metier||'—')}</span><b>${m.total}</b></div>`).join('')||'<div class="small">Aucune donnée.</div>';
  const badges=(s.par_badge||[]).map(b=>`<div class="result"><span class="badge ${b.badge}">${badgeLabel(b.badge)}</span><b>${b.total}</b></div>`).join('')||'<div class="small">Aucune donnée.</div>';
  return `
  <div class="card">
    <h3>Rapport ZUA MOSALA</h3>
    <p class="small">Données agrégées, anonymisées, prêtes pour les ONG, ministères et bailleurs.</p>
    <div style="display:flex;gap:10px;margin:16px 0">
      <div style="flex:1;background:var(--light);padding:14px;border-radius:12px;text-align:center"><div style="font-size:1.5rem;font-weight:800;color:var(--blue)">${s.total_profils||0}</div><div class="small">Profils</div></div>
      <div style="flex:1;background:var(--light);padding:14px;border-radius:12px;text-align:center"><div style="font-size:1.5rem;font-weight:800;color:var(--red)">${s.total_avis||0}</div><div class="small">Avis</div></div>
      <div style="flex:1;background:var(--light);padding:14px;border-radius:12px;text-align:center"><div style="font-size:1.5rem;font-weight:800;color:var(--gold)">${s.total_missions||0}</div><div class="small">Missions</div></div>
    </div>
    <div class="principle">Ce rapport peut être vendu 200-500 USD aux institutions. C'est la troisième source de revenus de ZUA MOSALA.</div>
  </div>
  <div class="card"><h4 style="margin-top:0">Profils par commune</h4>${communes}</div>
  <div class="card"><h4 style="margin-top:0">Profils par métier</h4>${metiers}</div>
  <div class="card"><h4 style="margin-top:0">Répartition des badges</h4>${badges}</div>`;
}

/* ========== DÉMARRAGE ========== */
updateThemeBtn();
router().catch(err=>{
  console.error('Erreur router:', err);
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>Erreur de connexion</h3>
      <p class="small">Impossible de contacter le serveur. Vérifie que Railway est bien en ligne.</p>
      <p class="small"><b>Détail :</b> ${err.message}</p>
      <button onclick="location.reload()">Recharger</button>
    </div>`;
});
</script>
</body>
</html>
