<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007FFF">
<title>ZUA MOSALA — Portfolio certifié</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --blue:#007FFF; --blue-dark:#0059b3; --blue-deep:#003d80;
  --yellow:#FCD116; --red:#CE1126; --gold:#D4A017;
  --bg:#f5f7fa; --surface:#ffffff; --text:#0f172a; --text-soft:#64748b;
  --border:#e5e9f0; --light:#f0f4f9;
  --shadow:0 1px 3px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.04);
}
:root[data-theme="dark"]{
  --bg:#0a1018; --surface:#131b28; --text:#e8edf5; --text-soft:#8b96a8;
  --border:#1f2a3d; --light:#1a2333;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);}
:root[data-theme="dark"] header{background:rgba(19,27,40,.9)}
.header-inner{padding:12px 16px}
header .top{display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
header .logo{width:26px;height:26px;flex-shrink:0}
.back{cursor:pointer;font-size:1.4rem;background:none;border:none;color:var(--text);padding:0 4px;line-height:1;font-weight:300}
.icon-btn{background:var(--light);border:none;color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s}
.icon-btn:hover{background:var(--border)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.logout{margin-left:6px;background:rgba(206,17,38,.1);color:var(--red)}
.icon-btn.logout:hover{background:rgba(206,17,38,.2)}
header .crumb{font-size:.68rem;color:var(--text-soft);margin-top:4px;margin-left:2px}
.rdc-stripes{display:flex;height:4px}
.rdc-stripes div{flex:1}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.card h3{margin:0 0 8px;font-size:.98rem;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 svg{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:root[data-theme="dark"] .card h3 svg{stroke:var(--yellow)}
.card h4{margin:18px 0 10px;font-size:.85rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
:root[data-theme="dark"] .card h4{color:var(--yellow)}

label{display:block;font-size:.78rem;font-weight:600;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}

button{background:var(--blue);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer;font-size:.88rem;font-family:inherit;transition:opacity .15s,transform .08s;}
button:hover{opacity:.94}
button:active{transform:scale(.985)}
button.secondary{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
:root[data-theme="dark"] button.secondary{color:var(--yellow);border-color:var(--yellow)}
button.gold{background:var(--yellow);color:#1a1a1a}
button.ghost{background:var(--light);color:var(--text)}
button.danger{background:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
a.tile{display:block;text-decoration:none;color:inherit}
a{color:var(--blue);text-decoration:none}
:root[data-theme="dark"] a{color:var(--yellow)}

/* Onboarding */
.onb-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#007FFF 0%,#0059b3 60%,#003d80 100%);z-index:100;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.onb-skip{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 14px;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;z-index:2}
.onb-skip:hover{background:rgba(255,255,255,.25)}
.onb-slide{flex:1;display:none;flex-direction:column;padding:70px 28px 140px;overflow-y:auto;position:relative}
.onb-slide.active{display:flex;animation:onb-fade .35s ease}
@keyframes onb-fade{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.onb-deco{position:absolute;border-radius:50%;opacity:.14;pointer-events:none}
.onb-deco.d1{top:-60px;right:-40px;width:220px;height:220px;background:#FCD116}
.onb-deco.d2{bottom:-80px;left:-60px;width:240px;height:240px;background:#CE1126}
.onb-flag{display:flex;gap:4px;margin-bottom:22px}
.onb-flag div{width:26px;height:6px;border-radius:3px}
.onb-flag .b{background:#007FFF;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.onb-flag .y{background:#FCD116}
.onb-flag .r{background:#CE1126}
.onb-title{font-size:1.9rem;font-weight:800;letter-spacing:-.8px;margin:0 0 14px;line-height:1.15;position:relative;z-index:1}
.onb-title span{color:#FCD116}
.onb-text{font-size:.95rem;line-height:1.55;opacity:.95;margin:0 0 12px;position:relative;z-index:1}
.onb-illust{width:80px;height:80px;margin:16px 0 22px;position:relative;z-index:1;background:rgba(255,255,255,.15);border-radius:20px;display:flex;align-items:center;justify-content:center}
.onb-illust svg{width:44px;height:44px;stroke:#FCD116;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.onb-list{position:relative;z-index:1;margin-top:8px}
.onb-item{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.onb-item-num{width:28px;height:28px;border-radius:50%;background:rgba(252,209,22,.25);color:#FCD116;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.onb-item-txt{font-size:.88rem;line-height:1.45}
.onb-item-txt b{display:block;margin-bottom:2px}
.onb-item-txt span{opacity:.85}
.onb-badges{display:flex;gap:10px;margin:20px 0;position:relative;z-index:1;flex-wrap:wrap}
.onb-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:12px 14px;font-size:.8rem;flex:1;min-width:120px;text-align:center}
.onb-badge b{display:block;font-size:1.05rem;color:#FCD116;margin-bottom:4px}
.onb-bottom{position:absolute;bottom:0;left:0;right:0;padding:20px 28px 30px;background:linear-gradient(180deg,transparent 0%,rgba(0,61,128,.4) 100%);z-index:1}
.onb-dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.onb-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .2s}
.onb-dot.active{background:#FCD116;width:24px;border-radius:4px}
.onb-buttons{display:flex;gap:10px}
.onb-buttons button{flex:1;padding:14px;font-size:.9rem;background:#FCD116;color:#1a1a1a;font-weight:700}
.onb-buttons button.ghost{background:rgba(255,255,255,.15);color:#fff}

/* Hero */
.hero{border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:0 8px 28px rgba(0,127,255,.22);background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 60%,var(--blue-deep) 100%);color:#fff;position:relative}
.hero-top{display:flex;height:5px}
.hero-top div{flex:1}
.hero-content{padding:26px 22px 22px;position:relative;overflow:hidden}
.hero-content::before{content:"";position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:var(--yellow);opacity:.18}
.hero-content::after{content:"";position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;border-radius:50%;background:var(--red);opacity:.12}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(252,209,22,.2);color:var(--yellow);padding:5px 10px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.5px;margin-bottom:14px;position:relative;z-index:1}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--yellow)}
.hero h1{font-size:2rem;margin:0 0 8px;font-weight:800;letter-spacing:-1px;position:relative;z-index:1;line-height:1.1}
.hero h1 span{color:var(--yellow)}
.hero .tag{font-size:.88rem;opacity:.95;margin:0;line-height:1.45;position:relative;z-index:1;max-width:90%}
.hero-footer{padding:14px 22px;background:rgba(0,0,0,.18);font-size:.8rem;line-height:1.4;opacity:.95}

/* Search */
.search-bar{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:12px;align-items:center;box-shadow:var(--shadow);}
.search-bar svg{width:18px;height:18px;stroke:var(--text-soft);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.search-bar input{border:none;background:transparent;flex:1;padding:8px 0;font-size:.9rem}
.search-bar input:focus{outline:none}
.search-bar button{padding:9px 14px;border-radius:8px;font-size:.8rem}
.search-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.search-tag{font-size:.7rem;padding:5px 10px;background:var(--light);color:var(--text-soft);border-radius:20px;cursor:pointer;border:1px solid var(--border);font-weight:600;transition:background .15s}
.search-tag:hover{background:var(--border)}

/* Widget */
.widget-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.widget-item{padding:14px 12px;border-radius:12px;background:var(--light);text-align:center;position:relative;overflow:hidden}
.widget-item .num{font-size:1.4rem;font-weight:800;color:var(--blue);letter-spacing:-.5px}
:root[data-theme="dark"] .widget-item .num{color:var(--yellow)}
.widget-item .lbl{font-size:.7rem;color:var(--text-soft);margin-top:4px;font-weight:600}
.widget-item::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.widget-item.c1::before{background:var(--blue)}
.widget-item.c2::before{background:var(--yellow)}
.widget-item.c3::before{background:var(--red)}
.widget-item.c4::before{background:var(--gold)}

/* Piliers */
.pillar{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.pillar:last-of-type{border-bottom:none}
.pillar-icon{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.pillar-icon.p1{background:linear-gradient(135deg,#007FFF,#0059b3)}
.pillar-icon.p2{background:linear-gradient(135deg,#FCD116,#D4A017);color:#1a1a1a}
.pillar-icon.p3{background:linear-gradient(135deg,#CE1126,#8b0a1a)}
.pillar-icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pillar .txt{font-size:.85rem;line-height:1.4}
.pillar .txt b{display:block;margin-bottom:2px;color:var(--text);font-size:.88rem}
.pillar .txt span{color:var(--text-soft)}

/* Step */
.step{display:flex;gap:12px;padding:12px;background:var(--light);border-radius:12px;margin-bottom:10px}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0}
.step-num.y{background:var(--yellow);color:#1a1a1a}
.step-num.r{background:var(--red)}
.step .txt{font-size:.82rem;line-height:1.4}
.step .txt b{display:block;margin-bottom:2px;color:var(--text);font-size:.85rem}
.step .txt span{color:var(--text-soft)}

/* Badges */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:700;color:#fff}
.badge.bronze{background:#a06a3c}
.badge.argent{background:#7a7a7a}
.badge.or{background:var(--gold)}
.badge.premium{background:var(--red);font-size:.62rem;padding:2px 6px}
.badge.courte{background:var(--blue);font-size:.62rem}
.badge.longue{background:var(--red);font-size:.62rem}
.stars{color:var(--gold);font-size:.92rem;letter-spacing:.5px}
.small{font-size:.74rem;color:var(--text-soft);line-height:1.4}
.principle{background:var(--light);border-left:3px solid var(--yellow);padding:10px 14px;font-size:.78rem;font-weight:500;border-radius:8px;margin:14px 0;line-height:1.45}

/* Mission card */
.mission{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.mission-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.mission-title{font-weight:700;font-size:.92rem;margin:0 0 4px;line-height:1.3}
.mission-meta{font-size:.72rem;color:var(--text-soft);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.mission-meta span{display:inline-flex;align-items:center;gap:4px}
.mission-meta svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mission-desc{font-size:.8rem;color:var(--text-soft);margin:8px 0;line-height:1.45}
.mission-actions{display:flex;gap:8px;margin-top:10px}
.mission-actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.mission-actions button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Choice */
.choice{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice a{display:block;text-decoration:none}
.choice-btn{width:100%;padding:15px 16px;border-radius:14px;font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid transparent;cursor:pointer;font-family:inherit;background:var(--surface);}
.choice-btn.primary{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);color:#fff;position:relative;overflow:hidden}
.choice-btn.primary::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--yellow)}
.choice-btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.choice-btn .ico{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.choice-btn.secondary .ico{background:var(--light)}
.choice-btn .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.choice-btn.primary .ico svg{stroke:var(--yellow)}
.choice-btn .txt{flex:1}
.choice-btn .txt b{display:block;font-size:.92rem}
.choice-btn .txt span{font-size:.75rem;opacity:.75;font-weight:400;display:block;margin-top:2px}

/* Result */
.result{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:10px}
.result:last-child{border:none}
.result a{flex:1;text-decoration:none;color:inherit;display:block}

/* Notif */
.notif{background:linear-gradient(135deg,#FCD116 0%,#D4A017 100%);color:#1a1a1a;padding:12px 14px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:.82rem;font-weight:600;box-shadow:0 4px 14px rgba(212,160,23,.3)}
.notif svg{width:24px;height:24px;stroke:#1a1a1a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Star picker */
.star-pick span{font-size:1.9rem;cursor:pointer;opacity:.25;transition:opacity .12s;color:var(--gold);user-select:none}
.star-pick span.on{opacity:1}
#qr{display:flex;justify-content:center;margin:12px 0;padding:14px;background:#fff;border-radius:12px}
.avisItem{border-top:1px solid var(--border);padding:12px 0;font-size:.85rem}
.avisItem:first-child{border-top:none}
.reponse{background:var(--light);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:.78rem}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;margin-top:12px;line-height:1.4}
.checkline input{width:auto;margin-top:2px;flex-shrink:0}
.consent{font-size:.7rem;color:var(--text-soft);line-height:1.45}
.loader{text-align:center;padding:40px;color:var(--text-soft);font-size:.85rem}
.rdc-strip{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;font-size:.75rem;color:var(--text-soft);line-height:1.45}
.rdc-flag{width:28px;height:28px;border-radius:8px;overflow:hidden;flex-shrink:0;display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(0,127,255,.3)}
.rdc-flag div{flex:1}

/* Auth */
.auth-wrap{max-width:420px;margin:0 auto;padding-top:20px}
.auth-tabs{display:flex;gap:6px;background:var(--light);padding:4px;border-radius:12px;margin-bottom:18px}
.auth-tab{flex:1;padding:10px;text-align:center;font-weight:600;font-size:.85rem;cursor:pointer;border-radius:9px;color:var(--text-soft);transition:background .15s}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.user-chip{display:inline-flex;align-items:center;gap:6px;background:var(--light);padding:5px 10px;border-radius:20px;font-size:.72rem;font-weight:600;color:var(--text-soft);margin-bottom:10px}
.user-chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="top">
      <button class="back" id="backBtn" onclick="history.back()" aria-label="Retour">‹</button>
      <h1 id="headerTitle">
        <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#007FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="4" r="2" fill="#FCD116"/>
        </svg>
        ZUA MOSALA
      </h1>
      <button class="icon-btn" id="userBtn" onclick="nav('/compte')" aria-label="Mon compte">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 20a8 8 0 0 1 16 0"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Thème">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn logout" id="logoutBtn" onclick="deconnexion()" aria-label="Déconnexion" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
    <div class="crumb" id="crumb"></div>
  </div>
  <div class="rdc-stripes"><div style="background:#007FFF"></div><div style="background:#FCD116"></div><div style="background:#CE1126"></div></div>
</header>
<main id="app"><div class="loader">Chargement…</div></main>

<script>
/* ========== ICÔNES SVG ========== */
const ICONS = {
  user:  '<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 20a8 8 0 0 1 16 0"/></svg>',
  briefcase: '<svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',

/* ========== THEME ========== */
(function initTheme(){
  const saved = localStorage.getItem('zua_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
})();
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('zua_theme', next);

/* ========== AUTH STATE ========== */
const API = '/api';
let authToken = localStorage.getItem('zua_token') || null;
let authCompte = null; // { id, email, type, profil_id, employeur_id }

function setToken(t){
  authToken = t;
  if (t) localStorage.setItem('zua_token', t);
  else localStorage.removeItem('zua_token');
  updateAuthUI();
}
function updateAuthUI(){
  const log = document.getElementById('logoutBtn');
  const usr = document.getElementById('userBtn');
  if (authToken && authCompte){ log.style.display = 'flex'; usr.style.display = 'flex'; }
  else { log.style.display = 'none'; usr.style.display = 'flex'; }
}
async function chargerCompte(){
  if (!authToken) return null;
  try{
    const r = await fetch(API+'/auth/moi', { headers: { 'x-auth-token': authToken } });
    if (!r.ok){ setToken(null); authCompte = null; return null; }
    authCompte = await r.json();
    return authCompte;
  }catch(e){ return null; }
}
async function deconnexion(){
  try{
    if (authToken) await fetch(API+'/auth/deconnexion', { method:'POST', headers:{ 'x-auth-token': authToken } });
  }catch(e){}
  setToken(null); authCompte = null;
  nav('/');
}
function authHeaders(){
  return authToken ? { 'Content-Type':'application/json', 'x-auth-token': authToken } : { 'Content-Type':'application/json' };
}

/* ========== HELPERS ========== */
function badgeRank(b){return {bronze:0,argent:1,or:2}[b];}
function avg(avis){return avis.length?avis.reduce((s,x)=>s+x.note,0)/avis.length:0;}
function stars(n){const f=Math.round(n);return "★".repeat(f)+"☆".repeat(5-f);}
function badgeLabel(b){return {bronze:"Bronze",argent:"Argent",or:"Or"}[b];}
function nav(h){location.hash=h;}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

let profiles=[];
let missions=[];
let monProfilId = null;
let employeurId = null;
let employeurType = localStorage.getItem("zua_emp_type") || "particulier";
let employeurVerifie = false;
let employeurReference = "";

/* ========== API ========== */
async function chargerProfils(){const r=await fetch(API+'/profils');if(!r.ok)throw new Error('Erreur serveur '+r.status);return await r.json();}
async function chargerProfil(id){const r=await fetch(API+'/profils/'+id);if(!r.ok)throw new Error('Profil introuvable');return await r.json();}
async function apiCreerProfil(body){const r=await fetch(API+'/profils',{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});return await r.json();}
async function apiAjouterAvis(body){const r=await fetch(API+'/avis',{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});return await r.json();}
async function apiVerifierEmployeur(body){const r=await fetch(API+'/employeurs/verifier',{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});return await r.json();}
async function apiRepondreAvis(avisId,reponse){const r=await fetch(API+'/avis/'+avisId+'/reponse',{method:'PUT',headers:authHeaders(),body:JSON.stringify({reponse})});return await r.json();}
async function apiAjouterPreuve(id,preuve){const r=await fetch(API+'/profils/'+id+'/preuve',{method:'PUT',headers:authHeaders(),body:JSON.stringify({preuve})});return await r.json();}
async function apiActiverPremium(id){const r=await fetch(API+'/profils/'+id+'/premium',{method:'PUT',headers:authHeaders()});return await r.json();}
async function apiListerMissions(f){const p=new URLSearchParams(f||{});const r=await fetch(API+'/missions?'+p.toString());return await r.json();}
async function apiCreerMission(body){const r=await fetch(API+'/missions',{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});return await r.json();}
async function apiPostuler(missionId){const r=await fetch(API+'/missions/'+missionId+'/postuler',{method:'POST',headers:authHeaders()});return await r.json();}
async function apiCandidatures(){const r=await fetch(API+'/employeurs/candidatures',{headers:authHeaders()});return await r.json();}
async function apiStats(){const r=await fetch(API+'/stats');return await r.json();}
async function apiProfilPublic(id){const r=await fetch(API+'/public/profil/'+id);if(!r.ok)throw new Error('Profil introuvable');return await r.json();}
async function apiInscription(body){const r=await fetch(API+'/auth/inscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
async function apiConnexion(body){const r=await fetch(API+'/auth/connexion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}

/* ========== ROUTER ========== */
function parseHash(){const h=(location.hash.slice(1)||"/");const [path,qs]=h.split("?");return {segs:path.split("/").filter(Boolean),params:new URLSearchParams(qs||"")};}
function setHeader(title,crumb,showBack){
  document.getElementById("headerTitle").innerHTML=`
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#007FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="4" r="2" fill="#FCD116"/>
    </svg> ${title}`;
  document.getElementById("crumb").textContent=crumb||"";
  document.getElementById("backBtn").style.visibility=showBack?"visible":"hidden";
}

function requireAuth(redirect){
  if (!authToken){
    nav('/auth?redirect='+encodeURIComponent(redirect||'/'));
    return false;
  }
  return true;
}

async function router(){
  const {segs,params}=parseHash();
  const app=document.getElementById("app");
  app.innerHTML=`<div class="loader">Chargement…</div>`;
  updateAuthUI();

  const timeoutId = setTimeout(()=>{
    if(app.innerHTML.includes("Chargement")){
      app.innerHTML=`<div class="card"><h3>Le serveur met du temps à répondre</h3><p class="small">Attends 30 secondes puis recharge.</p><button onclick="router()">Réessayer</button></div>`;
    }
  }, 8000);

  try{
    /* Auth obligatoire pour toutes les pages sauf quelques-unes */
    const publicRoutes = ['', 'auth', 'missions', 'p', 'profil'];
    const isPublic = segs.length === 0 || publicRoutes.includes(segs[0]);
    if (!isPublic && !authToken){
      nav('/auth?redirect='+encodeURIComponent(location.hash.slice(1)||'/'));
      return;
    }

    /* HOME */
    if(segs.length===0){
      setHeader("ZUA MOSALA","Le portfolio certifié des compétences informelles",false);
      try{ profiles = await chargerProfils(); }catch(e){ profiles = []; }
      try{ missions = await apiListerMissions(); }catch(e){ missions = []; }
      app.innerHTML=pageHome();
      if(!localStorage.getItem('zua_onb_seen')){ setTimeout(()=>showOnboarding(),300); }
      return;
    }

    /* AUTH */
    if(segs[0]==="auth"){
      setHeader("Connexion","Accès à ton espace",true);
      app.innerHTML=pageAuth(params.get('redirect')||'/');
      return;
    }

    /* COMPTE */
    if(segs[0]==="compte"){
      if(!requireAuth('/compte')) return;
      setHeader("Mon compte","Gestion du compte",true);
      app.innerHTML=pageCompte();
      return;
    }

    /* PROFIL PUBLIC (QR) */
    if(segs[0]==="p"&&segs.length===2){
      setHeader("Profil public","Portfolio vérifié",true);
      try{const p=await apiProfilPublic(segs[1]);app.innerHTML=pageProfilPublic(p);}
      catch(e){app.innerHTML=`<div class="card"><h3>Profil introuvable</h3><p class="small">Ce profil n'existe plus.</p></div>`;}
      return;
    }

    /* JEUNE */
    if(segs[0]==="jeune"&&segs[1]==="creer"){
      if(!requireAuth('/jeune/creer')) return;
      setHeader("Créer mon profil","Espace autodidacte",true);
      app.innerHTML=pageCreer();
      return;
    }
    if(segs[0]==="jeune"&&segs[1]==="profil"){
      if(!requireAuth('/jeune/profil')) return;
      if(!monProfilId){nav("/jeune/creer");return;}
      setHeader("Mon profil","Espace autodidacte",true);
      const p=await chargerProfil(monProfilId);
      app.innerHTML=pageMonProfil(p);
      const el=document.getElementById("qr");
      if(el){
        el.innerHTML="";
        const url = location.origin + "/#/p/" + p.id;
        try{new QRCode(el,{text:url,width:150,height:150,colorDark:"#007FFF",colorLight:"#ffffff"});}catch(e){}
      }
      return;
    }
    if(segs[0]==="jeune"&&segs[1]==="vitrine"){
      if(!requireAuth('/jeune/vitrine')) return;
      setHeader("Booster ma vitrine","Premium",true);
      const p=await chargerProfil(monProfilId);
      app.innerHTML=pageVitrine(p);
      return;
    }

    /* MISSIONS (public) */
    if(segs[0]==="missions"){
      setHeader("Offres et missions","Toutes les offres",true);
      try{ missions=await apiListerMissions({ q: params.get('q')||undefined }); }catch(e){ missions=[]; }
      app.innerHTML=pageMissions(missions, params);
      return;
    }

    /* EMPLOYEUR */
    if(segs[0]==="employeur"&&segs.length===1){
      if(!requireAuth('/employeur')) return;
      setHeader("Espace employeur","Accueil › Employeur",true);
      app.innerHTML=pageEmployeurAccueil();
      const sel=document.getElementById("e-type");
      if(sel && employeurType){sel.value=employeurType;}
      renderVerifZone();
      return;
    }
    if(segs[0]==="employeur"&&segs[1]==="publier"){
      if(!requireAuth('/employeur/publier')) return;
      setHeader("Publier une offre","Nouvelle offre",true);
      app.innerHTML=pagePublierMission();
      return;
    }
    if(segs[0]==="employeur"&&segs[1]==="candidatures"){
      if(!requireAuth('/employeur/candidatures')) return;
      setHeader("Candidatures reçues","Notifications",true);
      const list=await apiCandidatures();
      app.innerHTML=pageCandidatures(list);
      return;
    }
    if(segs[0]==="employeur"&&segs[1]==="resultats"){
      if(!requireAuth('/employeur/resultats')) return;
      setHeader("Résultats","Recherche",true);
      try{profiles=await chargerProfils();}catch(e){profiles=[];}
      app.innerHTML=pageResultats(params);
      return;
    }
    if(segs[0]==="institution"&&segs[1]==="dashboard"){
      if(!requireAuth('/institution/dashboard')) return;
      setHeader("Rapports institutionnels","Statistiques",true);
      try{const stats=await apiStats();app.innerHTML=pageStats(stats);}catch(e){app.innerHTML=`<div class="card"><p>Impossible de charger les stats.</p></div>`;}
      return;
    }

    /* PROFIL (détail) */
    if(segs[0]==="profil"&&segs.length===2){
      if(!requireAuth('/profil/'+segs[1])) return;
      setHeader("Fiche profil","Fiche",true);
      const p=await chargerProfil(segs[1]);
      app.innerHTML=pageFiche(p);
      return;
    }
    if(segs[0]==="profil"&&segs[2]==="mission"){
      if(!requireAuth()) return;
      setHeader("Confirmer la mission","Mission",true);
      app.innerHTML=pageMission(segs[1]);
      return;
    }
    if(segs[0]==="profil"&&segs[2]==="avis"){
      if(!requireAuth()) return;
      setHeader("Laisser un avis","Avis",true);
      app.innerHTML=pageAvis(segs[1]);
      return;
    }

    app.innerHTML=`<div class="card"><p>Page introuvable.</p></div>`;
  }catch(e){
    app.innerHTML=`<div class="card"><h3>Erreur</h3><p class="small">${escapeHtml(e.message)}</p><button onclick="router()">Réessayer</button></div>`;
  } finally { clearTimeout(timeoutId); }
}
window.addEventListener("hashchange",router);

function onbNext(){
  const slides=document.querySelectorAll('.onb-slide');
  const dots=document.querySelectorAll('.onb-dot');
  if(window._onbIndex>=slides.length-1){closeOnboarding();return;}
  slides[window._onbIndex].classList.remove('active');
  dots[window._onbIndex].classList.remove('active');
  window._onbIndex++;
  slides[window._onbIndex].classList.add('active');
  dots[window._onbIndex].classList.add('active');
  document.getElementById('onbPrev').style.display=window._onbIndex>0?'block':'none';
  document.getElementById('onbNext').textContent=(window._onbIndex>=slides.length-1)?'Commencer':'Suivant';
}
function onbPrev(){
  const slides=document.querySelectorAll('.onb-slide');
  const dots=document.querySelectorAll('.onb-dot');
  if(window._onbIndex<=0) return;
  slides[window._onbIndex].classList.remove('active');
  dots[window._onbIndex].classList.remove('active');
  window._onbIndex--;
  slides[window._onbIndex].classList.add('active');
  dots[window._onbIndex].classList.add('active');
  document.getElementById('onbPrev').style.display=window._onbIndex>0?'block':'none';
  document.getElementById('onbNext').textContent='Suivant';
}
function closeOnboarding(){
  const ov=document.getElementById('onbOverlay');

  localStorage.setItem('zua_onb_seen','1');
}

/* ========== AUTH PAGE ========== */
function pageAuth(redirect){
  return `

    <div class="card">
      <h3 style="justify-content:center;margin-bottom:6px">${ICONS.lock} Connexion à ZUA MOSALA</h3>

    </div>

function switchAuthTab(tab){

function renderAuthForm(tab){
  const f=document.getElementById('authForm');
  if(tab==='signup'){
    f.innerHTML=`
      <label>Je suis</label>

        <option value="jeune">Un jeune autodidacte</option>

      <button style="margin-top:16px;width:100%" onclick="inscription(this)">Créer mon compte</button>
      <p class="small" style="text-align:center;margin-top:12px">Déjà un compte ? <a href="javascript:void(0)" onclick="switchAuthTab('login')">Connecte-toi</a></p>
    `;
  } else {
    f.innerHTML=`
      <label>Email</label>
      <input id="a-email" type="email" placeholder="ton@email.com" autocomplete="email">
      <label>Mot de passe</label>
      <input id="a-password" type="password" placeholder="••••••" autocomplete="current-password">

}
async function inscription(btn){
  const email=document.getElementById('a-email').value.trim();
  const pwd=document.getElementById('a-password').value;
  const type=document.getElementById('a-type').value;
  if(!email||!pwd){alert('Remplis tous les champs');return;}
  btn.disabled=true;btn.textContent='Création…';
  const data=await apiInscription({email,password:pwd,type});
  if(data.error){alert(data.error);btn.disabled=false;btn.textContent='Créer mon compte';return;}
  setToken(data.token);
  await chargerCompte();
  const redir=document.getElementById('authRedirect').value||'/';
  nav(redir);
}
async function connexion(btn){
  const email=document.getElementById('a-email').value.trim();
  const pwd=document.getElementById('a-password').value;
  if(!email||!pwd){alert('Remplis tous les champs');return;}
  btn.disabled=true;btn.textContent='Connexion…';
  const data=await apiConnexion({email,password:pwd});
  if(data.error){alert(data.error);btn.disabled=false;btn.textContent='Se connecter';return;}
  setToken(data.token);
  await chargerCompte();
  const redir=document.getElementById('authRedirect').value||'/';
  nav(redir);
}

async function creerProfil(btn){

  if(!document.getElementById("f-consent").checked){alert("Le consentement est requis.");return;}
  if(btn){btn.disabled=true;btn.textContent="Création…";}
  const body={nom,metier:document.getElementById("f-metier").value.trim(),commune:document.getElementById("f-commune").value.trim(),description:document.getElementById("f-desc").value.trim(),contact:document.getElementById("f-contact").value.trim(),consentement:true};
  const data=await apiCreerProfil(body);
  if(data.error){alert(data.error);if(btn){btn.disabled=false;btn.textContent="Créer mon profil";}return;}
  monProfilId=data.id;
  if(authCompte) authCompte.profil_id=data.id;
  nav("/jeune/profil");

function ajouterPreuve(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{await apiAjouterPreuve(monProfilId,r.result);router();};r.readAsDataURL(f);}

/* ========== MISSIONS ========== */
function pageMissions(list, params){
  const q=(params&&params.get('q'))||"";
  const filtered=(list||[]).filter(m=>!q||(m.titre||'').toLowerCase().includes(q.toLowerCase())||(m.description||'').toLowerCase().includes(q.toLowerCase()));
  const courtes=filtered.filter(m=>m.duree!=='longue');
  const longues=filtered.filter(m=>m.duree==='longue');

  const renderMission=(m)=>`
    <div class="mission">
      <div class="mission-head">
        <div style="flex:1">
          <div class="mission-title">${escapeHtml(m.titre)}</div>
          <div class="mission-meta">
            <span class="badge ${m.duree==='longue'?'longue':'courte'}">${m.duree==='longue'?'Long terme':'Court terme'}</span>
            <span>${ICONS.pin}${escapeHtml(m.commune||'—')}</span>
            <span>${ICONS.money}${escapeHtml(m.budget||'À discuter')}</span>
            <span>${ICONS.users}${m.nombre_personnes}</span>
          </div>
        </div>
      </div>
      ${m.description?`<div class="mission-desc">${escapeHtml(m.description)}</div>`:''}
      <div class="mission-actions">
        <button class="gold" onclick="postuler(${m.id})">${ICONS.send} Postuler</button>
        ${m.contact?`<button class="secondary" onclick="alert('Contact : ${escapeHtml(m.contact)}')">${ICONS.phone}</button>`:''}
      </div>
    </div>`;

  return `
  <div class="card">
    <div class="search-bar" style="margin-bottom:12px">
      ${ICONS.search}
      <input id="missionSearch" placeholder="Rechercher une offre…" value="${escapeHtml(q)}" onkeydown="if(event.key==='Enter')searchMissions()">
      <button onclick="searchMissions()">OK</button>
    </div>
    <h3>${ICONS.briefcase} Missions courtes (1-3 jours)</h3>
    <p class="small">${courtes.length} offre(s) · Paiement rapide, engagement court.</p>
    ${courtes.length?courtes.map(renderMission).join(''):`<div class="small">Aucune mission courte.</div>`}
  </div>
  <div class="card">
    <h3>${ICONS.briefcase} Emplois longue durée</h3>
    <p class="small">${longues.length} offre(s) · CDD, CDI, contrats longs.</p>
    ${longues.length?longues.map(renderMission).join(''):`<div class="small">Aucune offre longue durée.</div>`}
  </div>`;
}
function searchMissions(){
  const q=document.getElementById('missionSearch').value.trim();
  nav("/missions"+(q?'?q='+encodeURIComponent(q):''));
}
async function postuler(missionId){
  if(!authToken){nav('/auth?redirect=/missions');return;}
  if(!authCompte || authCompte.type!=='jeune'){alert("Crée un compte jeune pour postuler.");return;}
  if(!authCompte.profil_id){alert("Crée d'abord ton profil jeune.");nav('/jeune/creer');return;}
  const data=await apiPostuler(missionId);
  if(data.error){alert(data.error);return;}
  alert("Candidature envoyée. L'employeur recevra une notification.");
}

  ${items}`;
}
function accepterCandidature(id){alert('Candidature acceptée.');}
function refuserCandidature(id){alert('Candidature refusée.');}

/* ========== EMPLOYEUR ========== */
function pageEmployeurAccueil(){
  return `
  <div class="card">
    <h3>${ICONS.briefcase} Espace employeur</h3>
    <p class="small">Sélectionne ton type de profil.</p>
    <label>Type de profil</label>
    <select id="e-type" onchange="onTypeChange()">
      <option value="particulier">Particulier</option>
      <option value="entreprise">Entreprise</option>
      <option value="soustraitance">Sous-traitance</option>
      <option value="institution">Institution / ONG</option>
    </select>
    <div id="verifZone"></div>
    <a class="tile" href="#/employeur/publier" style="margin-top:14px"><button class="gold" style="width:100%">${ICONS.plus} Publier une offre (3-5 $)</button></a>
    <a class="tile" href="#/employeur/candidatures" style="margin-top:8px"><button class="secondary" style="width:100%">${ICONS.bell} Voir les candidatures reçues</button></a>
    <label style="margin-top:18px">Métier recherché</label>
    <input id="e-metier" placeholder="Ex: couture, mécanique...">
    <label>Commune</label>
    <input id="e-commune" placeholder="Ex: Matete, Gombe...">
    <button style="margin-top:16px;width:100%" onclick="lancerRecherche()">${ICONS.search} Rechercher un profil</button>
    <div class="principle">Classement par mérite uniquement.</div>
  </div>`;
}
function onTypeChange(){employeurType=document.getElementById("e-type").value;localStorage.setItem("zua_emp_type",employeurType);employeurVerifie=false;renderVerifZone();}
function renderVerifZone(){
  const z=document.getElementById("verifZone");if(!z)return;
  if(employeurVerifie){z.innerHTML=`<div class="small" style="margin-top:12px">Profil vérifié.</div>`;return;}
  if(employeurType==="particulier"){
    z.innerHTML=`<label>Vérification par SMS</label><input id="v-tel" placeholder="Ton numéro" value="${escapeHtml(employeurReference)}"><button class="secondary" style="margin-top:10px" onclick="verifierSMS(this)">Vérifier</button>`;
  } else if(employeurType==="entreprise"||employeurType==="soustraitance"){
    z.innerHTML=`<label>Numéro RCCM</label><input id="v-rccm" placeholder="Ex: CD/KNG/RCCM/..." value="${escapeHtml(employeurReference)}"><button class="secondary" style="margin-top:10px" onclick="verifierRCCM(this)">Vérifier</button>`;
  } else {
    employeurVerifie=true;
    z.innerHTML=`<div class="small" style="margin-top:12px">Compte institutionnel.</div><a class="tile" href="#/institution/dashboard" style="margin-top:12px"><button class="gold" style="width:100%">Voir les rapports</button></a>`;
  }
}
async function verifierSMS(btn){const tel=document.getElementById("v-tel").value.trim();if(!tel){alert("Indique ton numéro.");return;}if(btn){btn.disabled=true;btn.textContent="Vérification…";}const data=await apiVerifierEmployeur({type:"particulier",reference:tel});if(data.employeur_id){employeurId=data.employeur_id;if(authCompte)authCompte.employeur_id=data.employeur_id;}employeurVerifie=true;employeurReference=tel;renderVerifZone();}
async function verifierRCCM(btn){const rccm=document.getElementById("v-rccm").value.trim();if(!rccm){alert("Indique le n° RCCM.");return;}if(btn){btn.disabled=true;btn.textContent="Vérification…";}const data=await apiVerifierEmployeur({type:employeurType,reference:rccm});if(data.employeur_id){employeurId=data.employeur_id;if(authCompte)authCompte.employeur_id=data.employeur_id;}employeurVerifie=true;employeurReference=rccm;renderVerifZone();}
function lancerRecherche(){if(!employeurVerifie){alert("Vérifie d'abord ton profil employeur.");return;}const m=encodeURIComponent(document.getElementById("e-metier").value.trim());const c=encodeURIComponent(document.getElementById("e-commune").value.trim());nav("/employeur/resultats?metier="+m+"&commune="+c);}

/* ========== RESULTATS ========== */
function pageResultats(params){
  const metier=(params.get("metier")||"").toLowerCase();
  const commune=(params.get("commune")||"").toLowerCase();
  const filt=p=>(!metier||p.metier.toLowerCase().includes(metier))&&(!commune||p.commune.toLowerCase().includes(commune));
  const filtered=profiles.filter(filt);
  const sorted=filtered.slice().sort((a,b)=>{const rb=badgeRank(b.badge)-badgeRank(a.badge);if(rb!==0)return rb;const ra=(parseFloat(b.moyenne)||0)-(parseFloat(a.moyenne)||0);if(ra!==0)return ra;return (b.nb_avis||0)-(a.nb_avis||0);});
  const listHtml=sorted.length
    ? sorted.map(p=>`
      <div class="result">
        <a href="#/profil/${p.id}">
          <b>${escapeHtml(p.nom)}</b> <span class="badge ${p.badge}">${badgeLabel(p.badge)}</span><br>
          <span class="small">${escapeHtml(p.metier)} · ${escapeHtml(p.commune)} · ${p.nb_avis>0?stars(parseFloat(p.moyenne))+" ("+p.nb_avis+" avis)":"aucun avis"}</span>
        </a>
      </div>`).join("")
    : `<div class="small">Aucun profil ne correspond.</div>`;
  return `
  <div class="card">
    <h3>${ICONS.search} Résultats</h3>
    <div class="small" style="margin-bottom:10px">Classement par mérite.</div>
    ${listHtml}
  </div>`;
}

/* ========== FICHE ========== */
function pageFiche(p){
  if(!p||p.error)return `<div class="card"><p>Profil introuvable.</p></div>`;
  const avis=(p.avis||[]).slice(0,5);
  const avisHtml=avis.map(a=>`<div class="avisItem"><div class="stars">${stars(a.note)}</div><div style="margin-top:4px">${escapeHtml(a.commentaire||"")}</div>${a.reponse?`<div class="reponse"><b>Réponse :</b> ${escapeHtml(a.reponse)}</div>`:""}</div>`).join("")||`<div class="small">Pas encore d'avis.</div>`;
  const dejaNote = (p.avis||[]).some(a=>a.employeur_id===employeurId);
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div><h3 style="margin:0">${escapeHtml(p.nom)}</h3><div class="small">${escapeHtml(p.metier)} · ${escapeHtml(p.commune)}</div></div>
      <div style="text-align:right"><span class="badge ${p.badge}">${badgeLabel(p.badge)}</span></div>
    </div>
    <p style="font-size:.88rem;margin:12px 0;color:var(--text-soft)">${escapeHtml(p.description||'')}</p>
    ${p.preuve_url?`<img src="${p.preuve_url}" style="max-width:100%;border-radius:10px;margin-bottom:10px">`:""}
    <div class="stars">${(p.avis&&p.avis.length)?stars(avg(p.avis))+" ("+p.avis.length+" avis)":"Pas encore d'avis"}</div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="alert('Contact : ${escapeHtml(p.contact||'')}')">${ICONS.phone} Contacter</button>
      ${dejaNote?`<button class="secondary" disabled style="flex:1">Avis déjà laissé</button>`:`<a class="tile" href="#/profil/${p.id}/mission" style="flex:1"><button class="gold" style="width:100%">J'ai réalisé une mission</button></a>`}
    </div>
    <div class="principle">Un avis n'est possible qu'après confirmation mutuelle.</div>
    <h4>Avis récents</h4>
    ${avisHtml}
  </div>`;
}

/* ========== MISSION ========== */
function pageMission(id){
  return `
  <div class="card">
    <h3>${ICONS.check} Confirmer la mission</h3>
    <p class="small">Les deux parties doivent confirmer.</p>
    <div class="checkline"><input type="checkbox" id="m-jeune"><label style="margin:0">Le prestataire confirme</label></div>
    <div class="checkline"><input type="checkbox" id="m-emp"><label style="margin:0">L'employeur confirme</label></div>
    <button style="margin-top:16px;width:100%" onclick="confirmerMission(${id})">Confirmer et noter</button>
  </div>`;
}
function confirmerMission(id){if(!document.getElementById("m-jeune").checked||!document.getElementById("m-emp").checked){alert("Les deux parties doivent confirmer.");return;}nav("/profil/"+id+"/avis");}

/* ========== AVIS ========== */
let noteChoisie=0;
function pageAvis(id){
  noteChoisie=0;
  return `
  <div class="card">
    <h3>Noter ce profil</h3>
    <p class="small">Ta note alimente le badge.</p>
    <div class="star-pick" id="starPick" style="margin:16px 0">${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="pickStar(${n})">★</span>`).join("")}</div>
    <label>Commentaire (optionnel, 180 max)</label>
    <textarea id="commentaire" rows="3" maxlength="180"></textarea>
    <button style="margin-top:16px;width:100%" onclick="validerAvis(${id},this)">Envoyer l'avis</button>
  </div>`;
}
function pickStar(n){noteChoisie=n;document.querySelectorAll("#starPick span").forEach((s,i)=>s.classList.toggle("on",i<n));}
async function validerAvis(id,btn){
  if(!noteChoisie){alert("Choisis une note.");return;}
  if(btn){btn.disabled=true;btn.textContent="Envoi…";}
  const data=await apiAjouterAvis({profil_id:parseInt(id,10),note:noteChoisie,commentaire:document.getElementById("commentaire").value});
  if(data.error){alert(data.error);if(btn){btn.disabled=false;btn.textContent="Envoyer";}return;}
  alert("Avis enregistré. Badge : "+badgeLabel(data.badge));
  nav("/profil/"+id);
}

/* ========== STATS ========== */
function pageStats(s){
  if(!s||s.error)return `<div class="card"><p>Erreur.</p></div>`;
  const communes=(s.par_commune||[]).map(c=>`<div class="result"><span>${escapeHtml(c.commune||'—')}</span><b>${c.total}</b></div>`).join('')||'<div class="small">Aucune donnée.</div>';
  const metiers=(s.par_metier||[]).map(m=>`<div class="result"><span>${escapeHtml(m.metier||'—')}</span><b>${m.total}</b></div>`).join('')||'<div class="small">Aucune donnée.</div>';
  const badges=(s.par_badge||[]).map(b=>`<div class="result"><span class="badge ${b.badge}">${badgeLabel(b.badge)}</span><b>${b.total}</b></div>`).join('')||'<div class="small">Aucune donnée.</div>';
  return `
  <div class="card">
    <h3>Rapport ZUA MOSALA</h3>
    <div style="display:flex;gap:10px;margin:16px 0">
      <div style="flex:1;background:var(--light);padding:14px;border-radius:12px;text-align:center"><div style="font-size:1.5rem;font-weight:800;color:var(--blue)">${s.total_profils||0}</div><div class="small">Profils</div></div>
      <div style="flex:1;background:var(--light);padding:14px;border-radius:12px;text-align:center"><div style="font-size:1.5rem;font-weight:800;color:var(--red)">${s.total_avis||0}</div><div class="small">Avis</div></div>
      <div style="flex:1;background:var(--light);padding:14px;border-radius:12px;text-align:center"><div style="font-size:1.5rem;font-weight:800;color:var(--gold)">${s.total_missions||0}</div><div class="small">Offres</div></div>
    </div>
  </div>
  <div class="card"><h4>Profils par commune</h4>${communes}</div>
  <div class="card"><h4>Profils par métier</h4>${metiers}</div>
  <div class="card"><h4>Répartition des badges</h4>${badges}</div>`;
}

/* ========== DÉMARRAGE ========== */
(async function init(){
  await chargerCompte();
  if (authCompte){
    if (authCompte.profil_id) monProfilId = authCompte.profil_id;
    if (authCompte.employeur_id) employeurId = authCompte.employeur_id;
  }
  updateAuthUI();
  router().catch(err=>{
    console.error('Erreur router:', err);
    document.getElementById("app").innerHTML = `<div class="card"><h3>Erreur</h3><p class="small">${err.message}</p><button onclick="location.reload()">Recharger</button></div>`;
  });
})();
</script>
</body>
</html>
