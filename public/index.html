<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOSALA — Portfolio certifié</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#1F3864; --gold:#B08D2B; --gold-light:#F0D78C;
  --bg:#ffffff; --text:#1a1a1a; --card:#ffffff; --border:#e3e3e3;
  --light:#F2F2F2; --muted:#6b7280;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --text:#eee; --card:#1e222a; --border:#333; --light:#20242c; --muted:#9aa3af;
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --text:#eee; --card:#1e222a; --border:#333; --light:#20242c; --muted:#9aa3af;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.15)}
header .top{display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:1.05rem;display:flex;align-items:center;gap:8px}
header .logo{width:26px;height:26px}
.back{cursor:pointer;font-size:1.3rem;background:none;border:none;color:#fff;padding:0 6px;line-height:1}
header .crumb{font-size:.68rem;opacity:.75;margin-top:4px}
main{max-width:520px;margin:0 auto;padding:16px}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:1.15rem}
.card h3{margin:0 0 6px;font-size:1rem}
.card h4{margin:16px 0 8px;font-size:.92rem;color:var(--navy)}
:root[data-theme="dark"] .card h4{color:var(--gold-light)}
label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;background:var(--bg);color:var(--text);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
button{background:var(--navy);color:#fff;border:none;padding:11px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.88rem;font-family:inherit;transition:opacity .15s}
button:hover{opacity:.9}
button.secondary{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
:root[data-theme="dark"] button.secondary{color:var(--gold-light);border-color:var(--gold-light)}
button.gold{background:var(--gold);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
a.tile{display:block;text-decoration:none;color:inherit}
a{color:var(--navy)}
:root[data-theme="dark"] a{color:var(--gold-light)}

.hero{
  background:linear-gradient(135deg,var(--navy) 0%,#2d4a7c 100%);
  color:#fff;border-radius:14px;padding:24px 18px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.hero h1{font-size:1.55rem;margin:0 0 8px;line-height:1.2;font-weight:800}
.hero p{margin:0 0 6px;font-size:.9rem;opacity:.95}
.hero .tagline{font-size:.75rem;opacity:.75;margin-top:10px;font-style:italic}
.hero .logo-hero{position:absolute;top:14px;right:14px;width:64px;height:64px;opacity:.15}

.pillar{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--light);border-radius:10px;margin-bottom:10px}
.pillar img{width:32px;height:32px;flex-shrink:0;margin-top:2px}
.pillar .txt{font-size:.85rem}
.pillar .txt b{display:block;margin-bottom:2px;color:var(--navy)}
:root[data-theme="dark"] .pillar .txt b{color:var(--gold-light)}
.pillar .txt span{color:var(--muted)}

.choice{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice a{display:block;text-decoration:none}
.choice-btn{
  width:100%;padding:16px;border-radius:10px;font-weight:700;font-size:.95rem;
  display:flex;align-items:center;gap:12px;text-align:left;border:2px solid transparent;
  cursor:pointer;transition:transform .1s;font-family:inherit;
}
.choice-btn:hover{transform:translateY(-1px)}
.choice-btn.primary{background:var(--navy);color:#fff}
.choice-btn.secondary{background:var(--light);color:var(--navy);border-color:var(--border)}
:root[data-theme="dark"] .choice-btn.secondary{color:var(--gold-light)}
.choice-btn img{width:28px;height:28px}
.choice-btn .arrow{margin-left:auto;font-size:1.2rem;opacity:.6}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;color:#fff;vertical-align:middle}
.badge.bronze{background:#a06a3c}
.badge.argent{background:#8a8a8a}
.badge.or{background:var(--gold)}
.badge.premium{background:#7c3aed;font-size:.65rem;padding:2px 7px}

.stars{color:var(--gold);font-size:.95rem;letter-spacing:1px}
.result{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.result:last-child{border:none}
.result a{flex:1;text-decoration:none;color:inherit;display:block}
.spon{background:var(--light);border:1px dashed var(--gold);border-radius:8px;padding:10px;margin-bottom:8px}
.spon-tag{font-size:.65rem;background:var(--gold);color:#fff;padding:2px 6px;border-radius:10px;font-weight:700;margin-left:6px}
.small{font-size:.75rem;color:var(--muted)}
.principle{background:var(--light);border-left:4px solid var(--gold);padding:10px 12px;font-size:.82rem;font-weight:600;color:var(--navy);border-radius:4px;margin:12px 0}
:root[data-theme="dark"] .principle{color:var(--gold-light)}
.star-pick span{font-size:1.8rem;cursor:pointer;opacity:.3;transition:opacity .1s}
.star-pick span.on{opacity:1}
#qr{display:flex;justify-content:center;margin:10px 0}
.avisItem{border-top:1px solid var(--border);padding:10px 0;font-size:.85rem}
.avisItem:first-child{border-top:none}
.reponse{background:var(--light);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:.8rem}
.checkline{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;margin-top:10px}
.checkline input{width:auto;margin-top:3px}
.consent{font-size:.72rem;color:var(--muted);line-height:1.4}
.loader{text-align:center;padding:20px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="back" id="backBtn" onclick="history.back()" aria-label="Retour">‹</button>
    <h1 id="headerTitle">
      <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#F0D78C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      MOSALA
    </h1>
  </div>
  <div class="crumb" id="crumb"></div>
</header>
<main id="app"><div class="loader">Chargement…</div></main>

<script>
/* ========== CONFIG API ========== */
const API = '/api';

/* ========== HELPERS ========== */
function badgeRank(b){return {bronze:0,argent:1,or:2}[b];}
function avg(avis){return avis.length?avis.reduce((s,x)=>s+x.note,0)/avis.length:0;}
function stars(n){const f=Math.round(n);return "★".repeat(f)+"☆".repeat(5-f);}
function badgeLabel(b){return {bronze:"Bronze",argent:"Argent",or:"Or"}[b];}
function nav(h){location.hash=h;}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ========== ÉTAT ========== */
let profiles=[];          /* chargé depuis l'API */
let monProfilId=null;
let employeurType="particulier";
let employeurId=sessionStorage.getItem("mosala_emp_id")||"emp-"+Math.random().toString(36).slice(2,8);
sessionStorage.setItem("mosala_emp_id",employeurId);
let employeurVerifie=sessionStorage.getItem("mosala_emp_verifie")==="1";

/* ========== API CALLS ========== */
async function chargerProfils(){
  const r=await fetch(API+'/profils');
  if(!r.ok)throw new Error('Erreur chargement profils');
  return await r.json();
}
async function chargerProfil(id){
  const r=await fetch(API+'/profils/'+id);
  if(!r.ok)throw new Error('Profil introuvable');
  return await r.json();
}
async function apiCreerProfil(body){
  const r=await fetch(API+'/profils',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
  });
  return await r.json();
}
async function apiAjouterAvis(body){
  const r=await fetch(API+'/avis',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
  });
  return await r.json();
}
async function apiVerifierEmployeur(body){
  const r=await fetch(API+'/employeurs/verifier',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
  });
  return await r.json();
}
async function apiRepondreAvis(avisId,reponse){
  const r=await fetch(API+'/avis/'+avisId+'/reponse',{
    method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({reponse})
  });
  return await r.json();
}
async function apiAjouterPreuve(id,preuve){
  const r=await fetch(API+'/profils/'+id+'/preuve',{
    method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({preuve})
  });
  return await r.json();
}
async function apiActiverPremium(id){
  const r=await fetch(API+'/profils/'+id+'/premium',{
    method:'PUT',headers:{'Content-Type':'application/json'}
  });
  return await r.json();
}

/* ========== ROUTER ========== */
function parseHash(){
  const h=(location.hash.slice(1)||"/");
  const [path,qs]=h.split("?");
  return {segs:path.split("/").filter(Boolean),params:new URLSearchParams(qs||"")};
}
function setHeader(title,crumb,showBack){
  document.getElementById("headerTitle").innerHTML=
    `<svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#F0D78C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg> ${title}`;
  document.getElementById("crumb").textContent=crumb||"";
  document.getElementById("backBtn").style.visibility=showBack?"visible":"hidden";
}

async function router(){
  const {segs,params}=parseHash();
  const app=document.getElementById("app");
  app.innerHTML=`<div class="loader">Chargement…</div>`;

  try{
    /* HOME */
    if(segs.length===0){
      setHeader("MOSALA","Le portfolio certifié des compétences informelles",false);
      profiles=await chargerProfils();
      app.innerHTML=pageHome();
      return;
    }
    /* CREER PROFIL */
    if(segs[0]==="jeune"&&segs[1]==="creer"){
      setHeader("Créer mon profil","Accueil › Autodidacte",true);
      app.innerHTML=pageCreer();
      return;
    }
    /* MON PROFIL */
    if(segs[0]==="jeune"&&segs[1]==="profil"){
      if(!monProfilId){nav("/jeune/creer");return;}
      setHeader("Mon profil","Accueil › Autodidacte",true);
      const p=await chargerProfil(monProfilId);
      app.innerHTML=pageMonProfil(p);
      const el=document.getElementById("qr");
      if(el){
        el.innerHTML="";
        new QRCode(el,{
          text:"mosala.app/profil/"+p.id,
          width:130,height:130,
          colorDark:"#1F3864",colorLight:"#ffffff"
        });
      }
      return;
    }
    /* VITRINE */
    if(segs[0]==="jeune"&&segs[1]==="vitrine"){
      setHeader("Booster ma vitrine","Mon profil › Premium",true);
      const p=await chargerProfil(monProfilId);
      app.innerHTML=pageVitrine(p);
      return;
    }
    /* EMPLOYEUR ACCUEIL */
    if(segs[0]==="employeur"&&segs.length===1){
      setHeader("Espace employeur","Accueil › Employeur",true);
      app.innerHTML=pageEmployeurAccueil();
      renderVerifZone();
      return;
    }
    /* RESULTATS */
    if(segs[0]==="employeur"&&segs[1]==="resultats"){
      setHeader("Résultats","Employeur › Recherche",true);
      profiles=await chargerProfils();
      app.innerHTML=pageResultats(params);
      return;
    }
    /* FICHE PROFIL */
    if(segs[0]==="profil"&&segs.length===2){
      setHeader("Fiche profil","Résultats › Profil",true);
      const p=await chargerProfil(segs[1]);
      app.innerHTML=pageFiche(p);
      return;
    }
    /* MISSION */
    if(segs[0]==="profil"&&segs[2]==="mission"){
      setHeader("Confirmer la mission","Profil › Mission",true);
      app.innerHTML=pageMission(segs[1]);
      return;
    }
    /* AVIS */
    if(segs[0]==="profil"&&segs[2]==="avis"){
      setHeader("Laisser un avis","Profil › Mission › Avis",true);
      app.innerHTML=pageAvis(segs[1]);
      return;
    }
    app.innerHTML=`<div class="card"><p>Page introuvable.</p></div>`;
  }catch(e){
    app.innerHTML=`<div class="card"><h3>Erreur</h3><p class="small">${escapeHtml(e.message)}</p></div>`;
  }
}
window.addEventListener("hashchange",router);

/* ========== HOME ========== */
function pageHome(){
  return `
  <div class="hero">
    <svg class="logo-hero" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>MOSALA</h1>
    <p><b>Le portfolio numérique qui transforme ton savoir-faire en badge vérifié.</b></p>
    <p>Créé pour les jeunes autodidactes de Kinshasa. Utilisé par les employeurs qui recrutent sur la preuve, pas sur le diplôme.</p>
    <div class="tagline">« Le travail, la preuve. »</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Comment ça marche</h3>
    <div class="pillar">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 20a8 8 0 0 1 16 0" stroke="#1F3864" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="txt"><b>1. Le jeune crée son profil</b><span>Nom, métier, commune, réalisations concrètes. Gratuit.</span></div>
    </div>
    <div class="pillar">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17.5 6.5 21 8 13.5 3 9l6.5-.5L12 2z" stroke="#B08D2B" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <div class="txt"><b>2. L'employeur recrute et note</b><span>Après la mission, il donne une note sur 5 étoiles et un commentaire.</span></div>
    </div>
    <div class="pillar">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 12l2 2 4-4M12 3l8 4v6c0 5-3.5 8-8 8s-8-3-8-8V7l8-4z" stroke="#1F3864" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <div class="txt"><b>3. Le badge se construit</b><span>Bronze (déclaré), Argent (3 avis ≥3★), Or (5 avis ≥4★). Impossible à acheter.</span></div>
    </div>
    <div class="principle">Le badge repose uniquement sur la preuve terrain. Aucun diplôme requis. Aucun paiement pour être certifié.</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Je commence maintenant</h3>
    <div class="choice">
      <a href="#/jeune/profil" onclick="event.preventDefault();demarrerJeune()">
        <div class="choice-btn primary">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 20a8 8 0 0 1 16 0" stroke="#F0D78C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Je suis autodidacte<br><span style="font-weight:400;font-size:.78rem;opacity:.85">Créer mon profil gratuit</span></span>
          <span class="arrow">›</span>
        </div>
      </a>
      <a href="#/employeur">
        <div class="choice-btn secondary">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 21V7l8-4 8 4v14M9 21v-6h6v6M9 11h.01M15 11h.01" stroke="#1F3864" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Je suis employeur<br><span style="font-weight:400;font-size:.78rem;opacity:.7">Trouver un profil vérifié</span></span>
          <span class="arrow">›</span>
        </div>
      </a>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Pourquoi MOSALA</h3>
    <p class="small" style="margin:0 0 8px">
      À Kinshasa, des milliers de jeunes savent faire un métier sans pouvoir le prouver.
      MOSALA remplace le diplôme absent par une réputation vérifiable, construite mission après mission,
      et consultable par tout employeur via un simple QR code.
    </p>
    <div class="principle" style="margin-bottom:0">
      Gratuit pour le jeune. Payant uniquement pour ceux qui veulent aller plus vite.
    </div>
  </div>`;
}
function demarrerJeune(){
  if(monProfilId)nav("/jeune/profil");
  else nav("/jeune/creer");
}

/* ========== CREER PROFIL ========== */
function pageCreer(){
  return `
  <div class="card">
    <h3 style="margin-top:0">Créer mon profil autodidacte</h3>
    <p class="small">Pas besoin de diplôme. Décris juste ce que tu sais faire.</p>
    <label>Nom complet</label><input id="f-nom" placeholder="Ex: Fiston K.">
    <label>Métier</label><input id="f-metier" placeholder="Ex: soudure, coiffure, mécanique...">
    <label>Commune</label><input id="f-commune" placeholder="Ex: Matete, Masina, Gombe...">
    <label>Description courte</label><textarea id="f-desc" rows="3" placeholder="Ex: 3 ans d'expérience en réparation téléphone."></textarea>
    <label>Contact (téléphone / WhatsApp)</label><input id="f-contact" placeholder="+243 ...">
    <div class="checkline">
      <input type="checkbox" id="f-consent">
      <label class="consent" for="f-consent" style="margin:0">
        J'accepte que mon contact et mes réalisations soient utilisés pour ce service,
        conformément aux règles de protection des données personnelles en RDC.
        Je peux demander la suppression de mon profil à tout moment.
      </label>
    </div>
    <button style="margin-top:14px;width:100%" onclick="creerProfil()">Créer mon profil — gratuit</button>
  </div>`;
}
async function creerProfil(){
  const nom=document.getElementById("f-nom").value.trim();
  if(!nom){alert("Indique au moins ton nom.");return;}
  if(!document.getElementById("f-consent").checked){alert("Le consentement est requis.");return;}

  const body={
    nom,
    metier:document.getElementById("f-metier").value.trim(),
    commune:document.getElementById("f-commune").value.trim(),
    description:document.getElementById("f-desc").value.trim(),
    contact:document.getElementById("f-contact").value.trim(),
    consentement:true
  };
  const data=await apiCreerProfil(body);
  if(data.error){alert(data.error);return;}
  monProfilId=data.id;
  sessionStorage.setItem("mosala_mon_id",monProfilId);
  nav("/jeune/profil");
}
/* Restaurer monProfilId au chargement */
(function(){const v=sessionStorage.getItem("mosala_mon_id");if(v)monProfilId=parseInt(v,10);})();

/* ========== MON PROFIL ========== */
function pageMonProfil(p){
  if(!p||p.error)return `<div class="card"><p>Profil introuvable.</p></div>`;
  const avis=p.avis||[];
  const avisHtml=avis.map(a=>`
    <div class="avisItem">
      <div class="stars">${stars(a.note)}</div>
      <div>${escapeHtml(a.commentaire||"(sans commentaire)")}</div>
      ${a.reponse
        ?`<div class="reponse"><b>Ta réponse :</b> ${escapeHtml(a.reponse)}</div>`
        :`<div style="margin-top:4px"><a href="javascript:void(0)" onclick="repondreAvis(${a.id})" class="small">Répondre</a></div>`}
    </div>`).join("")||`<div class="small">Pas encore d'avis. Réalise une mission avec un employeur pour en recevoir.</div>`;

  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div>
        <h3 style="margin:0">${escapeHtml(p.nom)}</h3>
        <div class="small">${escapeHtml(p.metier)} · ${escapeHtml(p.commune)}</div>
      </div>
      <div style="text-align:right">
        <span class="badge ${p.badge}">${badgeLabel(p.badge)}</span>
        ${p.vitrine_premium?'<div style="margin-top:4px"><span class="badge premium">PREMIUM</span></div>':''}
      </div>
    </div>
    <p style="font-size:.88rem;margin:10px 0">${escapeHtml(p.description||'')}</p>
    <div class="stars">${avis.length?stars(avg(avis))+" ("+avis.length+" avis)":"Pas encore d'avis"}</div>
    <div class="small" style="margin-top:4px">📞 ${escapeHtml(p.contact||'')}</div>

    <div class="principle">Le badge se construit sur la durée, jamais sur un seul avis, jamais sur l'argent.</div>

    <label>Ajouter une preuve de réalisation</label>
    <input type="file" accept="image/*" onchange="ajouterPreuve(event)">
    <div id="preuvePreview" style="margin-top:8px">
      ${p.preuve_url?`<img src="${p.preuve_url}" style="max-width:100%;border-radius:8px">`:''}
    </div>

    <a class="tile" href="#/jeune/vitrine" style="margin-top:12px">
      <button class="secondary" style="width:100%">
        ${p.vitrine_premium?'✓ Vitrine active':'Booster ma vitrine (2,5 $/mois, optionnel)'}
      </button>
    </a>

    <h4>Mon portfolio public</h4>
    <div id="qr"></div>
    <div class="small" style="text-align:center">
      Lien : <b>mosala.app/profil/${p.id}</b><br>
      Tout employeur peut scanner ce QR code pour voir tes badges vérifiés.
    </div>

    <h4>Avis reçus</h4>
    ${avisHtml}
  </div>`;
}
function ajouterPreuve(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    await apiAjouterPreuve(monProfilId,r.result);
    router();
  };
  r.readAsDataURL(f);
}
async function repondreAvis(avisId){
  const txt=prompt("Ta réponse à cet avis :");
  if(!txt)return;
  await apiRepondreAvis(avisId,txt);
  router();
}

/* ========== VITRINE ========== */
function pageVitrine(p){
  return `
  <div class="card">
    <h3 style="margin-top:0">Booster ma vitrine</h3>
    <p class="small">
      La vitrine met ton profil en avant dans une section « Sponsorisé »,
      <b>séparée du classement principal qui reste basé uniquement sur le mérite</b>.
      Aucun badge ne s'achète. Seule la visibilité est payante.
    </p>
    <label>Moyen de paiement</label>
    <select id="v-moyen">
      <option>Mobile Money (Airtel / Orange)</option>
      <option>Carte virtuelle prépayée</option>
      <option>Carte bancaire Visa / Mastercard</option>
    </select>
    <label>Numéro ou référence</label>
    <input id="v-ref" placeholder="Ex: +243 9... ou n° carte">
    <button style="margin-top:14px;width:100%" onclick="payerVitrine()">Payer 2,5 $ — Activer 30 jours</button>
    ${p.vitrine_premium?'<p class="small" style="margin-top:10px;text-align:center">✓ Vitrine déjà active.</p>':''}
  </div>`;
}
async function payerVitrine(){
  const ref=document.getElementById("v-ref").value.trim();
  if(!ref){alert("Renseigne un numéro ou une référence de paiement.");return;}
  await apiActiverPremium(monProfilId);
  alert("Paiement simulé accepté.\nVitrine activée pour 30 jours.");
  nav("/jeune/profil");
}

/* ========== EMPLOYEUR ========== */
function pageEmployeurAccueil(){
  return `
  <div class="card">
    <h3 style="margin-top:0">Espace employeur</h3>
    <p class="small">Sélectionne ton type de profil. La vérification change selon ton statut.</p>
    <label>Type de profil</label>
    <select id="e-type" onchange="onTypeChange()">
      <option value="particulier">Particulier</option>
      <option value="entreprise">Entreprise</option>
      <option value="soustraitance">Sous-traitance</option>
      <option value="institution">Institution / ONG</option>
    </select>
    <div id="verifZone"></div>
    <label>Métier recherché</label>
    <input id="e-metier" placeholder="Ex: couture, mécanique...">
    <label>Commune</label>
    <input id="e-commune" placeholder="Ex: Matete, Gombe...">
    <button style="margin-top:14px;width:100%" onclick="lancerRecherche()">Rechercher</button>
    <div class="principle">
      Le classement des résultats repose uniquement sur le mérite
      (badge + note + nombre d'avis). Il ne s'achète jamais.
    </div>
  </div>`;
}
function onTypeChange(){
  employeurType=document.getElementById("e-type").value;
  employeurVerifie=false;
  sessionStorage.removeItem("mosala_emp_verifie");
  renderVerifZone();
}
function renderVerifZone(){
  const z=document.getElementById("verifZone");
  if(!z)return;
  if(employeurType==="particulier"){
    z.innerHTML=`
      <label>Vérification par SMS</label>
      <input id="v-tel" placeholder="Ton numéro">
      <button class="secondary" style="margin-top:8px" onclick="verifierSMS()">Recevoir & vérifier le code</button>
      <div class="small" id="v-statut">${employeurVerifie?'✓ Vérifié':'Non vérifié'}</div>`;
  } else if(employeurType==="entreprise"||employeurType==="soustraitance"){
    z.innerHTML=`
      <label>Numéro RCCM</label>
      <input id="v-rccm" placeholder="Ex: CD/KNG/RCCM/...">
      <button class="secondary" style="margin-top:8px" onclick="verifierRCCM()">Vérifier l'entreprise</button>
      <div class="small" id="v-statut">${employeurVerifie?'✓ Vérifié':'Non vérifié'}</div>`;
  } else {
    employeurVerifie=true;
    sessionStorage.setItem("mosala_emp_verifie","1");
    z.innerHTML=`<div class="small">✓ Compte institutionnel — accès aux rapports agrégés inclus.</div>`;
  }
}
async function verifierSMS(){
  const tel=document.getElementById("v-tel").value.trim();
  if(!tel){alert("Indique ton numéro.");return;}
  await apiVerifierEmployeur({id:employeurId,type:"particulier",reference:tel});
  employeurVerifie=true;
  sessionStorage.setItem("mosala_emp_verifie","1");
  document.getElementById("v-statut").textContent="✓ Vérifié";
}
async function verifierRCCM(){
  const rccm=document.getElementById("v-rccm").value.trim();
  if(!rccm){alert("Indique le n° RCCM.");return;}
  await apiVerifierEmployeur({id:employeurId,type:employeurType,reference:rccm});
  employeurVerifie=true;
  sessionStorage.setItem("mosala_emp_verifie","1");
  document.getElementById("v-statut").textContent="✓ Vérifié";
}
function lancerRecherche(){
  if(!employeurVerifie){alert("Vérifie d'abord ton profil employeur.");return;}
  const m=encodeURIComponent(document.getElementById("e-metier").value.trim());
  const c=encodeURIComponent(document.getElementById("e-commune").value.trim());
  nav("/employeur/resultats?metier="+m+"&commune="+c+"&type="+employeurType);
}

/* ========== RESULTATS ========== */
function pageResultats(params){
  const metier=(params.get("metier")||"").toLowerCase();
  const commune=(params.get("commune")||"").toLowerCase();
  const filt=p=>
    (!metier||p.metier.toLowerCase().includes(metier))&&
    (!commune||p.commune.toLowerCase().includes(commune));

  const filtered=profiles.filter(filt);
  const sorted=filtered.slice().sort((a,b)=>{
    const rb=badgeRank(b.badge)-badgeRank(a.badge);
    if(rb!==0)return rb;
    const ra=(parseFloat(b.moyenne)||0)-(parseFloat(a.moyenne)||0);
    if(ra!==0)return ra;
    return (b.nb_avis||0)-(a.nb_avis||0);
  });

  const sponsored=filtered.filter(p=>p.vitrine_premium);

  const listHtml=sorted.length
    ? sorted.map(p=>`
      <div class="result">
        <a href="#/profil/${p.id}">
          <b>${escapeHtml(p.nom)}</b>
          ${p.vitrine_premium?'<span class="badge premium">PREMIUM</span>':''}
          <span class="badge ${p.badge}">${badgeLabel(p.badge)}</span>
          <br>
          <span class="small">
            ${escapeHtml(p.metier)} · ${escapeHtml(p.commune)} ·
            ${p.nb_avis>0?stars(parseFloat(p.moyenne))+" ("+p.nb_avis+" avis)":"aucun avis"}
          </span>
        </a>
      </div>`).join("")
    : `<div class="small">Aucun profil ne correspond. Élargis la recherche.</div>`;

  const sponsoredHtml=sponsored.length
    ? `<div class="card">
        <h4 style="margin-top:0">Profils à la une <span class="spon-tag">Sponsorisé</span></h4>
        ${sponsored.map(p=>`
          <div class="spon">
            <a class="tile" href="#/profil/${p.id}">
              <b>${escapeHtml(p.nom)}</b> — ${escapeHtml(p.metier)} (${escapeHtml(p.commune)})
              <span class="badge ${p.badge}">${badgeLabel(p.badge)}</span>
            </a>
          </div>`).join("")}
        <div class="small" style="margin-top:6px">
          Rotation équitable entre abonnés. Ne remplace jamais le classement par mérite.
        </div>
      </div>`
    : "";

  return `
  <div class="card">
    <h3 style="margin-top:0">Résultats (${escapeHtml(employeurType)})</h3>
    <div class="small" style="margin-bottom:8px">
      Classement par mérite : badge, puis note moyenne, puis nombre d'avis.
    </div>
    ${listHtml}
  </div>
  ${sponsoredHtml}`;
}

/* ========== FICHE PROFIL ========== */
function pageFiche(p){
  if(!p||p.error)return `<div class="card"><p>Profil introuvable.</p></div>`;
  const avis=(p.avis||[]).slice(0,5);
  const avisHtml=avis.map(a=>`
    <div class="avisItem">
      <div class="stars">${stars(a.note)}</div>
      <div>${escapeHtml(a.commentaire||"(sans commentaire)")}</div>
      ${a.reponse?`<div class="reponse"><b>Réponse :</b> ${escapeHtml(a.reponse)}</div>`:""}
    </div>`).join("")||`<div class="small">Pas encore d'avis.</div>`;

  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div>
        <h3 style="margin:0">${escapeHtml(p.nom)}</h3>
        <div class="small">${escapeHtml(p.metier)} · ${escapeHtml(p.commune)}</div>
      </div>
      <div style="text-align:right">
        <span class="badge ${p.badge}">${badgeLabel(p.badge)}</span>
        ${p.vitrine_premium?'<div style="margin-top:4px"><span class="badge premium">PREMIUM</span></div>':''}
      </div>
    </div>
    <p style="font-size:.88rem;margin:10px 0">${escapeHtml(p.description||'')}</p>
    ${p.preuve_url?`<img src="${p.preuve_url}" style="max-width:100%;border-radius:8px;margin-bottom:8px">`:""}
    <div class="stars">${(p.avis&&p.avis.length)?stars(avg(p.avis))+" ("+p.avis.length+" avis)":"Pas encore d'avis"}</div>

    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="alert('Contact : ${escapeHtml(p.contact||'')}')">📞 Contacter</button>
      <a class="tile" href="#/profil/${p.id}/mission" style="flex:1">
        <button class="gold" style="width:100%">J'ai réalisé une mission</button>
      </a>
    </div>

    <div class="principle">
      Un avis n'est possible qu'après confirmation mutuelle qu'une mission a bien été réalisée.
      Cela écarte les faux avis.
    </div>

    <h4>Avis récents</h4>
    ${avisHtml}
  </div>`;
}

/* ========== MISSION ========== */
function pageMission(id){
  return `
  <div class="card">
    <h3 style="margin-top:0">Confirmer la mission</h3>
    <p class="small">
      Pour garantir l'authenticité des avis, les deux parties doivent confirmer
      qu'une mission a bien eu lieu avant de pouvoir noter.
    </p>
    <div class="checkline"><input type="checkbox" id="m-jeune"><label style="margin:0">Le prestataire confirme la mission réalisée</label></div>
    <div class="checkline"><input type="checkbox" id="m-emp"><label style="margin:0">L'employeur confirme la mission réalisée</label></div>
    <button style="margin-top:14px;width:100%" onclick="confirmerMission(${id})">Confirmer et passer à la notation</button>
  </div>`;
}
function confirmerMission(id){
  if(!document.getElementById("m-jeune").checked||!document.getElementById("m-emp").checked){
    alert("Les deux parties doivent confirmer la mission.");return;
  }
  nav("/profil/"+id+"/avis");
}

/* ========== AVIS ========== */
let noteChoisie=0;
function pageAvis(id){
  noteChoisie=0;
  return `
  <div class="card">
    <h3 style="margin-top:0">Noter ce profil</h3>
    <p class="small">Ta note alimente directement le badge du prestataire.</p>
    <div class="star-pick" id="starPick" style="margin:14px 0">
      ${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="pickStar(${n})">★</span>`).join("")}
    </div>
    <label>Commentaire (optionnel — 180 caractères max)</label>
    <textarea id="commentaire" rows="3" maxlength="180" placeholder="Ex: travail rapide et soigné."></textarea>
    <button style="margin-top:14px;width:100%" onclick="validerAvis(${id})">Envoyer l'avis</button>
  </div>`;
}
function pickStar(n){
  noteChoisie=n;
  document.querySelectorAll("#starPick span").forEach((s,i)=>s.classList.toggle("on",i<n));
}
async function validerAvis(id){
  if(!noteChoisie){alert("Choisis une note.");return;}
  const commentaire=document.getElementById("commentaire").value;
  const data=await apiAjouterAvis({
    profil_id:parseInt(id,10),
    employeur_id:employeurId,
    note:noteChoisie,
    commentaire
  });
  if(data.error){alert(data.error);return;}
  alert("Avis enregistré.\nBadge actuel : "+badgeLabel(data.badge));
  nav("/profil/"+id);
}

/* ========== DÉMARRAGE ========== */
router();
</script>
</body>
</html>
