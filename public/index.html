<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007FFF">
<title>ZUA MOSALA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --blue:#007FFF; --blue-dark:#0059b3; --blue-deep:#003d80;
  --yellow:#FCD116; --red:#CE1126; --gold:#D4A017; --green:#16A34A;
  --bg:#F8F9FB; --surface:#FFFFFF; --text:#0F172A; --text-soft:#64748B;
  --border:#E5E7EB; --light:#F1F5F9;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06);
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#131B28; --text:#E8EDF5; --text-soft:#8B96A8;
  --border:#1F2A3D; --light:#1A2333;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}

/* ============================================================
   HEADER
============================================================ */
.hdr{position:sticky;top:0;z-index:50;background:var(--surface);
  border-bottom:1px solid var(--border);padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:10px;min-height:56px}
.hdr h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px;
  display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.hdr h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .logo{width:26px;height:26px;flex-shrink:0}
.hdr .back{background:none;border:none;font-size:22px;color:var(--text);
  padding:0 6px 0 0;cursor:pointer;line-height:1;font-weight:300}
.hdr-btn{width:36px;height:36px;border-radius:50%;background:transparent;border:none;
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;
  position:relative;transition:background .15s;flex-shrink:0}
.hdr-btn:hover{background:var(--light)}
.hdr-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.hdr-btn .badge-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;
  background:var(--red);border-radius:50%;border:2px solid var(--surface)}

/* ============================================================
   LAYOUT
============================================================ */
main{max-width:560px;margin:0 auto;padding:16px;width:100%}
@media (min-width:640px){ main{padding:24px} }

/* ============================================================
   BOTTOM NAV
============================================================ */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:none}
.bottomnav.show{display:flex}
.bottomnav a{flex:1;padding:8px 4px 10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;text-decoration:none;
  color:var(--text-soft);font-size:10px;font-weight:600;transition:color .15s;
  position:relative;cursor:pointer;border:none;background:none;font-family:inherit}
.bottomnav a.active{color:var(--blue)}
:root[data-theme="dark"] .bottomnav a.active{color:var(--yellow)}
.bottomnav a svg{width:22px;height:22px;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bottomnav a.plus{color:#fff}
.bottomnav a.plus .plus-icon{width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,127,255,.35);margin-top:-14px;margin-bottom:2px}
.bottomnav a.plus .plus-icon svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4}
.bottomnav a .nav-dot{position:absolute;top:6px;right:calc(50% - 16px);
  width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--surface)}

/* ============================================================
   CARDS & COMPONENTS
============================================================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-.2px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 svg{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:root[data-theme="dark"] .card h3 svg{stroke:var(--yellow)}

label{display:block;font-size:12px;font-weight:600;margin:14px 0 6px;color:var(--text)}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);
  border-radius:11px;font-size:14px;background:var(--bg);color:var(--text);
  font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:var(--surface)}

button{background:var(--blue);color:#fff;border:none;padding:13px 18px;border-radius:11px;
  font-weight:600;cursor:pointer;font-size:14px;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .15s,transform .08s}
button:hover{opacity:.94}
button:active{transform:scale(.985)}
button.block{width:100%}
button.secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
button.secondary:hover{border-color:var(--blue);color:var(--blue)}
button.gold{background:var(--yellow);color:#1a1a1a}
button.green{background:var(--green);color:#fff}
button.danger{background:var(--red);color:#fff}
button.ghost{background:transparent;color:var(--blue);padding:8px 12px}
button:disabled{opacity:.4;cursor:not-allowed}
button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

a{color:var(--blue);text-decoration:none}
a.tile{display:block;text-decoration:none;color:inherit}

/* ============================================================
   BADGES
============================================================ */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:700;color:#fff;line-height:1.3}
.badge.bronze{background:#a06a3c}
.badge.argent{background:#7a7a7a}
.badge.or{background:var(--gold)}
.badge.premium{background:var(--red)}
.badge.courte{background:var(--blue)}
.badge.longue{background:var(--red)}
.badge.verifie{background:var(--green)}
.badge.nonverifie{background:#d97706}
.badge.attente{background:#6b7280}
.badge.postulee{background:#94A3B8}
.badge.acceptee{background:var(--blue)}
.badge.encours{background:var(--yellow);color:#1a1a1a}
.badge.terminee{background:#EA580C}
.badge.confirmee{background:var(--green)}
.badge.avisee{background:#7C3AED}
.badge.annulee{background:#94A3B8}
.badge.refusee{background:#94A3B8}

.stars{color:var(--gold);font-size:14px;letter-spacing:.5px}
.small{font-size:12px;color:var(--text-soft);line-height:1.45}
.principle{background:var(--light);border-left:3px solid var(--yellow);padding:10px 14px;
  font-size:12px;font-weight:500;border-radius:8px;margin:14px 0;line-height:1.5}
.divider{height:1px;background:var(--border);margin:14px 0}

/* ============================================================
   ÉLÉMENTS DE LISTE
============================================================ */
.list-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);
  text-decoration:none;color:inherit;align-items:center}
.list-item:last-child{border-bottom:none}
.list-item .avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
  color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-dark))}
.list-item .info{flex:1;min-width:0}
.list-item .info b{display:block;font-size:14px;font-weight:600;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .info span{font-size:12px;color:var(--text-soft);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .chev{color:var(--text-soft);font-size:20px;flex-shrink:0;font-weight:300}

/* ============================================================
   HERO DÉGRADÉ (page accueil)
============================================================ */
.hero-gradient{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 60%,var(--blue-deep) 100%);
  border-radius:18px;padding:22px 20px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden}
.hero-gradient::before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;
  border-radius:50%;background:var(--yellow);opacity:.2}
.hero-gradient::after{content:"";position:absolute;bottom:-60px;left:-60px;width:180px;height:180px;
  border-radius:50%;background:var(--red);opacity:.15}
.hero-gradient .content{position:relative;z-index:1}
.hero-gradient h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.5px}
.hero-gradient p{margin:0;font-size:14px;opacity:.95}

/* ============================================================
   SEARCH BAR
============================================================ */
.searchbar{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:12px;align-items:center}
.searchbar svg{width:18px;height:18px;stroke:var(--text-soft);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.searchbar input{border:none;background:transparent;flex:1;padding:8px 0;font-size:14px;min-width:0}
.searchbar input:focus{outline:none}
.searchbar button{padding:9px 14px;border-radius:8px;font-size:13px;flex-shrink:0}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
  scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;background:var(--surface);color:var(--text);
  border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ============================================================
   ONBOARDING
============================================================ */
.onb-overlay{position:fixed;inset:0;
  background:linear-gradient(160deg,#007FFF 0%,#0059b3 45%,#003d80 100%);
  z-index:200;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.onb-skip{position:absolute;top:24px;right:20px;background:rgba(255,255,255,.15);
  color:#fff;border:none;padding:8px 14px;border-radius:20px;font-size:13px;
  font-weight:600;cursor:pointer;z-index:2;backdrop-filter:blur(8px)}
.onb-skip:hover{background:rgba(255,255,255,.25)}
.onb-slide{flex:1;display:none;flex-direction:column;padding:80px 28px 140px;
  overflow-y:auto;position:relative}
.onb-slide.active{display:flex;animation:onb-fade .4s ease}
@keyframes onb-fade{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.onb-deco{position:absolute;border-radius:50%;pointer-events:none}
.onb-deco.d1{top:-100px;right:-80px;width:260px;height:260px;
  background:radial-gradient(circle,rgba(252,209,22,.35) 0%,transparent 70%)}
.onb-deco.d2{bottom:-120px;left:-100px;width:300px;height:300px;
  background:radial-gradient(circle,rgba(206,17,38,.3) 0%,transparent 70%)}
.onb-flag{display:flex;gap:5px;margin-bottom:24px}
.onb-flag div{width:28px;height:5px;border-radius:3px}
.onb-flag .b{background:#007FFF;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.onb-flag .y{background:#FCD116}
.onb-flag .r{background:#CE1126}
.onb-brand{margin-bottom:18px}
.onb-brand-title{font-size:36px;font-weight:900;letter-spacing:-1.5px;line-height:1;margin:0}
.onb-brand-title span{color:#FCD116}
.onb-brand-sub{font-size:14px;opacity:.85;margin-top:6px;font-weight:500}
.onb-title{font-size:28px;font-weight:800;letter-spacing:-1px;margin:0 0 14px;
  line-height:1.15;position:relative;z-index:1}
.onb-title span{color:#FCD116}
.onb-text{font-size:16px;line-height:1.6;opacity:.95;margin:0 0 14px;
  position:relative;z-index:1;font-weight:400}
.onb-text b{font-weight:700}
.onb-big-num{font-size:64px;font-weight:900;line-height:1;color:#FCD116;
  letter-spacing:-3px;margin:8px 0 4px}
.onb-illust{width:80px;height:80px;margin:20px 0 24px;position:relative;z-index:1;
  background:rgba(255,255,255,.15);border-radius:22px;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.onb-illust svg{width:42px;height:42px;stroke:#FCD116;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.onb-list{position:relative;z-index:1;margin-top:14px}
.onb-item{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.onb-item-num{width:32px;height:32px;border-radius:50%;background:rgba(252,209,22,.25);
  color:#FCD116;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;flex-shrink:0;border:1.5px solid rgba(252,209,22,.4)}
.onb-item-txt{font-size:15px;line-height:1.5}
.onb-item-txt b{display:block;margin-bottom:3px;font-weight:700}
.onb-item-txt span{opacity:.8;font-size:13.5px}
.onb-choice{display:flex;flex-direction:column;gap:12px;margin-top:24px;position:relative;z-index:1}
.onb-choice button{padding:18px 20px;background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;
  display:flex;align-items:center;gap:14px;text-align:left;font-size:15px;
  font-weight:600;backdrop-filter:blur(8px);transition:background .15s}
.onb-choice button:hover{background:rgba(255,255,255,.2)}
.onb-choice button .ico{width:44px;height:44px;border-radius:12px;
  background:rgba(252,209,22,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.onb-choice button .ico svg{width:22px;height:22px;stroke:#FCD116;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.onb-choice button .txt{flex:1}
.onb-choice button .txt b{display:block;font-weight:700;font-size:15px}
.onb-choice button .txt span{font-size:12.5px;opacity:.85;display:block;margin-top:3px;font-weight:400}
.onb-bottom{position:absolute;bottom:0;left:0;right:0;padding:20px 28px 32px;
  background:linear-gradient(180deg,transparent 0%,rgba(0,45,90,.5) 100%);z-index:1}
.onb-dots{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.onb-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}
.onb-dot.active{background:#FCD116;width:26px;border-radius:4px}
.onb-buttons{display:flex;gap:10px}
.onb-buttons button{flex:1;padding:15px;font-size:15px;background:#FCD116;
  color:#1a1a1a;font-weight:700;border-radius:12px}
.onb-buttons button.ghost{background:rgba(255,255,255,.15);color:#fff}

/* ============================================================
   MISSION CARD
============================================================ */
.mission-card{background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.mission-card .head{display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;margin-bottom:10px}
.mission-card .title{font-size:15px;font-weight:700;margin:0;line-height:1.3}
.mission-card .meta{font-size:12px;color:var(--text-soft);display:flex;gap:12px;
  flex-wrap:wrap;margin-top:6px}
.mission-card .meta span{display:inline-flex;align-items:center;gap:4px}
.mission-card .meta svg{width:13px;height:13px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mission-card .actions{display:flex;gap:8px;margin-top:14px}
.mission-card .actions button{flex:1;padding:11px;font-size:13px}
.mission-card .status-line{font-size:12.5px;color:var(--text-soft);
  padding:10px 12px;background:var(--light);border-radius:9px;margin-top:10px;
  line-height:1.45}

/* ============================================================
   AUTH TABS
============================================================ */
.auth-tabs{display:flex;gap:6px;background:var(--light);padding:5px;
  border-radius:13px;margin-bottom:20px}
.auth-tab{flex:1;padding:11px;text-align:center;font-weight:600;font-size:14px;
  cursor:pointer;border-radius:9px;color:var(--text-soft);transition:all .15s}
.auth-tab.active{background:var(--surface);color:var(--text);
  box-shadow:0 1px 3px rgba(15,23,42,.08)}

/* ============================================================
   TABS ESPACE
============================================================ */
.esp-tabs{display:flex;gap:6px;background:var(--light);padding:5px;
  border-radius:13px;margin-bottom:16px;overflow-x:auto}
.esp-tab{flex:1;padding:11px 14px;text-align:center;font-weight:600;
  font-size:13px;cursor:pointer;border-radius:9px;color:var(--text-soft);
  transition:all .15s;white-space:nowrap;min-width:fit-content}
.esp-tab.active{background:var(--surface);color:var(--text);
  box-shadow:0 1px 3px rgba(15,23,42,.08)}

/* ============================================================
   EMPTY STATE
============================================================ */
.empty{text-align:center;padding:48px 20px;color:var(--text-soft)}
.empty svg{width:48px;height:48px;stroke:var(--text-soft);fill:none;
  stroke-width:1.4;opacity:.5;margin-bottom:16px}
.empty p{margin:0;font-size:14px;line-height:1.5}
.empty button{margin-top:20px}

/* ============================================================
   LOADER
============================================================ */
.loader{text-align:center;padding:60px 20px;color:var(--text-soft);font-size:14px}

/* ============================================================
   NOTIF ITEM
============================================================ */
.notif-item{display:flex;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.notif-item:last-child{border-bottom:none}
.notif-item.unread{background:linear-gradient(90deg,rgba(0,127,255,.04),transparent)}
.notif-item .ico{width:36px;height:36px;border-radius:10px;background:var(--light);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue)}
:root[data-theme="dark"] .notif-item .ico{color:var(--yellow)}
.notif-item .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.notif-item .info{flex:1;min-width:0}
.notif-item .info b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.notif-item .info p{margin:2px 0 0;font-size:13px;color:var(--text-soft);line-height:1.45}
.notif-item .info .time{font-size:11px;color:var(--text-soft);margin-top:4px;opacity:.7}

/* ============================================================
   PROFIL HEADER
============================================================ */
.profil-head{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
  border-radius:18px;padding:22px 20px;color:#fff;margin-bottom:14px;
  position:relative;overflow:hidden}
.profil-head::before{content:"";position:absolute;top:-30px;right:-30px;
  width:140px;height:140px;border-radius:50%;background:var(--yellow);opacity:.18}
.profil-head .content{position:relative;z-index:1;display:flex;
  justify-content:space-between;align-items:flex-start;gap:12px}
.profil-head h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.5px}
.profil-head p{margin:0;font-size:14px;opacity:.9}
.profil-head .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ============================================================
   QR
============================================================ */
#qr{display:flex;justify-content:center;margin:16px 0;padding:16px;
  background:#fff;border-radius:14px;border:1px solid var(--border)}

/* ============================================================
   AVIS
============================================================ */
.avis-item{border-top:1px solid var(--border);padding:14px 0;font-size:14px}
.avis-item:first-child{border-top:none}
.avis-item .reponse{background:var(--light);border-radius:9px;
  padding:10px 12px;margin-top:8px;font-size:13px}

/* ============================================================
   STAR PICKER
============================================================ */
.star-pick{display:flex;gap:6px;justify-content:center;margin:20px 0}
.star-pick span{font-size:40px;cursor:pointer;opacity:.25;
  transition:opacity .15s;color:var(--gold);user-select:none;line-height:1}
.star-pick span.on{opacity:1;transform:scale(1.05)}

/* ============================================================
   CHECKBOX
============================================================ */
.checkline{display:flex;gap:11px;align-items:flex-start;font-size:13px;
  margin-top:14px;line-height:1.5}
.checkline input{width:auto;margin-top:3px;flex-shrink:0;
  width:18px;height:18px;accent-color:var(--blue)}
.consent{font-size:12px;color:var(--text-soft);line-height:1.5}
</style>
</head>
<body>
<header class="hdr" id="header">
  <button class="back" id="backBtn" onclick="history.back()" style="display:none">‹</button>
  <h1 id="headerTitle">
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#007FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="4" r="2" fill="#FCD116"/>
    </svg>
    <span>ZUA MOSALA</span>
  </h1>
  <button class="hdr-btn" id="notifBtn" onclick="nav('/notifications')" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span class="badge-dot" id="notifDot" style="display:none"></span>
  </button>
  <button class="hdr-btn" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main id="app"><div class="loader">Chargement…</div></main>

<nav class="bottomnav" id="bottomnav">
  <a href="#/" onclick="event.preventDefault();nav('/')" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/></svg>
    <span>Accueil</span>
  </a>
  <a href="#/recherche" onclick="event.preventDefault();nav('/recherche')" data-tab="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Recherche</span>
  </a>
  <a href="javascript:void(0)" onclick="actionPlus()" class="plus" data-tab="plus">
    <div class="plus-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
  </a>
  <a href="#/notifications" onclick="event.preventDefault();nav('/notifications')" data-tab="notifs">
    <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span class="nav-dot" id="navDot" style="display:none"></span>
    <span>Alertes</span>
  </a>
  <a href="#/compte" onclick="event.preventDefault();nav('/compte')" data-tab="compte">
    <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 20a8 8 0 0 1 16 0"/></svg>
    <span>Compte</span>
  </a>
</nav>

<script>
/* ============================================================
   ICÔNES
============================================================ */
const I = {
  user:'<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 20a8 8 0 0 1 16 0"/></svg>',
  brief:'<svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  money:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  users:'<svg viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 20v-2a4 4 0 0 0-3-3.87"/></svg>',
  send:'<svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
  phone:'<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7 12.8 12.8 0 0 0 .7 2.8 2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4 12.8 12.8 0 0 0 2.8.7 2 2 0 0 1 1.7 2z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  bell:'<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  badge:'<svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M12 3l8 4v6c0 5-3.5 8-8 8s-8-3-8-8V7l8-4z"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  arrow:'<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
  rocket:'<svg viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2M15 9l6-6M9 15l-4 4M15 9c1-4 4-6 7-6 0 3-2 6-6 7"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  logout:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17.5 6.5 21 8 13.5 3 9l6.5-.5L12 2z"/></svg>',
};

/* ============================================================
   THEME
============================================================ */
(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('zua_theme')||'light'); })();
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')||'light';
  const nxt = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  localStorage.setItem('zua_theme', nxt);
}

/* ============================================================
   STATE
============================================================ */
const API = '/api';
let authToken = localStorage.getItem('zua_token') || null;
let authCompte = null;
let authEmployeur = null;
let profiles = [];
let missions = [];
let notifCount = 0;
let espTab = 'profil';

function setToken(t){
  authToken = t;
  if(t) localStorage.setItem('zua_token', t);
  else localStorage.removeItem('zua_token');
  updateAuthUI();
}
function updateAuthUI(){
  const logged = !!authToken;
  const nb = document.getElementById('notifBtn');
  if(nb) nb.style.display = logged ? 'flex' : 'none';
  updateNotifBadge();
}
async function chargerCompte(){
  if(!authToken) return null;
  try{
    const r = await fetch(API+'/auth/moi', { headers:{ 'x-auth-token':authToken } });
    if(!r.ok){ setToken(null); authCompte=null; return null; }
    authCompte = await r.json();
    if(authCompte.type==='employeur'){
      try{ authEmployeur = await apiGet('/employeurs/moi'); }catch(e){}
    }
    updateAuthUI();
    return authCompte;
  }catch(e){ return null; }
}
async function deconnexion(){
  try{ if(authToken) await fetch(API+'/auth/deconnexion',{method:'POST',headers:{'x-auth-token':authToken}}); }catch(e){}
  setToken(null); authCompte=null; authEmployeur=null;
  localStorage.removeItem('zua_onb_seen');
  nav('/');
  setTimeout(()=>location.reload(), 100);
}
function authHeaders(){
  return authToken ? { 'Content-Type':'application/json','x-auth-token':authToken } : { 'Content-Type':'application/json' };
}

/* ============================================================
   HELPERS
============================================================ */
const rk = b => ({bronze:0,argent:1,or:2}[b]||0);
const avg = a => a.length ? a.reduce((s,x)=>s+x.note,0)/a.length : 0;
const stars = n => { const f=Math.round(n); return "★".repeat(f)+"☆".repeat(5-f); };
const bLabel = b => ({bronze:"Bronze",argent:"Argent",or:"Or"}[b]);
const nav = h => location.hash = h;
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) : '';

/* ============================================================
   API
============================================================ */
async function apiGet(u){ const r=await fetch(API+u,{headers:authToken?{'x-auth-token':authToken}:{}}); if(!r.ok)throw new Error('Erreur '+r.status); return await r.json(); }
async function apiPost(u,b){ const r=await fetch(API+u,{method:'POST',headers:authHeaders(),body:b?JSON.stringify(b):undefined}); return await r.json(); }
async function apiPut(u,b){ const r=await fetch(API+u,{method:'PUT',headers:authHeaders(),body:b?JSON.stringify(b):undefined}); return await r.json(); }

/* ============================================================
   ROUTER
============================================================ */
function parseHash(){ const h=(location.hash.slice(1)||'/'); const [p,q]=h.split('?'); return { segs:p.split('/').filter(Boolean), params:new URLSearchParams(q||'') }; }

function setHeader(title, showBack){
  document.getElementById('headerTitle').innerHTML = `
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#007FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="4" r="2" fill="#FCD116"/>
    </svg>
    <span>${esc(title)}</span>`;
  document.getElementById('backBtn').style.display = showBack?'block':'none';
}

function updateBottomNav(activeTab){
  const nav = document.getElementById('bottomnav');
  if(!authToken){ nav.classList.remove('show'); return; }
  nav.classList.add('show');
  document.querySelectorAll('.bottomnav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.tab === activeTab);
  });
}

function requireAuth(redir){
  if(!authToken){
    nav('/auth?redirect='+encodeURIComponent(redir||location.hash.slice(1)||'/'));
    return false;
  }
  return true;
}

async function router(){
  const {segs, params} = parseHash();
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loader">Chargement…</div>`;

  const to = setTimeout(()=>{
    if(app.innerHTML.includes('Chargement')){
      app.innerHTML = `<div class="card"><h3>Serveur lent</h3><p class="small">Attends 30 secondes puis recharge.</p><button class="block" onclick="router()">Réessayer</button></div>`;
    }
  }, 8000);

  try{
    /* Diaporama première visite */
    const seen = localStorage.getItem('zua_onb_seen');
    if(!seen && segs.length===0){ showOnboarding(); return; }

    /* HOME */
    if(segs.length===0){
      updateBottomNav('home');
      if(authToken){
        setHeader('ZUA MOSALA', false);
        try{ profiles = await apiGet('/profils'); }catch(e){ profiles=[]; }
        try{ missions = await apiGet('/missions'); }catch(e){ missions=[]; }
        app.innerHTML = pageHomeLogged();
      } else {
        setHeader('ZUA MOSALA', false);
        try{ missions = await apiGet('/missions'); }catch(e){ missions=[]; }
        app.innerHTML = pageHomeGuest();
      }
      return;
    }

    /* AUTH */
    if(segs[0]==='auth'){
      updateBottomNav(null);
      setHeader('Connexion', true);
      app.innerHTML = pageAuth(params.get('redirect')||'/');
      return;
    }

    /* NOTIFICATIONS */
    if(segs[0]==='notifications'){
      if(!requireAuth('/notifications')) return;
      updateBottomNav('notifs');
      setHeader('Notifications', false);
      try{ await apiPost('/notifications/marquer-vues'); }catch(e){}
      const list = await apiGet('/notifications');
      notifCount=0; updateNotifBadge();
      app.innerHTML = pageNotifications(list);
      return;
    }

    /* RECHERCHE */
    if(segs[0]==='recherche'){
      updateBottomNav('search');
      setHeader('Recherche', false);
      if(authCompte && authCompte.type==='employeur'){
        app.innerHTML = pageRechercheTalent();
      } else {
        app.innerHTML = pageRechercheOffre();
      }
      return;
    }

    /* COMPTE */
    if(segs[0]==='compte'){
      if(!requireAuth('/compte')) return;
      updateBottomNav('compte');
      setHeader('Compte', false);
      app.innerHTML = pageCompte();
      return;
    }
    if(segs[0]==='parametres'){
      if(!requireAuth('/parametres')) return;
      setHeader('Paramètres', true);
      app.innerHTML = pageParametres();
      return;
    }

    /* PROFIL PUBLIC (QR) */
    if(segs[0]==='p' && segs.length===2){
      setHeader('Profil', true);
      try{ const p = await apiGet('/public/profil/'+segs[1]); app.innerHTML = pageProfilPublic(p); }
      catch(e){ app.innerHTML = `<div class="card"><h3>Profil introuvable</h3></div>`; }
      return;
    }

    /* Blocage métier */
    if(segs[0]==='jeune' && authCompte && authCompte.type==='employeur'){
      app.innerHTML = `<div class="card"><h3>${I.lock} Accès réservé aux jeunes</h3><p class="small">Ton compte est un compte employeur.</p><a class="tile" href="#/employeur"><button class="block">Aller à l'espace employeur</button></a></div>`;
      return;
    }
    if(segs[0]==='employeur' && authCompte && authCompte.type==='jeune'){
      app.innerHTML = `<div class="card"><h3>${I.lock} Accès réservé aux employeurs</h3><p class="small">Ton compte est un compte jeune.</p><a class="tile" href="#/jeune/profil"><button class="block">Aller à mon profil</button></a></div>`;
      return;
    }

    /* JEUNE */
    if(segs[0]==='jeune' && segs[1]==='creer'){
      if(!requireAuth('/jeune/creer')) return;
      if(authCompte && authCompte.profil_id){ nav('/jeune/profil'); return; }
      setHeader('Créer mon profil', true);
      app.innerHTML = pageCreer();
      return;
    }
    if(segs[0]==='jeune' && segs[1]==='profil'){
      if(!requireAuth('/jeune/profil')) return;
      if(!authCompte || !authCompte.profil_id){ nav('/jeune/creer'); return; }
      updateBottomNav('compte');
      setHeader('Mon espace', false);
      const p = await apiGet('/profils/'+authCompte.profil_id);
      let cands = [];
      try{ cands = await apiGet('/jeune/candidatures'); }catch(e){}
      app.innerHTML = pageEspaceJeune(p, cands);
      if(espTab==='badge') renderQR(p.id);
      return;
    }
    if(segs[0]==='jeune' && segs[1]==='editer'){
      if(!requireAuth('/jeune/editer')) return;
      setHeader('Éditer mon profil', true);
      const p = await apiGet('/profils/'+authCompte.profil_id);
      app.innerHTML = pageEditerProfil(p);
      return;
    }
    if(segs[0]==='jeune' && segs[1]==='vitrine'){
      if(!requireAuth('/jeune/vitrine')) return;
      setHeader('Booster ma vitrine', true);
      const p = await apiGet('/profils/'+authCompte.profil_id);
      app.innerHTML = pageVitrine(p);
      return;
    }

    /* MISSIONS (public) */
    if(segs[0]==='missions'){
      updateBottomNav('search');
      setHeader('Offres', true);
      try{ missions = await apiGet('/missions'+(params.get('q')?'?q='+encodeURIComponent(params.get('q')):'')); }catch(e){ missions=[]; }
      app.innerHTML = pageMissions(missions, params);
      return;
    }

    /* EMPLOYEUR */
    if(segs[0]==='employeur' && segs.length===1){
      if(!requireAuth('/employeur')) return;
      updateBottomNav('compte');
      setHeader('Espace employeur', false);
      app.innerHTML = pageEmployeur();
      return;
    }
    if(segs[0]==='employeur' && segs[1]==='publier'){
      if(!requireAuth('/employeur/publier')) return;
      setHeader('Publier une offre', true);
      app.innerHTML = pagePublier();
      return;
    }
    if(segs[0]==='employeur' && segs[1]==='candidatures'){
      if(!requireAuth('/employeur/candidatures')) return;
      setHeader('Mes missions', true);
      const list = await apiGet('/employeurs/candidatures');
      app.innerHTML = pageMissionsEmployeur(list);
      return;
    }
    if(segs[0]==='employeur' && segs[1]==='resultats'){
      if(!requireAuth('/employeur/resultats')) return;
      setHeader('Résultats', true);
      try{ profiles = await apiGet('/profils'); }catch(e){ profiles=[]; }
      app.innerHTML = pageResultats(params);
      return;
    }
    if(segs[0]==='institution' && segs[1]==='dashboard'){
      if(!requireAuth('/institution/dashboard')) return;
      setHeader('Rapports', true);
      const stats = await apiGet('/stats');
      app.innerHTML = pageStats(stats);
      return;
    }

    /* FICHE PROFIL */
    if(segs[0]==='profil' && segs.length===2){
      if(!requireAuth('/profil/'+segs[1])) return;
      setHeader('Fiche profil', true);
      const p = await apiGet('/profils/'+segs[1]);
      app.innerHTML = pageFiche(p);
      return;
    }

    /* AVIS */
    if(segs[0]==='avis' && segs[1]){
      if(!requireAuth()) return;
      setHeader('Laisser un avis', true);
      app.innerHTML = pageAvis(segs[1], params.get('mission'));
      return;
    }

    /* SIGNALER */
    if(segs[0]==='signaler' && segs[1] && segs[2]){
      if(!requireAuth()) return;
      setHeader('Signaler', true);
      app.innerHTML = pageSignaler(segs[1], segs[2]);
      return;
    }

    app.innerHTML = `<div class="card"><p>Page introuvable.</p></div>`;
  }catch(e){
    app.innerHTML = `<div class="card"><h3>Erreur</h3><p class="small">${esc(e.message)}</p><button class="block" onclick="router()">Réessayer</button></div>`;
  } finally { clearTimeout(to); }
}
window.addEventListener('hashchange', router);

/* ============================================================
   ONBOARDING 4 SLIDES
============================================================ */
function showOnboarding(){
  document.getElementById('bottomnav').classList.remove('show');
  const ov = document.createElement('div');
  ov.className='onb-overlay'; ov.id='onbOverlay';
  ov.innerHTML = `
    <button class="onb-skip" onclick="closeOnboarding()">Passer</button>

    <div class="onb-slide active" data-slide="0">
      <div class="onb-deco d1"></div><div class="onb-deco d2"></div>
      <div class="onb-flag"><div class="b"></div><div class="y"></div><div class="r"></div></div>
      <div class="onb-brand">
        <h1 class="onb-brand-title">ZUA <span>MOSALA</span></h1>
        <p class="onb-brand-sub">Le portfolio qui prouve ce que tu sais faire.</p>
      </div>
      <div class="onb-illust">${I.badge}</div>
      <p class="onb-text">Créé à Kinshasa, pour les jeunes autodidactes de la RDC.</p>
    </div>

    <div class="onb-slide" data-slide="1">
      <div class="onb-deco d1"></div><div class="onb-deco d2"></div>
      <div class="onb-flag"><div class="b"></div><div class="y"></div><div class="r"></div></div>
      <div class="onb-big-num">1M+</div>
      <h2 class="onb-title">de jeunes.<br>Zéro <span>preuve</span>.</h2>
      <p class="onb-text">À Kinshasa, des milliers de jeunes savent coudre, souder, réparer, coiffer.</p>
      <p class="onb-text">Mais <b>aucun diplôme ne le prouve</b>. Les employeurs recrutent au hasard.</p>
    </div>

    <div class="onb-slide" data-slide="2">
      <div class="onb-deco d1"></div><div class="onb-deco d2"></div>
      <div class="onb-flag"><div class="b"></div><div class="y"></div><div class="r"></div></div>
      <h2 class="onb-title">La <span>preuve</span> qui change tout.</h2>
      <p class="onb-text">Un badge vérifié par de vrais employeurs.</p>
      <div class="onb-list">
        <div class="onb-item"><div class="onb-item-num">1</div><div class="onb-item-txt"><b>Bronze</b><span>Ton profil est créé</span></div></div>
        <div class="onb-item"><div class="onb-item-num">2</div><div class="onb-item-txt"><b>Argent</b><span>3 avis de 3 étoiles et plus</span></div></div>
        <div class="onb-item"><div class="onb-item-num">3</div><div class="onb-item-txt"><b>Or</b><span>5 avis de 4 étoiles et plus</span></div></div>
      </div>
      <div class="principle" style="background:rgba(255,255,255,.12);border-left-color:#FCD116;color:#fff">
        Les badges ne s'achètent jamais. Jamais.
      </div>
    </div>

    <div class="onb-slide" data-slide="3">
      <div class="onb-deco d1"></div><div class="onb-deco d2"></div>

      <h2 class="onb-title">Comment veux-tu <span>commencer</span> ?</h2>
      <div class="onb-choice">
        <button onclick="closeOnboarding('/auth?redirect=/jeune/creer')">
          <div class="ico">${I.user}</div>
          <div class="txt"><b>Je cherche du travail</b><span>Créer mon profil autodidacte</span></div>

        </button>
      </div>

    <div class="onb-bottom" id="onbBottom">
      <div class="onb-dots">
        <div class="onb-dot active"></div><div class="onb-dot"></div><div class="onb-dot"></div><div class="onb-dot"></div>
      </div>
      <div class="onb-buttons">
        <button class="ghost" id="onbPrev" onclick="onbPrev()" style="display:none">Retour</button>
        <button id="onbNext" onclick="onbNext()">Suivant</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  window._onbIndex = 0;
}
function onbNext(){
  const s=document.querySelectorAll('.onb-slide'), d=document.querySelectorAll('.onb-dot');
  if(window._onbIndex>=s.length-1) return;
  s[window._onbIndex].classList.remove('active'); d[window._onbIndex].classList.remove('active');
  window._onbIndex++;
  s[window._onbIndex].classList.add('active'); d[window._onbIndex].classList.add('active');
  document.getElementById('onbPrev').style.display = window._onbIndex>0?'block':'none';
  if(window._onbIndex>=s.length-1){
    document.getElementById('onbBottom').style.display='none';
  }
}
function onbPrev(){
  const s=document.querySelectorAll('.onb-slide'), d=document.querySelectorAll('.onb-dot');
  if(window._onbIndex<=0) return;
  s[window._onbIndex].classList.remove('active'); d[window._onbIndex].classList.remove('active');
  window._onbIndex--;
  s[window._onbIndex].classList.add('active'); d[window._onbIndex].classList.add('active');
  document.getElementById('onbPrev').style.display = window._onbIndex>0?'block':'none';
  document.getElementById('onbBottom').style.display='block';
}
function closeOnboarding(redirect){
  const ov = document.getElementById('onbOverlay');
  if(ov) ov.remove();
  localStorage.setItem('zua_onb_seen','1');
  if(redirect) nav(redirect);

}

  const t = document.getElementById('a-type').value;
  document.getElementById('catWrap').style.display = t==='employeur'?'block':'none';

async function inscription(btn){
  const email = document.getElementById('a-email').value.trim();
  const pwd = document.getElementById('a-password').value;
  const type = document.getElementById('a-type').value;
  const cat = document.getElementById('a-cat')?.value || null;
  const prenom = document.getElementById('a-prenom').value.trim();
  const nom = document.getElementById('a-nom').value.trim();
  const telephone = document.getElementById('a-tel').value.trim();
  if(!email || !pwd){ alert('Remplis tous les champs'); return; }
  btn.disabled=true; btn.textContent='Création…';
  const data = await apiPost('/auth/inscription',{email,password:pwd,type,employeur_categorie:cat,prenom,nom,telephone});
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Créer mon compte'; return; }
  setToken(data.token);
  await chargerCompte();
  const r = document.getElementById('authRedirect').value;
  if(r && r !== '/') nav(r);
  else if(authCompte.type === 'employeur') nav('/employeur');
  else nav('/jeune/creer');
}
async function connexion(btn){
  const email = document.getElementById('a-email').value.trim();
  const pwd = document.getElementById('a-password').value;
  if(!email || !pwd){ alert('Remplis tous les champs'); return; }
  btn.disabled=true; btn.textContent='Connexion…';
  const data = await apiPost('/auth/connexion',{email,password:pwd});
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Se connecter'; return; }
  setToken(data.token);
  await chargerCompte();
  const r = document.getElementById('authRedirect').value;
  if(r && r !== '/') nav(r);
  else if(authCompte.type === 'employeur') nav('/employeur');
  else if(authCompte.profil_id) nav('/jeune/profil');
  else nav('/jeune/creer');
}

/* ============================================================
   MISSION CARD — Affichage adaptatif selon statut
============================================================ */
function renderMissionCard(c, vue){
  const statut = c.statut2 || 'Postulee';
  const badgeClass = {
    'Postulee':'postulee','Acceptee':'acceptee','EnCours':'encours',
    'Terminee':'terminee','Confirmee':'confirmee','Avisee':'avisee',
    'Annulee':'annulee','Refusee':'refusee','ConfirmeeJeune':'confirmee'
  }[statut] || 'postulee';
  const badgeLabel = {
    'Postulee':'Postulée','Acceptee':'Acceptée','EnCours':'En cours',
    'Terminee':'Terminée — à confirmer','Confirmee':'Confirmée',
    'Avisee':'Avis laissé','Annulee':'Annulée','Refusee':'Refusée',
    'ConfirmeeJeune':'Confirmée'
  }[statut] || statut;

  const titre = vue === 'jeune' ? (c.mission_titre || 'Mission') : (c.mission_titre || 'Mission');
  const sousTitre = vue === 'jeune'
    ? `${c.mission_commune||'—'} · ${c.mission_budget||''}`
    : `${c.profil_nom||'—'} · ${c.profil_metier||''}`;

  let actions = '';
  let statusMsg = '';

  if(vue === 'jeune'){
    if(statut === 'Postulee') statusMsg = 'En attente de réponse de l\\'employeur.';
    else if(statut === 'Acceptee'){
      statusMsg = 'Contacte l\\'employeur pour organiser.';
      actions = `${c.mission_contact?`<button class="secondary" onclick="alert('Contact : ${esc(c.mission_contact)}')">${I.phone} Contacter</button>`:''}`;
    }
    else if(statut === 'EnCours') statusMsg = 'Mission en cours.';
    else if(statut === 'Terminee'){
      statusMsg = 'L\\'employeur a marqué terminé. Confirme.';
      actions = `<button class="green" onclick="confirmerMission(${c.id})">${I.check} Oui, je confirme</button>`;
    }
    else if(statut === 'Confirmee') statusMsg = 'En attente de l\\'avis de l\\'employeur.';
    else if(statut === 'Avisee') statusMsg = 'Avis reçu ✓';
    else if(statut === 'Annulee') statusMsg = `Annulée. Motif : ${esc(c.motif_annulation||'non précisé')}`;
    else if(statut === 'Refusee') statusMsg = 'Candidature refusée.';
  } else {
    if(statut === 'Postulee'){
      actions = `
        <button class="green" onclick="accepterCand(${c.id})">${I.check} Accepter</button>
        <button class="secondary" onclick="refuserCand(${c.id})">Refuser</button>`;
    }
    else if(statut === 'Acceptee'){
      actions = `
        <button class="gold" onclick="demarrerMission(${c.id})">Démarrer la mission</button>
        <button class="secondary" onclick="annulerCand(${c.id})">Annuler</button>`;
    }
    else if(statut === 'EnCours'){
      actions = `
        <button class="gold" onclick="terminerMission(${c.id})">Marquer terminée</button>
        <button class="secondary" onclick="annulerCand(${c.id})">Annuler</button>`;
    }
    else if(statut === 'Terminee') statusMsg = 'En attente de confirmation du jeune.';
    else if(statut === 'Confirmee'){
      actions = `<button class="green" onclick="laisserAvis(${c.id}, ${c.profil_id})">${I.star} Laisser un avis</button>`;
    }
    else if(statut === 'Avisee') statusMsg = 'Avis déposé ✓';
    else if(statut === 'Annulee') statusMsg = `Annulée. Motif : ${esc(c.motif_annulation||'non précisé')}`;
    else if(statut === 'Refusee') statusMsg = 'Candidature refusée.';
  }

  return `
  <div class="mission-card">
    <div class="head">
      <div style="flex:1;min-width:0">
        <h3 class="title">${esc(titre)}</h3>
        <div class="meta"><span>${I.pin}${esc(sousTitre)}</span></div>
      </div>
      <span class="badge ${badgeClass}">${badgeLabel}</span>
    </div>
    ${c.description ? `<p class="small" style="margin:8px 0 0">${esc(c.description)}</p>` : ''}
    ${statusMsg ? `<div class="status-line">${statusMsg}</div>` : ''}
    ${actions ? `<div class="actions">${actions}</div>` : ''}
  </div>`;
}

    <h3>${I.brief} Missions courtes</h3>
    <p class="small">${courtes.length} offre(s)</p>
    ${courtes.length?courtes.map(rm).join(''):'<p class="small">Aucune mission courte.</p>'}
  </div>

  ${longues.length?`
  <div class="card">
    <h3>${I.brief} Emplois longue durée</h3>
    <p class="small">${longues.length} offre(s)</p>
    ${longues.map(rm).join('')}
  </div>`:''}`;
}
function searchMissions(){ const q=document.getElementById('missionSearch').value.trim(); nav('/missions'+(q?'?q='+encodeURIComponent(q):'')); }
async function postuler(missionId){
  if(!authToken){ nav('/auth?redirect=/missions'); return; }
  if(!authCompte || authCompte.type!=='jeune'){ alert('Réservé aux jeunes.'); return; }
  if(!authCompte.profil_id){ alert('Crée d\'abord ton profil.'); nav('/jeune/creer'); return; }
  if(!confirm('Postuler à cette offre ?')) return;
  const data = await apiPost('/missions/'+missionId+'/postuler');
  if(data.error){ alert(data.error); return; }
  alert('Candidature envoyée ✓');
}

/* ============================================================
   PROFIL PUBLIC (via QR)
============================================================ */
function pageProfilPublic(p){
  const a = p.avis||[];
  const isPremium = p.vitrine_premium == 1;
  const h = a.slice(0,5).map(x=>`<div class="avis-item"><div class="stars">${stars(x.note)}</div><div style="margin-top:6px">${esc(x.commentaire||'')}</div>${x.reponse?`<div class="reponse"><b>Réponse :</b> ${esc(x.reponse)}</div>`:''}</div>`).join('')||'<p class="small">Pas encore d\'avis.</p>';
  return `
  <div class="profil-head">
    <div class="content">
      <div>
        <h2>${esc(p.nom)}</h2>
        <p>${esc(p.metier)} · ${esc(p.commune)}</p>
      </div>
      <div class="badges">
        <span class="badge ${p.badge}" style="font-size:12px;padding:5px 12px">${bLabel(p.badge)}</span>
        ${isPremium?'<span class="badge premium" style="font-size:12px;padding:5px 12px">PREMIUM</span>':''}
      </div>
    </div>
    <div style="margin-top:14px;position:relative;z-index:1">
      <div class="stars" style="font-size:16px">${a.length?stars(avg(a))+' ('+a.length+' avis)':'Pas encore d\'avis'}</div>
    </div>
  </div>

  <div class="card">
    <h3>${I.user} À propos</h3>
    <p class="small" style="margin:0">${esc(p.description||'')}</p>
    ${p.preuve_url?`<div style="margin-top:12px"><img src="${p.preuve_url}" style="width:100%;border-radius:10px"></div>`:''}
  </div>

  <div class="card">
    <h3>${I.phone} Contacter</h3>
    <button class="block" onclick="alert('Contact : ${esc(p.contact||'—')}')">${I.phone} Voir le contact</button>
  </div>

  <div class="card">
    <h3>${I.star} Avis</h3>
    ${h}
  </div>`;
}

/* ============================================================
   SIGNALER
============================================================ */
function pageSignaler(type, id){
  return `
  <div class="card">
    <h3>${I.warn} Signaler</h3>
    <p class="small">Les signalements graves sont examinés par notre équipe.</p>
    <label>Motif</label>
    <select id="s-motif">
      <option value="fausse-identite">Fausse identité</option>
      <option value="faux-avis">Faux avis</option>
      <option value="contenu-inapproprie">Contenu inapproprié</option>
      <option value="fraude">Fraude / arnaque</option>
      <option value="autre">Autre</option>
    </select>
    <label>Détails (optionnel)</label>
    <textarea id="s-detail" rows="3" maxlength="200"></textarea>
    <button class="block" style="margin-top:18px" onclick="envoyerSignalement('${type}',${id},this)">Envoyer le signalement</button>
  </div>`;
}
async function envoyerSignalement(type,id,btn){
  btn.disabled=true; btn.textContent='Envoi…';
  const motif = document.getElementById('s-motif').value + ' — ' + document.getElementById('s-detail').value.trim();
  const data = await apiPost('/signalements',{cible_type:type,cible_id:id,motif});
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Envoyer'; return; }
  alert('Signalement transmis. Merci.');
  history.back();
}

/* ============================================================
   STATS
============================================================ */
function pageStats(s){
  if(!s||s.error) return `<div class="card"><p>Erreur.</p></div>`;
  const c = (s.par_commune||[]).map(x=>`<div class="list-item"><span style="flex:1">${esc(x.commune||'—')}</span><b>${x.total}</b></div>`).join('');
  const m = (s.par_metier||[]).map(x=>`<div class="list-item"><span style="flex:1">${esc(x.metier||'—')}</span><b>${x.total}</b></div>`).join('');
  const b = (s.par_badge||[]).map(x=>`<div class="list-item"><span class="badge ${x.badge}">${bLabel(x.badge)}</span><b style="margin-left:auto">${x.total}</b></div>`).join('');
  return `
  <div class="card">
    <h3>Rapport ZUA MOSALA</h3>
    <div style="display:flex;gap:10px;margin:16px 0">
      <div style="flex:1;background:var(--light);padding:14px;border-radius:12px;text-align:center">
        <div style="font-size:20px;font-weight:800;color:var(--blue)">${s.total_profils||0}</div>
        <div class="small">Profils</div>
      </div>
      <div style="flex:1;background:var(--light);padding:14px;border-radius:12px;text-align:center">
        <div style="font-size:20px;font-weight:800;color:var(--red)">${s.total_avis||0}</div>
        <div class="small">Avis</div>
      </div>
      <div style="flex:1;background:var(--light);padding:14px;border-radius:12px;text-align:center">
        <div style="font-size:20px;font-weight:800;color:var(--gold)">${s.total_missions||0}</div>
        <div class="small">Offres</div>
      </div>
    </div>
  </div>
  <div class="card"><h3>Par commune</h3>${c}</div>
  <div class="card"><h3>Par métier</h3>${m}</div>
  <div class="card"><h3>Badges</h3>${b}</div>`;
}

/* ============================================================
   ÉDITER PROFIL
============================================================ */
function pageEditerProfil(p){
  return `
  <div class="card">
    <h3>${I.edit} Éditer mon profil</h3>
    <label>Nom</label><input id="e-nom" value="${esc(p.nom)}">
    <label>Métier</label><input id="e-metier" value="${esc(p.metier)}">
    <label>Commune</label><input id="e-commune" value="${esc(p.commune)}">
    <label>Description</label><textarea id="e-desc" rows="3">${esc(p.description||'')}</textarea>
    <label>Contact</label><input id="e-contact" value="${esc(p.contact||'')}">
    <button class="block" style="margin-top:18px" onclick="sauverProfil(${p.id},this)">Enregistrer</button>
  </div>`;
}
async function sauverProfil(id,btn){
  btn.disabled=true; btn.textContent='Enregistrement…';
  const data = await apiPut('/profils/'+id,{
    nom:document.getElementById('e-nom').value.trim(),
    metier:document.getElementById('e-metier').value.trim(),
    commune:document.getElementById('e-commune').value.trim(),
    description:document.getElementById('e-desc').value.trim(),
    contact:document.getElementById('e-contact').value.trim()
  });
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Enregistrer'; return; }
  alert('Profil mis à jour.');
  nav('/jeune/profil');
}

/* ============================================================
   VITRINE
============================================================ */
function pageVitrine(p){
  const isPremium = p.vitrine_premium == 1;
  return `
  <div class="card">
    <h3>${I.star} Booster ma vitrine</h3>
    <p class="small">Met ton profil en avant dans une section "Sponsorisé". Ton badge reste inchangé — il ne s'achète jamais.</p>
    ${isPremium?`
      <div class="principle">Vitrine active. Expire le ${p.vitrine_expire?new Date(p.vitrine_expire).toLocaleDateString('fr-FR'):'—'}.</div>
      <button class="secondary block" disabled>Vitrine active</button>
    `:`
      <label>Moyen de paiement</label>
      <select id="v-moyen"><option>Mobile Money (Airtel / Orange)</option><option>Carte virtuelle</option><option>Visa / Mastercard</option></select>
      <label>Numéro ou référence</label>
      <input id="v-ref" placeholder="Ex: +243 9...">
      <button class="block" style="margin-top:18px" onclick="payerVitrine(this)">Payer 2,5 $ — 30 jours</button>
    `}
  </div>`;
}
async function payerVitrine(btn){
  const ref = document.getElementById('v-ref').value.trim();
  if(!ref){ alert('Renseigne une référence.'); return; }
  btn.disabled=true; btn.textContent='Activation…';
  const data = await apiPut('/profils/'+authCompte.profil_id+'/premium');
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Réessayer'; return; }
  alert('Vitrine activée pour 30 jours.');
  router();
}

/* ============================================================
   NOTIF BADGE
============================================================ */
async function checkNotif(){
  if(!authToken || !authCompte) return;
  try{
    const d = await apiGet('/notifications/count');
    notifCount = d.count||0;
    updateNotifBadge();
  }catch(e){}
}
function updateNotifBadge(){
  const dot = document.getElementById('notifDot');
  const navDot = document.getElementById('navDot');
  const show = notifCount>0;
  if(dot) dot.style.display = show?'block':'none';
  if(navDot) navDot.style.display = show?'block':'none';
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  await chargerCompte();
  updateAuthUI();
  router().catch(e=>console.error(e));
  setInterval(checkNotif, 30000);
  checkNotif();
})();
</script>
</body>
</html>
