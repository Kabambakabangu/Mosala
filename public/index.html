<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007FFF">
<title>ZUA MOSALA — Portfolio certifié</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --blue:#007FFF; --blue-dark:#0059b3; --blue-deep:#003d80;
  --yellow:#FCD116; --red:#CE1126; --gold:#D4A017;
  --bg:#f5f7fa; --surface:#ffffff; --text:#0f172a; --text-soft:#64748b;
  --border:#e5e9f0; --light:#f0f4f9;
  --shadow:0 1px 3px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.04);
}
:root[data-theme="dark"]{
  --bg:#0a1018; --surface:#131b28; --text:#e8edf5; --text-soft:#8b96a8;
  --border:#1f2a3d; --light:#1a2333;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
@media (max-width:380px){ html{font-size:14.5px} }
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}

/* Header */
header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:8px}
header h1{flex:1;margin:0;font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
header h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-btn{width:34px;height:34px;border-radius:50%;background:var(--light);border:none;
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;position:relative;transition:background .15s}
.hdr-btn:hover{background:var(--border)}
.hdr-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.hdr-btn.danger{background:rgba(206,17,38,.12);color:var(--red)}
.hdr-btn.danger:hover{background:rgba(206,17,38,.2)}
.hdr-btn .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--red);
  border-radius:50%;border:2px solid var(--surface)}
.rdc-stripes{display:flex;height:3px}
.rdc-stripes div{flex:1}
.back-btn{background:none;border:none;font-size:1.4rem;color:var(--text);padding:0 6px 0 0;
  cursor:pointer;line-height:1;font-weight:300}

main{max-width:520px;margin:0 auto;padding:12px 14px 60px;width:100%}
@media (min-width:640px){ main{padding:20px 20px 60px} }

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow);word-wrap:break-word}
.card h3{margin:0 0 8px;font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:8px;line-height:1.3}
.card h3 svg{width:16px;height:16px;stroke:var(--blue);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:root[data-theme="dark"] .card h3 svg{stroke:var(--yellow)}
.card h4{margin:16px 0 8px;font-size:.78rem;font-weight:700;color:var(--blue);
  text-transform:uppercase;letter-spacing:.5px}
:root[data-theme="dark"] .card h4{color:var(--yellow)}

label{display:block;font-size:.76rem;font-weight:600;margin:10px 0 5px;color:var(--text)}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:9px;font-size:.88rem;background:var(--bg);color:var(--text);
  font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}

button{background:var(--blue);color:#fff;border:none;padding:11px 16px;border-radius:9px;
  font-weight:600;cursor:pointer;font-size:.85rem;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .15s,transform .08s}
button:hover{opacity:.94}
button:active{transform:scale(.98)}
button.block{width:100%}
button.secondary{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
:root[data-theme="dark"] button.secondary{color:var(--yellow);border-color:var(--yellow)}
button.gold{background:var(--yellow);color:#1a1a1a}
button.danger{background:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:var(--blue);text-decoration:none}
:root[data-theme="dark"] a{color:var(--yellow)}
a.tile{display:block;text-decoration:none;color:inherit}

/* Icônes calibrées strictes */
.small svg,.mission-meta svg,.user-chip svg,.step .txt svg,.pillar .txt svg,
.notif svg,.result .small svg{
  width:13px !important;height:13px !important;max-width:13px !important;max-height:13px !important;
  display:inline-block;vertical-align:-2px;margin-right:3px}
.card h3 > svg,.card h3 svg:first-child{
  width:16px !important;height:16px !important;max-width:16px !important;max-height:16px !important;
  margin-right:4px}
button svg{
  width:14px !important;height:14px !important;max-width:14px !important;max-height:14px !important;
  display:inline-block;vertical-align:middle;flex-shrink:0}
.hdr-btn svg,.back-btn svg{
  width:16px !important;height:16px !important;max-width:16px !important;max-height:16px !important}
.choice-btn .ico svg{
  width:17px !important;height:17px !important;max-width:17px !important;max-height:17px !important}
.pillar-icon svg{
  width:22px !important;height:22px !important;max-width:22px !important;max-height:22px !important}

/* Hero */
.hero{border-radius:16px;overflow:hidden;margin-bottom:14px;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 60%,var(--blue-deep) 100%);
  color:#fff;position:relative}
.hero-top{display:flex;height:4px}
.hero-top div{flex:1}
.hero-content{padding:22px 18px 18px;position:relative;overflow:hidden}
.hero-content::before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;
  border-radius:50%;background:var(--yellow);opacity:.18}
.hero-content::after{content:"";position:absolute;bottom:-60px;left:-60px;width:180px;height:180px;
  border-radius:50%;background:var(--red);opacity:.12}
.hero-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(252,209,22,.2);
  color:var(--yellow);padding:4px 9px;border-radius:20px;font-size:.65rem;font-weight:700;
  letter-spacing:.5px;margin-bottom:10px;position:relative;z-index:1}
.hero-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--yellow)}
.hero h1{font-size:1.65rem;margin:0 0 6px;font-weight:800;letter-spacing:-.8px;
  position:relative;z-index:1;line-height:1.15}
.hero h1 span{color:var(--yellow)}
.hero .tag{font-size:.82rem;opacity:.95;margin:0;line-height:1.45;position:relative;z-index:1;max-width:95%}
.hero-footer{padding:12px 18px;background:rgba(0,0,0,.18);font-size:.75rem;line-height:1.4;opacity:.95}

/* Search */
.search-bar{display:flex;gap:6px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:11px;padding:5px 5px 5px 12px;margin-bottom:10px;align-items:center;box-shadow:var(--shadow)}
.search-bar svg{width:16px;height:16px;stroke:var(--text-soft);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin:0}
.search-bar input{border:none;background:transparent;flex:1;padding:6px 0;font-size:.86rem;min-width:0}
.search-bar input:focus{outline:none}
.search-bar button{padding:8px 12px;border-radius:7px;font-size:.78rem;flex-shrink:0}
.search-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.search-tag{font-size:.68rem;padding:4px 9px;background:var(--light);color:var(--text-soft);
  border-radius:20px;cursor:pointer;border:1px solid var(--border);font-weight:600;transition:background .15s}
.search-tag:hover{background:var(--border)}

/* Piliers */
.pillar{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.pillar:last-of-type{border-bottom:none}
.pillar-icon{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;color:#fff}
.pillar-icon.p1{background:linear-gradient(135deg,#007FFF,#0059b3)}
.pillar-icon.p2{background:linear-gradient(135deg,#FCD116,#D4A017);color:#1a1a1a}
.pillar-icon.p3{background:linear-gradient(135deg,#CE1126,#8b0a1a)}
.pillar .txt{font-size:.82rem;line-height:1.4;min-width:0}
.pillar .txt b{display:block;margin-bottom:2px;color:var(--text);font-size:.85rem}
.pillar .txt span{color:var(--text-soft)}

/* Steps */
.step{display:flex;gap:10px;padding:10px;background:var(--light);border-radius:10px;margin-bottom:8px}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0}
.step-num.y{background:var(--yellow);color:#1a1a1a}
.step-num.r{background:var(--red)}
.step .txt{font-size:.78rem;line-height:1.4;min-width:0}
.step .txt b{display:block;margin-bottom:2px;color:var(--text);font-size:.82rem}
.step .txt span{color:var(--text-soft)}

/* Badges */
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:.66rem;
  font-weight:700;color:#fff;line-height:1.2}
.badge.bronze{background:#a06a3c}
.badge.argent{background:#7a7a7a}
.badge.or{background:var(--gold)}
.badge.premium{background:var(--red);font-size:.58rem;padding:2px 6px}
.badge.courte{background:var(--blue);font-size:.58rem}
.badge.longue{background:var(--red);font-size:.58rem}
.badge.verifie{background:#16a34a;font-size:.58rem}
.badge.nonverifie{background:#d97706;font-size:.58rem}
.stars{color:var(--gold);font-size:.88rem;letter-spacing:.5px}
.small{font-size:.72rem;color:var(--text-soft);line-height:1.4}
.principle{background:var(--light);border-left:3px solid var(--yellow);padding:9px 12px;
  font-size:.74rem;font-weight:500;border-radius:7px;margin:12px 0;line-height:1.45}

/* Mission */
.mission{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px;margin-bottom:9px;box-shadow:var(--shadow)}
.mission-title{font-weight:700;font-size:.88rem;margin:0 0 4px;line-height:1.3;word-wrap:break-word}
.mission-meta{font-size:.68rem;color:var(--text-soft);display:flex;gap:8px;flex-wrap:wrap;
  margin-top:3px;align-items:center}
.mission-meta span{display:inline-flex;align-items:center;gap:3px}
.mission-desc{font-size:.76rem;color:var(--text-soft);margin:6px 0;line-height:1.45}
.mission-actions{display:flex;gap:6px;margin-top:8px}
.mission-actions button{flex:1}

/* Choice */
.choice{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.choice-btn{width:100%;padding:13px 14px;border-radius:12px;font-weight:600;font-size:.86rem;
  display:flex;align-items:center;gap:11px;text-align:left;border:1.5px solid transparent;
  cursor:pointer;font-family:inherit;background:var(--surface);color:var(--text);transition:transform .1s}
.choice-btn:hover{transform:translateY(-1px)}
.choice-btn.primary{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
  color:#fff;position:relative;overflow:hidden}
.choice-btn.primary::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--yellow)}
.choice-btn.secondary{border-color:var(--border)}
.choice-btn .ico{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.choice-btn.secondary .ico{background:var(--light)}
.choice-btn.primary .ico svg{stroke:var(--yellow)}
.choice-btn .txt{flex:1;min-width:0}
.choice-btn .txt b{display:block;font-size:.86rem;font-weight:700}
.choice-btn .txt span{font-size:.72rem;opacity:.75;font-weight:400;display:block;margin-top:2px}

/* Result */
.result{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--border);gap:10px}
.result:last-child{border:none}
.result a{flex:1;text-decoration:none;color:inherit;display:block;min-width:0}

/* Notification */
.notif{background:linear-gradient(135deg,#FCD116 0%,#D4A017 100%);color:#1a1a1a;
  padding:10px 12px;border-radius:11px;margin-bottom:10px;display:flex;align-items:center;
  gap:9px;font-size:.78rem;font-weight:600;box-shadow:0 4px 14px rgba(212,160,23,.3)}
.notif svg{width:20px;height:20px;stroke:#1a1a1a;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin:0}

/* Star */
.star-pick span{font-size:1.7rem;cursor:pointer;opacity:.25;transition:opacity .12s;
  color:var(--gold);user-select:none;display:inline-block}
.star-pick span.on{opacity:1}
#qr{display:flex;justify-content:center;margin:10px 0;padding:12px;background:#fff;border-radius:11px}
.avisItem{border-top:1px solid var(--border);padding:10px 0;font-size:.8rem}
.avisItem:first-child{border-top:none}
.reponse{background:var(--light);border-radius:7px;padding:7px 9px;margin-top:5px;font-size:.74rem}
.checkline{display:flex;gap:9px;align-items:flex-start;font-size:.78rem;margin-top:10px;line-height:1.4}
.checkline input{width:auto;margin-top:2px;flex-shrink:0}
.consent{font-size:.68rem;color:var(--text-soft);line-height:1.45}
.loader{text-align:center;padding:36px;color:var(--text-soft);font-size:.82rem}

/* RDC strip */
.rdc-strip{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;margin-bottom:12px;font-size:.72rem;
  color:var(--text-soft);line-height:1.45}
.rdc-flag{width:24px;height:24px;border-radius:6px;overflow:hidden;flex-shrink:0;
  display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(0,127,255,.3)}
.rdc-flag div{flex:1}

/* Auth */
.auth-wrap{max-width:420px;margin:0 auto;padding-top:16px}
.auth-tabs{display:flex;gap:5px;background:var(--light);padding:4px;border-radius:11px;margin-bottom:16px}
.auth-tab{flex:1;padding:9px;text-align:center;font-weight:600;font-size:.82rem;cursor:pointer;
  border-radius:8px;color:var(--text-soft);transition:background .15s}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.user-chip{display:inline-flex;align-items:center;gap:6px;background:var(--light);
  padding:5px 10px;border-radius:20px;font-size:.7rem;font-weight:600;color:var(--text-soft);
  margin-bottom:10px}

/* Onboarding */
.onb-overlay{position:fixed;inset:0;
  background:linear-gradient(135deg,#007FFF 0%,#0059b3 60%,#003d80 100%);
  z-index:100;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.onb-skip{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);color:#fff;
  border:none;padding:7px 12px;border-radius:18px;font-size:.72rem;font-weight:600;
  cursor:pointer;z-index:2}
.onb-skip:hover{background:rgba(255,255,255,.25)}
.onb-slide{flex:1;display:none;flex-direction:column;padding:60px 24px 130px;
  overflow-y:auto;position:relative}
.onb-slide.active{display:flex;animation:onb-fade .35s ease}
@keyframes onb-fade{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.onb-deco{position:absolute;border-radius:50%;opacity:.14;pointer-events:none}
.onb-deco.d1{top:-60px;right:-40px;width:200px;height:200px;background:#FCD116}
.onb-deco.d2{bottom:-80px;left:-60px;width:220px;height:220px;background:#CE1126}
.onb-flag{display:flex;gap:4px;margin-bottom:18px}
.onb-flag div{width:24px;height:6px;border-radius:3px}
.onb-flag .b{background:#007FFF;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.onb-flag .y{background:#FCD116}
.onb-flag .r{background:#CE1126}
.onb-title{font-size:1.7rem;font-weight:800;letter-spacing:-.7px;margin:0 0 12px;
  line-height:1.15;position:relative;z-index:1}
.onb-title span{color:#FCD116}
.onb-text{font-size:.88rem;line-height:1.55;opacity:.95;margin:0 0 10px;position:relative;z-index:1}
.onb-illust{width:70px;height:70px;margin:14px 0 18px;position:relative;z-index:1;
  background:rgba(255,255,255,.15);border-radius:18px;display:flex;align-items:center;justify-content:center}
.onb-illust svg{width:38px;height:38px;stroke:#FCD116;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.onb-list{position:relative;z-index:1;margin-top:8px}
.onb-item{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
.onb-item-num{width:26px;height:26px;border-radius:50%;background:rgba(252,209,22,.25);
  color:#FCD116;display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:.8rem;flex-shrink:0}
.onb-item-txt{font-size:.84rem;line-height:1.45}
.onb-item-txt b{display:block;margin-bottom:2px}
.onb-item-txt span{opacity:.85}
.onb-bottom{position:absolute;bottom:0;left:0;right:0;padding:16px 24px 26px;
  background:linear-gradient(180deg,transparent 0%,rgba(0,61,128,.4) 100%);z-index:1}
.onb-dots{display:flex;gap:7px;justify-content:center;margin-bottom:14px}
.onb-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .2s}
.onb-dot.active{background:#FCD116;width:22px;border-radius:4px}
.onb-buttons{display:flex;gap:8px}
.onb-buttons button{flex:1;padding:12px;font-size:.85rem;background:#FCD116;
  color:#1a1a1a;font-weight:700;border-radius:9px}
.onb-buttons button.ghost{background:rgba(255,255,255,.15);color:#fff}

/* Tabs esp */
.esp-tabs{display:flex;gap:5px;background:var(--light);padding:4px;border-radius:11px;
  margin-bottom:14px;overflow-x:auto}
.esp-tab{flex:1;padding:9px 12px;text-align:center;font-weight:600;font-size:.76rem;
  cursor:pointer;border-radius:8px;color:var(--text-soft);transition:background .15s;
  white-space:nowrap;min-width:fit-content}
.esp-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.08)}
</style>
</head>
<body>
<header>
  <button class="back-btn" id="backBtn" onclick="history.back()" style="visibility:hidden">‹</button>
  <h1 id="headerTitle">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
      <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#007FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="4" r="2" fill="#FCD116"/>
    </svg>
    <span>ZUA MOSALA</span>
  </h1>
  <button class="hdr-btn" id="notifBtn" onclick="nav('/notifications')" style="display:none" aria-label="Notifications">
    <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span class="dot" id="notifDot" style="display:none"></span>
  </button>
  <button class="hdr-btn" id="userBtn" onclick="nav('/compte')" aria-label="Compte">
    <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 20a8 8 0 0 1 16 0"/></svg>
  </button>
  <button class="hdr-btn" onclick="toggleTheme()" aria-label="Thème">
    <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="hdr-btn danger" id="logoutBtn" onclick="deconnexion()" style="display:none" aria-label="Déconnexion">
    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
  </button>
</header>
<div class="rdc-stripes"><div style="background:#007FFF"></div><div style="background:#FCD116"></div><div style="background:#CE1126"></div></div>
<main id="app"><div class="loader">Chargement…</div></main>

<script>
/* ============ ICONES ============ */
const I = {

/* ============ THEME ============ */
(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('zua_theme')||'light'); })();
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')||'light';
  const nxt = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  localStorage.setItem('zua_theme', nxt);
}

/* ============ STATE ============ */
const API = '/api';
let authToken = localStorage.getItem('zua_token') || null;
let authCompte = null;
let profiles = [];
let missions = [];
let notifCount = 0;
let espTab = 'profil';

function setToken(t){ authToken=t; if(t) localStorage.setItem('zua_token',t); else localStorage.removeItem('zua_token'); updateAuthUI(); }
function updateAuthUI(){
  const logged = !!authToken;
  document.getElementById('logoutBtn').style.display = logged?'flex':'none';
  const nb = document.getElementById('notifBtn');
  if(nb) nb.style.display = (logged && authCompte && authCompte.type==='jeune')?'flex':'none';
}
async function chargerCompte(){
  if(!authToken) return null;
  try{
    const r = await fetch(API+'/auth/moi',{ headers:{ 'x-auth-token':authToken } });
    if(!r.ok){ setToken(null); authCompte=null; return null; }
    authCompte = await r.json();
    updateAuthUI();
    return authCompte;
  }catch(e){ return null; }
}
async function deconnexion(){
  try{ if(authToken) await fetch(API+'/auth/deconnexion',{method:'POST',headers:{'x-auth-token':authToken}}); }catch(e){}
  setToken(null); authCompte=null;
  nav('/');
}
function authHeaders(){
  return authToken ? { 'Content-Type':'application/json','x-auth-token':authToken } : { 'Content-Type':'application/json' };
}

/* ============ HELPERS ============ */
const rk = b => ({bronze:0,argent:1,or:2}[b]||0);
const avg = a => a.length ? a.reduce((s,x)=>s+x.note,0)/a.length : 0;
const stars = n => { const f=Math.round(n); return "★".repeat(f)+"☆".repeat(5-f); };
const bLabel = b => ({bronze:"Bronze",argent:"Argent",or:"Or"}[b]);
const nav = h => location.hash = h;
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============ API ============ */
async function apiGet(u){ const r=await fetch(API+u,{headers:authToken?{'x-auth-token':authToken}:{}}); if(!r.ok)throw new Error('Erreur '+r.status); return await r.json(); }
async function apiPost(u,b){ const r=await fetch(API+u,{method:'POST',headers:authHeaders(),body:b?JSON.stringify(b):undefined}); return await r.json(); }
async function apiPut(u,b){ const r=await fetch(API+u,{method:'PUT',headers:authHeaders(),body:b?JSON.stringify(b):undefined}); return await r.json(); }

/* ============ ROUTER ============ */
function parseHash(){ const h=(location.hash.slice(1)||'/'); const [p,q]=h.split('?'); return { segs:p.split('/').filter(Boolean), params:new URLSearchParams(q||'') }; }
function setHeader(title,showBack){
  document.getElementById('headerTitle').innerHTML = `
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
      <path d="M7 11V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11V6a2 2 0 1 1 4 0v8a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-3a2 2 0 1 1 4 0" stroke="#007FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="4" r="2" fill="#FCD116"/>
    </svg>
    <span>${esc(title)}</span>`;
  document.getElementById('backBtn').style.visibility = showBack?'visible':'hidden';
}

function requireAuth(redir){
  if(!authToken){ nav('/auth?redirect='+encodeURIComponent(redir||location.hash.slice(1)||'/')); return false; }
  return true;
}

async function router(){
  const {segs,params} = parseHash();
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loader">Chargement…</div>`;

  const to = setTimeout(()=>{
    if(app.innerHTML.includes('Chargement')){
      app.innerHTML = `<div class="card"><h3>Serveur lent</h3><p class="small">Attends 30 secondes puis recharge.</p><button class="block" onclick="router()">Réessayer</button></div>`;
    }
  }, 8000);

  try{
    const seen = localStorage.getItem('zua_onb_seen');
    if(!seen && segs.length===0){ showOnboarding(); return; }

    if(segs.length===0){
      setHeader('ZUA MOSALA',false);
      try{ profiles = await apiGet('/profils'); }catch(e){ profiles=[]; }
      try{ missions = await apiGet('/missions'); }catch(e){ missions=[]; }
      app.innerHTML = pageHome();
      return;
    }

    if(segs[0]==='auth'){ setHeader('Connexion',true); app.innerHTML = pageAuth(params.get('redirect')||'/'); return; }

    if(segs[0]==='notifications'){
      if(!requireAuth('/notifications')) return;
      setHeader('Notifications',true);
      try{ await apiPost('/notifications/marquer-vues'); }catch(e){}
      const list = await apiGet('/notifications');
      notifCount=0; updateNotifBadge();
      app.innerHTML = pageNotifications(list);
      return;
    }

    if(segs[0]==='compte'){
      if(!requireAuth('/compte')) return;
      setHeader('Mon compte',true);
      app.innerHTML = pageCompte();
      return;
    }

    if(segs[0]==='p' && segs.length===2){
      setHeader('Profil public',true);
      try{ const p = await apiGet('/public/profil/'+segs[1]); app.innerHTML = pageProfilPublic(p); }
      catch(e){ app.innerHTML = `<div class="card"><h3>Profil introuvable</h3></div>`; }
      return;
    }

    /* Blocage métier */
    if(segs[0]==='jeune' && authCompte && authCompte.type==='employeur'){
      app.innerHTML = `<div class="card"><h3>${I.lock} Accès réservé aux jeunes</h3><p class="small">Ton compte est un compte employeur.</p><a class="tile" href="#/employeur"><button class="block">Aller à l'espace employeur</button></a></div>`;
      return;
    }
    if(segs[0]==='employeur' && authCompte && authCompte.type==='jeune'){
      app.innerHTML = `<div class="card"><h3>${I.lock} Accès réservé aux employeurs</h3><p class="small">Ton compte est un compte jeune.</p><a class="tile" href="#/jeune/profil"><button class="block">Aller à mon profil</button></a></div>`;
      return;
    }

    if(segs[0]==='jeune' && segs[1]==='creer'){
      if(!requireAuth('/jeune/creer')) return;
      if(authCompte && authCompte.profil_id){ nav('/jeune/profil'); return; }
      setHeader('Créer mon profil',true);
      app.innerHTML = pageCreer();
      return;
    }
    if(segs[0]==='jeune' && segs[1]==='profil'){
      if(!requireAuth('/jeune/profil')) return;
      if(!authCompte || !authCompte.profil_id){ nav('/jeune/creer'); return; }
      setHeader('Mon espace',true);
      const p = await apiGet('/profils/'+authCompte.profil_id);
      let cands = [];
      try{ cands = await apiGet('/jeune/candidatures'); }catch(e){}
      app.innerHTML = pageEspaceJeune(p, cands);
      if(espTab==='badge') renderQR(p.id);
      return;
    }
    if(segs[0]==='jeune' && segs[1]==='vitrine'){
      if(!requireAuth('/jeune/vitrine')) return;
      setHeader('Booster ma vitrine',true);
      const p = await apiGet('/profils/'+authCompte.profil_id);
      app.innerHTML = pageVitrine(p);
      return;
    }

    if(segs[0]==='missions'){
      setHeader('Offres et missions',true);
      try{ missions = await apiGet('/missions'+(params.get('q')?'?q='+encodeURIComponent(params.get('q')):'')); }catch(e){ missions=[]; }
      app.innerHTML = pageMissions(missions, params);
      return;
    }

    if(segs[0]==='employeur' && segs.length===1){
      if(!requireAuth('/employeur')) return;
      setHeader('Espace employeur',true);
      app.innerHTML = pageEmployeur();
      return;
    }
    if(segs[0]==='employeur' && segs[1]==='publier'){
      if(!requireAuth('/employeur/publier')) return;
      setHeader('Publier une offre',true);
      app.innerHTML = pagePublier();
      return;
    }
    if(segs[0]==='employeur' && segs[1]==='candidatures'){
      if(!requireAuth('/employeur/candidatures')) return;
      setHeader('Candidatures',true);
      const list = await apiGet('/employeurs/candidatures');
      app.innerHTML = pageCandidatures(list);
      return;
    }
    if(segs[0]==='employeur' && segs[1]==='resultats'){
      if(!requireAuth('/employeur/resultats')) return;
      setHeader('Résultats',true);
      try{ profiles = await apiGet('/profils'); }catch(e){ profiles=[]; }
      app.innerHTML = pageResultats(params);
      return;
    }
    if(segs[0]==='institution' && segs[1]==='dashboard'){
      if(!requireAuth('/institution/dashboard')) return;
      setHeader('Rapports institutionnels',true);
      const stats = await apiGet('/stats');
      app.innerHTML = pageStats(stats);
      return;
    }

    if(segs[0]==='profil' && segs.length===2){
      if(!requireAuth('/profil/'+segs[1])) return;
      setHeader('Fiche profil',true);
      const p = await apiGet('/profils/'+segs[1]);
      app.innerHTML = pageFiche(p);
      return;
    }
    if(segs[0]==='profil' && segs[2]==='mission'){
      if(!requireAuth()) return;
      setHeader('Confirmer la mission',true);
      app.innerHTML = pageMission(segs[1]);
      return;
    }
    if(segs[0]==='profil' && segs[2]==='avis'){
      if(!requireAuth()) return;
      setHeader('Laisser un avis',true);
      app.innerHTML = pageAvis(segs[1]);
      return;
    }

    app.innerHTML = `<div class="card"><p>Page introuvable.</p></div>`;
  }catch(e){
    app.innerHTML = `<div class="card"><h3>Erreur</h3><p class="small">${esc(e.message)}</p><button class="block" onclick="router()">Réessayer</button></div>`;
  } finally { clearTimeout(to); }
}
window.addEventListener('hashchange', router);

    </div>

    <div class="onb-slide" data-slide="2">
      <div class="onb-deco d1"></div><div class="onb-deco d2"></div>
      <div class="onb-title">La <span>solution</span></div>
      <p class="onb-text">Un portfolio numérique. Un badge vérifié par les employeurs. Un QR code consultable partout.</p>

    <div class="onb-slide" data-slide="3">
      <div class="onb-deco d1"></div><div class="onb-deco d2"></div>
      <div class="onb-title">Comment <span>commencer</span> ?</div>
      <div class="onb-list">
        <div class="onb-item"><div class="onb-item-num">1</div><div class="onb-item-txt"><b>Créer un compte</b><span>Email + mot de passe. 30 secondes.</span></div></div>
        <div class="onb-item"><div class="onb-item-num">2</div><div class="onb-item-txt"><b>Choisir ton rôle</b><span>Jeune autodidacte ou employeur.</span></div></div>
        <div class="onb-item"><div class="onb-item-num">3</div><div class="onb-item-txt"><b>Commencer</b><span>Créer ton profil ou publier une offre.</span></div></div>
      </div>
    </div>

    <div class="onb-bottom">
      <div class="onb-dots" id="onbDots">
        <div class="onb-dot active"></div><div class="onb-dot"></div><div class="onb-dot"></div><div class="onb-dot"></div>
      </div>
      <div class="onb-buttons">
        <button class="ghost" id="onbPrev" onclick="onbPrev()" style="display:none">Retour</button>
        <button id="onbNext" onclick="onbNext()">Suivant</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  window._onbIndex=0;
}
function onbNext(){
  const s=document.querySelectorAll('.onb-slide'), d=document.querySelectorAll('.onb-dot');
  if(window._onbIndex>=s.length-1){ closeOnboarding(true); return; }
  s[window._onbIndex].classList.remove('active');
  d[window._onbIndex].classList.remove('active');
  window._onbIndex++;
  s[window._onbIndex].classList.add('active');
  d[window._onbIndex].classList.add('active');
  document.getElementById('onbPrev').style.display = window._onbIndex>0?'block':'none';
  document.getElementById('onbNext').textContent = (window._onbIndex>=s.length-1)?'Commencer':'Suivant';
}
function onbPrev(){
  const s=document.querySelectorAll('.onb-slide'), d=document.querySelectorAll('.onb-dot');
  if(window._onbIndex<=0) return;
  s[window._onbIndex].classList.remove('active');
  d[window._onbIndex].classList.remove('active');
  window._onbIndex--;
  s[window._onbIndex].classList.add('active');
  d[window._onbIndex].classList.add('active');
  document.getElementById('onbPrev').style.display = window._onbIndex>0?'block':'none';
  document.getElementById('onbNext').textContent = 'Suivant';
}
function closeOnboarding(goAuth){
  const ov = document.getElementById('onbOverlay');
  if(ov) ov.remove();
  localStorage.setItem('zua_onb_seen','1');
  if(goAuth) nav('/auth');
}

function onAuthTypeChange(){
  const t = document.getElementById('a-type').value;

async function inscription(btn){
  const email = document.getElementById('a-email').value.trim();
  const pwd = document.getElementById('a-password').value;
  const type = document.getElementById('a-type').value;
  const cat = document.getElementById('a-cat')?.value || null;
  if(!email || !pwd){ alert('Remplis tous les champs'); return; }
  btn.disabled=true; btn.textContent='Création…';
  const data = await apiPost('/auth/inscription',{email,password:pwd,type,employeur_categorie:cat});
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Créer mon compte'; return; }
  setToken(data.token);
  await chargerCompte();
  const r = document.getElementById('authRedirect').value;
  if(r && r !== '/') nav(r);
  else if(authCompte && authCompte.type === 'employeur') nav('/employeur');
  else nav('/jeune/creer');
}
async function connexion(btn){
  const email = document.getElementById('a-email').value.trim();
  const pwd = document.getElementById('a-password').value;
  if(!email || !pwd){ alert('Remplis tous les champs'); return; }
  btn.disabled=true; btn.textContent='Connexion…';
  const data = await apiPost('/auth/connexion',{email,password:pwd});
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Se connecter'; return; }
  setToken(data.token);
  await chargerCompte();
  const r = document.getElementById('authRedirect').value;
  if(r && r !== '/') nav(r);
  else if(authCompte && authCompte.type === 'employeur') nav('/employeur');
  else if(authCompte && authCompte.profil_id) nav('/jeune/profil');
  else nav('/jeune/creer');
}

function renderQR(id){
  const el = document.getElementById('qr');
  if(!el) return;
  el.innerHTML='';

function ajouterPreuve(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => { await apiPut('/profils/'+authCompte.profil_id+'/preuve',{preuve:r.result}); router(); };
  r.readAsDataURL(f);
}

async function payerVitrine(btn){
  const ref = document.getElementById('v-ref').value.trim();

async function postuler(missionId){
  if(!authToken){ nav('/auth?redirect=/missions'); return; }
  if(!authCompte || authCompte.type!=='jeune'){ alert('Crée un compte jeune pour postuler.'); return; }
  if(!authCompte.profil_id){ alert('Crée d\'abord ton profil.'); nav('/jeune/creer'); return; }
  const data = await apiPost('/missions/'+missionId+'/postuler');
  if(data.error){ alert(data.error); return; }
  alert('Candidature envoyée.');
}

/* ============ PUBLIER OFFRE ============ */
function pagePublier(){
  const cat = (authCompte && authCompte.employeur_categorie)||'particulier';
  const isVerified = !!(authCompte && authCompte.employeur_id);
  const canPublishLong = isVerified && (cat==='entreprise'||cat==='soustraitance'||cat==='institution');
  return `
  <div class="card">
    <h3>${I.plus} Publier une offre</h3>
    <p class="small">Type : <b>${esc(cat)}</b> ${isVerified?'<span class="badge verifie">VÉRIFIÉ</span>':'<span class="badge nonverifie">NON VÉRIFIÉ</span>'}</p>
    ${!isVerified?`<div class="principle">Vérifie ton profil employeur d'abord.</div>`:''}
    <label>Titre</label><input id="mi-titre" placeholder="Ex: 2 serveurs pour un mariage">
    <label>Description</label><textarea id="mi-desc" rows="3"></textarea>
    <label>Type de contrat</label>
    <select id="mi-type">
      <option value="mission">Mission ponctuelle</option>
      ${canPublishLong?`<option value="cdd">CDD</option><option value="cdi">CDI</option><option value="stage">Stage</option><option value="apprentissage">Apprentissage</option>`:''}
    </select>
    <label>Durée</label>
    <select id="mi-duree">
      <option value="courte">Courte (1-3 jours)</option>
      ${canPublishLong?`<option value="longue">Longue durée</option>`:''}
    </select>
    ${!canPublishLong?`<div class="small" style="margin-top:6px">Les offres longues sont réservées aux entreprises vérifiées RCCM.</div>`:''}
    <label>Commune</label><input id="mi-commune" placeholder="Ex: Gombe">
    <label>Budget / salaire</label><input id="mi-budget" placeholder="Ex: 20 $/jour, 250 $/mois...">
    <label>Nombre de personnes</label><input id="mi-nb" type="number" min="1" value="1">
    <label>Contact</label><input id="mi-contact" placeholder="+243 ...">
    <button class="block" style="margin-top:14px" onclick="publier(this)" ${!isVerified?'disabled':''}>Publier l'offre (3-5 $)</button>
  </div>`;
}
async function publier(btn){
  const titre = document.getElementById('mi-titre').value.trim();
  if(!titre){ alert('Donne un titre.'); return; }
  btn.disabled=true; btn.textContent='Publication…';
  const data = await apiPost('/missions',{
    titre,
    description:document.getElementById('mi-desc').value.trim(),
    commune:document.getElementById('mi-commune').value.trim(),
    budget:document.getElementById('mi-budget').value.trim(),
    nombre_personnes:parseInt(document.getElementById('mi-nb').value,10)||1,
    duree:document.getElementById('mi-duree').value,
    type_contrat:document.getElementById('mi-type').value,
    contact:document.getElementById('mi-contact').value.trim()
  });
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Publier'; return; }
  alert('Offre publiée.');
  nav('/missions');
}

/* ============ CANDIDATURES EMPLOYEUR ============ */
function pageCandidatures(list){
  const newCount = (list||[]).filter(c=>c.statut==='nouvelle').length;
  const items = (list||[]).length ? list.map(c=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">
        <b style="font-size:.86rem">${esc(c.profil_nom||'—')}</b>
        ${c.statut==='nouvelle'?'<span class="badge premium">NOUVELLE</span>':''}
      </div>
      <div class="small">${esc(c.profil_metier||'')} · ${esc(c.profil_commune||'')}</div>
      <div class="small" style="margin-top:5px">Pour : <b>${esc(c.mission_titre||'—')}</b></div>
      <div class="small" style="margin-top:3px">${I.phone} ${esc(c.profil_contact||'—')}</div>
      <div style="margin-top:9px;display:flex;gap:6px">
        <button class="gold" style="flex:1" onclick="alert('Acceptée. Le jeune sera notifié.')">Accepter</button>
        <button class="secondary" style="flex:1" onclick="alert('Refusée.')">Refuser</button>
      </div>
    </div>`).join('') : '<div class="card"><p class="small">Aucune candidature.</p></div>';
  return `
  ${newCount>0?`<div class="notif">${I.bell}<div>${newCount} nouvelle(s) candidature(s).</div></div>`:''}
  ${items}`;
}

/* ============ EMPLOYEUR ACCUEIL ============ */
function pageEmployeur(){
  const cat = (authCompte && authCompte.employeur_categorie)||'particulier';
  const isVerified = !!(authCompte && authCompte.employeur_id);
  return `
  <div class="card">
    <h3>${I.brief} Espace employeur</h3>
    <p class="small">Catégorie : <b>${esc(cat)}</b> ${isVerified?'<span class="badge verifie">VÉRIFIÉ</span>':'<span class="badge nonverifie">NON VÉRIFIÉ</span>'}</p>
    ${!isVerified?`
      <label>${cat==='particulier'?'Ton numéro (SMS)':'Numéro RCCM'}</label>
      <input id="verif-ref" placeholder="${cat==='particulier'?'+243 9...':'CD/KNG/RCCM/...'}">
      <button class="secondary block" style="margin-top:10px" onclick="verifierEmployeur(this)">Vérifier mon profil</button>
      <div class="principle">Seuls les employeurs vérifiés peuvent publier et noter.</div>
    `:`
      <a class="tile" href="#/employeur/publier"><button class="gold block" style="margin-bottom:8px">${I.plus} Publier une offre</button></a>
      <a class="tile" href="#/employeur/candidatures"><button class="secondary block" style="margin-bottom:8px">${I.bell} Voir candidatures</button></a>
      ${(cat==='institution')?`<a class="tile" href="#/institution/dashboard"><button class="secondary block">${I.badge} Rapports</button></a>`:''}
    `}
    <label style="margin-top:16px">Métier recherché</label>
    <input id="e-metier" placeholder="Ex: couture, mécanique...">
    <label>Commune</label>
    <input id="e-commune" placeholder="Ex: Matete, Gombe...">
    <button class="block" style="margin-top:12px" onclick="rechercheEmployeur()">${I.search} Rechercher un profil</button>
  </div>`;
}
async function verifierEmployeur(btn){
  const ref = document.getElementById('verif-ref').value.trim();
  if(!ref){ alert('Renseigne la référence.'); return; }
  btn.disabled=true; btn.textContent='Vérification…';
  const data = await apiPost('/employeurs/verifier',{reference:ref});
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Vérifier'; return; }
  await chargerCompte();
  alert('Profil employeur vérifié.');
  router();
}
function rechercheEmployeur(){
  const m = encodeURIComponent(document.getElementById('e-metier').value.trim());
  const c = encodeURIComponent(document.getElementById('e-commune').value.trim());
  nav('/employeur/resultats?metier='+m+'&commune='+c);
}

/* ============ RESULTATS ============ */
function pageResultats(params){
  const metier = (params.get('metier')||'').toLowerCase();
  const commune = (params.get('commune')||'').toLowerCase();
  const filt = p => (!metier||p.metier.toLowerCase().includes(metier)) && (!commune||p.commune.toLowerCase().includes(commune));
  const f = profiles.filter(filt);
  const sorted = f.slice().sort((a,b)=>{ const r=rk(b.badge)-rk(a.badge); if(r)return r; const m=(parseFloat(b.moyenne)||0)-(parseFloat(a.moyenne)||0); if(m)return m; return (b.nb_avis||0)-(a.nb_avis||0); });
  const listHtml = sorted.length ? sorted.map(p=>`
    <div class="result">
      <a href="#/profil/${p.id}">
        <b>${esc(p.nom)}</b> <span class="badge ${p.badge}">${bLabel(p.badge)}</span>
        ${p.vitrine_premium==1?' <span class="badge premium">PREMIUM</span>':''}
        <div class="small" style="margin-top:3px">${esc(p.metier)} · ${esc(p.commune)} · ${p.nb_avis>0?stars(parseFloat(p.moyenne))+' ('+p.nb_avis+')':'aucun avis'}</div>
      </a>
    </div>`).join('') : '<p class="small">Aucun profil.</p>';
  return `<div class="card"><h3>${I.search} Résultats</h3><p class="small" style="margin-bottom:10px">Classement par mérite uniquement.</p>${listHtml}</div>`;
}

/* ============ FICHE PROFIL ============ */
function pageFiche(p){
  if(!p || p.error) return `<div class="card"><p>Profil introuvable.</p></div>`;
  const a = (p.avis||[]).slice(0,5);
  const ah = a.map(x=>`<div class="avisItem"><div class="stars">${stars(x.note)}</div><div style="margin-top:4px">${esc(x.commentaire||'')}</div>${x.reponse?`<div class="reponse"><b>Réponse :</b> ${esc(x.reponse)}</div>`:''}</div>`).join('')||'<p class="small">Pas encore d\'avis.</p>';
  const dejaNote = (p.avis||[]).some(x=>x.employeur_id === (authCompte?.employeur_id));
  const isPremium = p.vitrine_premium == 1;
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div style="min-width:0;flex:1"><h3 style="margin:0">${esc(p.nom)}</h3><div class="small">${esc(p.metier)} · ${esc(p.commune)}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <span class="badge ${p.badge}">${bLabel(p.badge)}</span>
        ${isPremium?'<span class="badge premium">PREMIUM</span>':''}
      </div>
    </div>
    <p class="small" style="margin:12px 0">${esc(p.description||'')}</p>
    ${p.preuve_url?`<img src="${p.preuve_url}" style="max-width:100%;border-radius:10px;margin-bottom:10px">`:''}
    <div class="stars">${(p.avis&&p.avis.length)?stars(avg(p.avis))+' ('+p.avis.length+' avis)':'Pas encore d\'avis'}</div>
    <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">
      <button style="flex:1" onclick="alert('Contact : ${esc(p.contact||'')}')">${I.phone} Contacter</button>
      ${dejaNote?`<button class="secondary" style="flex:1" disabled>Avis déjà laissé</button>`:
        `<a class="tile" href="#/profil/${p.id}/mission" style="flex:1"><button class="gold block">J'ai réalisé une mission</button></a>`}
    </div>
    <div class="principle">Un avis n'est possible qu'après confirmation mutuelle de la mission.</div>
    <h4>Avis récents</h4>
    ${ah}
  </div>`;
}

/* ============ MISSION ============ */
function pageMission(id){
  return `
  <div class="card">
    <h3>${I.check} Confirmer la mission</h3>
    <p class="small">Les deux parties confirment avant notation.</p>
    <div class="checkline"><input type="checkbox" id="m-jeune"><label style="margin:0">Le prestataire confirme la mission</label></div>
    <div class="checkline"><input type="checkbox" id="m-emp"><label style="margin:0">L'employeur confirme la mission</label></div>
    <button class="block" style="margin-top:14px" onclick="confirmerMission(${id})">Continuer vers la notation</button>
  </div>`;
}
function confirmerMission(id){
  if(!document.getElementById('m-jeune').checked || !document.getElementById('m-emp').checked){ alert('Les deux parties doivent confirmer.'); return; }
  nav('/profil/'+id+'/avis');
}

/* ============ AVIS ============ */
let noteChoisie = 0;
function pageAvis(id){
  noteChoisie = 0;
  return `
  <div class="card">
    <h3>Noter ce profil</h3>
    <p class="small">Ta note alimente le badge.</p>
    <div class="star-pick" id="starPick" style="margin:14px 0">${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="pickStar(${n})">★</span>`).join('')}</div>
    <label>Commentaire (optionnel, 180 max)</label>
    <textarea id="commentaire" rows="3" maxlength="180"></textarea>
    <button class="block" style="margin-top:14px" onclick="validerAvis(${id},this)">Envoyer l'avis</button>
  </div>`;
}
function pickStar(n){ noteChoisie=n; document.querySelectorAll('#starPick span').forEach((s,i)=>s.classList.toggle('on',i<n)); }
async function validerAvis(id, btn){
  if(!noteChoisie){ alert('Choisis une note.'); return; }
  btn.disabled=true; btn.textContent='Envoi…';
  const data = await apiPost('/avis',{profil_id:parseInt(id,10),note:noteChoisie,commentaire:document.getElementById('commentaire').value});
  if(data.error){ alert(data.error); btn.disabled=false; btn.textContent='Envoyer'; return; }
  alert('Avis enregistré. Badge : '+bLabel(data.badge));
  nav('/profil/'+id);
}

/* ============ STATS ============ */
function pageStats(s){
  if(!s||s.error) return `<div class="card"><p>Erreur.</p></div>`;
  const c = (s.par_commune||[]).map(x=>`<div class="result"><span>${esc(x.commune||'—')}</span><b>${x.total}</b></div>`).join('')||'<p class="small">Aucune donnée.</p>';
  const m = (s.par_metier||[]).map(x=>`<div class="result"><span>${esc(x.metier||'—')}</span><b>${x.total}</b></div>`).join('')||'<p class="small">Aucune donnée.</p>';
  const b = (s.par_badge||[]).map(x=>`<div class="result"><span class="badge ${x.badge}">${bLabel(x.badge)}</span><b>${x.total}</b></div>`).join('')||'<p class="small">Aucune donnée.</p>';
  return `
  <div class="card">
    <h3>Rapport ZUA MOSALA</h3>
    <div style="display:flex;gap:8px;margin:12px 0">
      <div style="flex:1;background:var(--light);padding:11px;border-radius:10px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--blue)">${s.total_profils||0}</div><div class="small">Profils</div></div>
      <div style="flex:1;background:var(--light);padding:11px;border-radius:10px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--red)">${s.total_avis||0}</div><div class="small">Avis</div></div>
      <div style="flex:1;background:var(--light);padding:11px;border-radius:10px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--gold)">${s.total_missions||0}</div><div class="small">Offres</div></div>
    </div>
  </div>
  <div class="card"><h4>Profils par commune</h4>${c}</div>
  <div class="card"><h4>Profils par métier</h4>${m}</div>
  <div class="card"><h4>Répartition des badges</h4>${b}</div>`;
}

/* ============ NOTIF BADGE ============ */
async function checkNotif(){
  if(!authToken || !authCompte || authCompte.type!=='jeune') return;
  try{
    const d = await apiGet('/notifications/count');
    notifCount = d.count||0;
    updateNotifBadge();
  }catch(e){}
}
function updateNotifBadge(){
  const dot = document.getElementById('notifDot');
  if(dot) dot.style.display = notifCount>0?'block':'none';
}

/* ============ INIT ============ */
(async function init(){
  await chargerCompte();
  updateAuthUI();
  router().catch(e=>console.error(e));
  setInterval(checkNotif, 30000);
})();
</script>
</body>
</html>
